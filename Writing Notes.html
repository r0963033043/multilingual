<script type="text/plain" id="md-zh"># IELTS Writing 技巧與句型整理

整理自：Task 2〈四天工作週〉、Task 1〈五國失業率折線圖〉兩篇練習踩過的坑、課本 Ch.19 優缺點題的解析、筆記本上的段落配置與模板。

**記號說明**：「A / B」= 二選一的替換寫法，不是句子的一部分（例：the benefits outweigh / are of more importance than the drawbacks = 兩句擇一）；「[ ]」= 依題目代入；「…」= 省略，自己補內容。

---

## 0. 交卷前檢查清單（兩題共用）

照「最常漏」的順序排：

1. **主詞是數字，不是國家**（Task 1）：the rate in Spain rose，不是 Spain rose。
2. **單複數**：all / fewer / many / 泛指一群 → 複數（interests, mistakes, professions, workers）。
3. **詞性**：experience + 名詞；feel + 形容詞；less / more + 形容詞（要跟 happier 平行）。
4. **搭配**：improve + quality / health / balance；boost / increase + happiness / morale。
5. **冠詞**：the UK、the United Kingdom。
6. **時態**：Task 1 全篇過去式；Task 2 以一般現在式為主。
7. **拼字**：UK / US 二選一，全篇一致。
8. **重複**：同一個字或同一結構在相鄰句子連用（making them… / making it…）。
9. **字數**：Task 1 ≥ 150（目標 170–190）；Task 2 ≥ 250（目標 250–280）。
10. **抄題目**：借題目的名詞可以，整句照抄會扣分。
11. **不用縮寫**：don't → do not、it's → it is、can't → cannot（老師標的）。

**找替換詞的四關**：詞性對、單複數對、跟前後字搭得自然、放進段落邏輯合理（而且不重複）。

---

## 1. Task 1（20 分鐘，≥ 150 字）

<!-- toc-group: 折線圖與通用技巧 -->

### 1.1 結構

| 段落 | 內容 | 句數 | 字數 |
|---|---|---|---|
| Intro | 改寫題目一句話（換動詞、換語態） | 1 | 15–20 |
| Overview | 主趨勢 + 最醒目的特徵；不放數字或只放關鍵數字 | 2 | 25–40 |
| Body 1 | 起點年份的排名與數字 → 到中段的變化 | 3–4 | 45–60 |
| Body 2 | 後段變化到終點；比較與排名 | 4–5 | 55–75 |

合計 150–195，目標 170–190。（定稿實際：17 / 29 / 50 / 78）

- 時間分配：2 分鐘讀圖、數清楚每條線的方向 → 15 分鐘寫 → 3 分鐘照清單檢查。
- 只有一句的段落要併進相鄰段。

### 1.2 技巧

1. 寫 overview 之前先數清楚每條線的方向（例：五國四升一降）。漏掉一條線就是 Task Achievement 扣分。
2. 反轉、交叉、最高最低易位是全圖亮點，放進 overview（例：Germany 從最高變最低）。
3. 主詞用數字：the rate in X / unemployment in X / X's unemployment rate，或改成 X saw a rise to…。
4. **幅度 vs 速度**：一年之內的變化只談幅度（slightly）；跨多年的變化才談速度或方式（steadily, gradually）。幾個國家掉的幅度不同時，用 converge 直接講結果，不必選副詞。
5. respectively 緊跟在配對的數字後面：…to 20% and 14% respectively。
6. 排名要精確：14% 是第二高 → the two highest，不是 the highest。
7. by + 過去年份可以搭過去完成式（By 2007, the rates had converged…），是文法加分項。
8. 用 figures / rates，不用 numbers；用 the other four / the remaining four，不用 the rest four。
9. Overview 和 body 講同一件事是設計好的（資訊重複可以），說法重複才要改。
10. Whereas / although / while 是從屬連接詞，不能單獨開一句；要對比另起一句用 In contrast, / By contrast,。

### 1.3 時間介系詞

| 用法 | 意思 | 例句 |
|---|---|---|
| in 2005 | 那一年當下（快照） | In 2005, Germany recorded the highest rate at 12%. |
| by 2010 | 到那年為止（變化的終點） | …climbed rapidly to 13% by 2010. |
| from 2005 to 2010 / between 2005 and 2010 | 整段起訖 | Unemployment in the UK rose from 5% to 8% between 2005 and 2010. |
| over the period / over the five years | 整段期間，不帶年份 | Unemployment in Germany declined over the period. |
| during 2008 | 那一年之中 | The rate dipped slightly during 2008. |
| by the end of the period | 期末 | …leaving it the lowest by the end of the period. |

判斷法：講「那一年是多少」→ in；講「變化累積到那一年為止」→ by。
fell to 7.5% **in** 2008 = 下跌就發生在那一年；fell to 7.5% **by** 2008 = 下跌從更早開始、那一年結束。

### 1.4 趨勢動詞與名詞

| 方向 | 動詞（過去式） | 名詞 |
|---|---|---|
| 上升 | rose, increased, climbed, grew, surged（急升）, soared（飆升） | a rise / an increase / growth / a surge in… |
| 下降 | fell, dropped, declined, decreased, dipped（小跌）, plunged / plummeted（急跌） | a fall / a drop / a decline / a decrease in… |
| 平穩 | remained stable / steady, stayed constant, levelled off, plateaued | a plateau |
| 波動 | fluctuated | fluctuations |
| 高低點 | peaked at, reached a high / low of, bottomed out at | a peak of… / a low of… |
| 匯合 | converged at (around 8%) | — |
| 反轉、超越 | reversed, overtook | a reversal |

名詞句型：There was a dramatic rise in Spain's unemployment rate, from 9% to 20%. / Spain saw a sharp increase of 11 percentage points.

### 1.5 副詞

- **幅度**：slightly / marginally（小）、moderately（中）、considerably / significantly / substantially（大）、dramatically / sharply（很大，且隱含快）
- **速度、方式**：gradually / steadily / slowly、rapidly / quickly、consistently
- 常見搭配：rose dramatically、fell slightly、declined steadily、increased gradually、remained broadly stable

### 1.6 比較與排名句型

- X recorded the highest rate at 12%, followed by Y at 10% and Z at 9%.
- X and Y had considerably lower figures, at 5% and 4% respectively.
- …, making them the two highest figures by 2010.
- …, leaving it the lowest of the five countries by 2010.
- Unemployment declined in X, which took it from the highest to the lowest.
- X was the only country whose rate fell.
- The rates in X, Y and Z converged at around 8%.
- X's rate was twice as high as Y's. / X overtook Y in 2008.
- The following three years saw further changes. / 2008 marked a turning point for four of the five countries.
- The most striking feature is that…

### 1.7 Intro 改寫

- The line graph illustrates / shows / compares how unemployment rates changed in five European countries between 2005 and 2010.
- Changes in unemployment rates in five European countries between 2005 and 2010 are illustrated in the line graph.（被動）
- 換字：shows → illustrates / compares / gives information about；percentage → proportion；from … to … → between … and … / over a five-year period

### 1.8 完成稿範例（自己修到定稿的版本，約 174 字）

> Changes in unemployment rates in five European countries between 2005 and 2010 are illustrated in the line graph.
>
> Overall, unemployment declined in Germany, which took it from the highest to the lowest. In contrast, the rates of the other four countries increased, although there were some fluctuations.
>
> In 2005, Germany recorded the highest rate at 12%, followed by Greece at 10% and Spain at 9%. The UK and Ireland had considerably lower figures, at 5% and 4% respectively. By 2007, the three highest rates dropped to a similar level of around 8%, and the rest remained stable.
>
> The following three years saw further changes. The rates in Spain and Ireland rose dramatically to 20% and 14% respectively, making them the two highest figures by 2010, while the rate in Greece fell slightly to 7.5% in 2008 and climbed rapidly to 13% by 2010. Unemployment in the UK increased consistently from 5% to 8%.
>
> By contrast, the rate in Germany declined steadily from 8% to 7%, leaving it the lowest of the five countries by 2010.

從 7 往 7.5 走：一兩個高分字（converge, plateau, surge, peak at）、一次用對的過去完成式、把 2008 當四國共同的轉折點來寫。

### 1.9 靜態圖（bar chart，沒有時間軸）的寫法

沒有時間軸就沒有「趨勢」，全篇是「比較」：

- 動詞換成 had / stood at / recorded / accounted for，不用 rose / fell。
- 時態：圖表本身用現在式（The bar chart shows…），但 2005 年的數據用過去式（Poland had…）。
- Overview 要寫兩件事：① 極端值（哪國最高、哪國最低）；② 跨類別的共同模式（例：每個國家的青年失業率都遠高於整體，大約兩倍）。漏第二件是 Task Achievement 最常見的扣分。
- Body 1 寫兩個極端（最高 vs 最低，帶實際數字）；Body 2 寫中間組，先一個類別再另一個類別，每句只做一組比較。
- 分數比較（one fifth, two thirds）是加分，但至少要配一次實際數字；只寫分數不寫數字，考官會認為你沒有報數據。
- 差距用 percentage points，不用 percent：3.5 percentage points lower。（3.5 percent lower 是相對量「低 3.5%」，意思不同。）
- rate 是高低不是多少：as high as，不是 as much as；as much rate as 不成立。

**比較句型**

- X's rate was twice / three times as high as Y's. / …was double the figure for Y.
- Y's figure was only half / a third / two thirds of X's. / …roughly a fifth of the Polish rate.
- X was 3.5 percentage points lower than Y. / X exceeded Y by 5 percentage points.
- X had the second-highest rate, at 24%, followed by Y at 17.5%.
- In every country, the rate for young adults was considerably higher than the overall rate.
- The gap between the two groups was widest in X and narrowest in Y.
- X and Y recorded almost identical figures, at around 7.5%.
- 連接與修飾：compared with / whereas / while / by contrast / respectively / just / only / approximately / the population as a whole

### 1.10 練習：Bar chart（2005 年五國青年 vs 整體失業率）——第一稿，待修

> The bar chart shows the percentage of unemployment rates among young adults and total population in five European countries in 2005.
>
> Overall, Poland has the highest unemployment levels in all ages. In contrast, Denmark has the lowest rates, and much lower than other countries.
>
> In more specific terms, Poland has 35 percent of young adults and 15 percent for total that don't have jobs, compared with Denmark which has approximately one fifth as much as Poland among young adults and one sixth as much as in total.
>
> Turning to the unemployment rates in the other (three) countries, as for the unemployment rates among young people, Italy has two thirds as much rate as Poland, while Hungary has half as much as Poland, Germany is 3.5 percent lower than Hungary, which has twice as much as Denmark. However, as for the unemployment rates of total, Germany has higher rates, which has two thirds as much rate as Poland, Italy and Hungary both have half as much rate as Poland.

**待修清單**

1. Overview 缺第二個特徵：五國的青年失業率都遠高於整體。
2. 時態：2005 年的數據全部改過去式（has → had）。
3. in all ages → 只有兩個類別，改成 for both groups。
4. and much lower than other countries → 比較不完整，補主詞和 the。
5. the percentage of unemployment rates → rates 已經是百分比，二選一。
6. don't have jobs → 口語，改成 were unemployed / out of work；for total → of the total population。
7. as much rate as ×3 → 用 as high as，或 of X's figure；三處換成不同結構。
8. 3.5 percent lower → 3.5 percentage points lower。
9. which has twice as much as Denmark → which 指涉不清（Hungary 還是 Germany？）。
10. 第四段是 comma splice 串成的長句，拆成 3–4 句；Turning to… 和 as for… 疊在一起，留一個；括號拿掉。
11. Italy、Hungary、Germany 沒有任何實際數字，至少各補一個。
12. Germany has higher rates → 高於誰？寫成 the second-highest rate。

估分：這稿約 6.0。修好 1、2、7、10、11 就到 6.5；再把比較句型換成 1.9 的寫法可以碰到 7。

### 1.11 流程圖（Process diagram）

**兩種流程**
- 製造／生產流程：東西怎麼做出來（咖啡、紙、磚塊、回收塑膠、玻璃）
- 自然流程：自然的循環或發展（水循環、蝴蝶生命週期、植物生長、岩石形成）

**結構（4 段）**

| 段落 | 內容 | 句數 | 字數 |
|---|---|---|---|
| Intro | 改寫題目，說明圖在講什麼流程 | 1 | 15–20 |
| Overview | 幾個主要階段、從哪裡開始、在哪裡結束、直線還是循環；不放細節和數字 | 1–2 | 25–40 |
| Body 1 | 前半段流程 | 3–5 | 55–70 |
| Body 2 | 後半段流程 | 3–5 | 55–70 |

**寫 Overview 前先問自己四個問題**
1. 從哪裡開始？
2. 在哪裡結束？
3. 有幾個主要階段？（把細的步驟合併成 2–4 大段）
4. 是直線（linear）還是循環（cyclical）？

**Overview 模板**
- Overall, it is a linear / cyclical process which consists of [three] main stages, involving [twelve] steps in total, beginning with the [noun] of … and ending with the [noun] of … .

<!-- -->

- Overall, it is a linear / cyclical process **which consists of** …
- Overall, it is a linear / cyclical process **consisting of** …

<!-- -->

- Overall, the process consists of **[three] main stages, involving [twelve] steps in total**, beginning with … .
- Overall, the process consists of **[number] main stages**, beginning with … .
- Overall, the process consists of **[twelve] steps, which can be divided / grouped into [three] main stages**, beginning with … .
- It is a linear / cyclical process.

注意：the … of 中間放名詞或 V-ing（the sorting of beans、the packaging of the finished product）；the 和 of 要一起出現；有現成名詞時優先用名詞（production、storage、delivery、sale，不用 the producing of）；steps 是圖上的小步驟，main stages 是合併後的大段；and ending 前面不加逗號。

**排序用語**

開始：
  * Initially,
  * First of all,
  * To begin with,
  * The first stage is to…
  * At the beginning of the process,

中間：
  * After that,
  * Once this stage / step is complete,
  * The next stage / step involves…
  * Following this,
  * Subsequently,
  * Afterwards,
  * At this point,
  * Next,

結束：
  * Finally,
  * Lastly,
  * The final stage is to…
  * The last stage involves…
  * Eventually,

**排序小技巧**

- 不要一直用 Then：換著用「中間」那一組，或把 then 放進句子裡（The beans are then roasted.）。
- 兩個緊連的小步驟可以合成一句：The beans are sorted by hand and then cleaned.

**流程動詞**
- 開始：begin / start
- 加工：process / treat / transform / convert / crush / grind / heat / cool / dry / wash / filter / separate / mix / combine
- 結束：pack / package / distribute / transport / deliver；名詞 the finished product

**文法重點**
- **被動語態**：製造流程的主角是「東西」，不是「做的人」。公式：主詞 + am / is / are + 過去分詞。
  * Workers sort the beans. → The beans are sorted by hand.
  * Machines grind the beans. → The beans are ground.
- **時態**：流程是一般現在式（跟折線圖用過去式不同）。
- **主詞與動詞一致**：The beans **are** roasted.／The coffee **is** packed.（coffee 不可數，用 is）
- 不用 by workers / by machines，除非「用什麼做」是重點（例如 by hand）。

### 1.12 練習：咖啡乾式製程（12 個步驟）

**規劃**（直線流程，12 個步驟 → 3 個主要階段）
- 階段 1 在農場（1–5）：人工挑豆 → 篩子清洗 → 日曬四週 → 耙動翻面 → 存入穀倉
- 階段 2 在加工廠（6–9）：運到 mill → 去殼 → 分級 → 裝袋
- 階段 3 烘焙與零售（10–12）：賣出 → 烘焙 → 包裝販售
- Body 1 寫農場，Body 2 寫加工廠到零售

**圖上的字**

| 單字 | 意思 |
|---|---|
| sieve (n./v.) | 篩子；用篩子把小東西和大東西分開 |
| rake (v.) | 用耙子翻動、耙平 |
| silo (n.) | 儲存穀物的高圓塔 |
| mill (n.) | 加工廠（原意是把穀物磨成粉的建築） |
| hull (v.) / hulling | 去掉種子外層的殼 |
| grade (v.) / grading | 依品質分級（好豆、壞豆） |

**句型示範**
- Intro：
  * The diagram illustrates the process involved in producing dry-roasted coffee.
  * The process involved in producing dry-roasted coffee is illustrated in the given diagram.
- Overview：
  * Overall, the process consists of twelve steps, which can be divided into three main stages: preparation on the farm, processing at a mill, and roasting before the coffee is packed and sold.
  * It is a linear process, beginning with the sorting of beans by hand and ending with the sale of the packaged product.

### 1.13 課本範例（二）果醬製程：段落拆解

課本 Ch.10 的高分範文（流程圖：水果果醬的製作，9 個步驟，約 163 字）。原文請看課本；這裡只拆它的寫法。

| 段落 | 點 | 推進 |
|---|---|---|
| Intro + Overview（合成一段） | Intro | 改寫題目：圖說明製作果醬的程序（用 procedure 換掉 process） |
| | Overview | **Overall, it is clear that** + 共幾個步驟 → **beginning with … and ending with …**（起點、終點）→ **namely**（點名兩個主要階段：準備、烹煮） |
| Body 1：準備階段 | 1. 挑選 | **The first stage of the process is** + V-ing：挑出熟成的水果 |
| | 2. 清洗 | **At the next stage**（中間）：被動 is washed + **to remove**（目的）：去掉蟲和髒污 |
| | 3. 去皮去籽 | **Then**（中間）：被動 are removed + **, leaving …**（結果）：只剩果肉 |
| | 4. 打泥加料 | **Subsequently**（中間）：被動 is pulped + **and then** 接下一個動作：加入糖、檸檬酸、果膠 |
| Body 2：烹煮階段 | 5. 加熱 | **During the cooking stage**（切入）：被動 is heated **and then** cooked，帶出時間（約 15 分鐘） |
| | 6. 裝罐封口 | **After the mixture has cooled**（完成式，表示前一步做完）→ 被動 is poured + **, which are then sealed**（關係子句接下一步）+ **to preserve**（目的） |
| | 7. 儲存 | **can then be stored**（情態動詞 + 被動）：最後一步 |

為什麼高分：
- Overview 一句就回答了 1.11 的四個問題裡的三個：幾個步驟、從哪開始、在哪結束，再用 namely 把 9 步收成 2 個階段。
- Body 1 = 第一個階段、Body 2 = 第二個階段，分段跟 overview 講的階段完全對應。
- 幾乎每句都是被動，主角一直是水果和果醬，不是做的人。
- 排序詞不重複：The first stage → At the next stage → Then → Subsequently → During → After。
- 用一句話串起兩個步驟，不是一步一句：and then、, leaving …、, which are then …。

值得學的五個結構：
- 目的：被動 + **to + 動詞**（is washed to remove …、are sealed to preserve …）
- 結果：**, leaving …**（分詞構句，說明做完剩下什麼）
- 前一步完成：**After + 主詞 + has + 過去分詞**, …
- 接下一步：**, which are then + 過去分詞**
- 最後一步：**can then be + 過去分詞**

跟 1.11 的差別：這篇把 Intro 和 Overview 合成一段，全文 3 段。兩種都可以；分成 4 段比較清楚，合成一段比較省字。

### 1.14 課本範例：即溶咖啡製程：段落拆解

課本的高分範文（流程圖：即溶咖啡怎麼做，12 個步驟）。原文請看課本；這裡只拆它的寫法。

課本提示（改寫）：
- 12 個步驟很多，要寫得有效率才涵蓋得完：兩個步驟合成一句。
- 主動和被動混著用，不要每句都是同一個句型。
- 一定要有 overview，總結主要階段。

| 段落 | 點 | 推進 |
|---|---|---|
| Intro + Overview（合成一段） | Intro | 改寫題目：flowchart 說明做即溶咖啡的方法（用 method 換掉 process）+ **from … to …**（起點到終點） |
| | Overview | **In general, it is clear from the diagram that** + 共 12 個步驟 → **can be divided into three main phases**（點名三個階段：準備、加工、包裝配送） |
| Body | 1. 採收與乾燥 | **The first stage in the process is** + V-ing **and then** V-ing（主動動名詞，一句兩步） |
| | 2. 烘焙與冷卻 | **At the next stage**（中間）：被動 are roasted **and then** cooled |
| | 3. 研磨與加水 | **Subsequently**（中間）：被動 are ground into a powder **and then** mixed with water |
| | 4. 過濾 | 被動 is strained + **to separate … from …**（目的） |
| | 5. 冷凍乾燥 | **Then**（中間）：被動 is freeze-dried + **, locking …**（結果） |
| | 6. 二次研磨 | **After that**（中間）：被動 is ground for a second time |
| | 7. 真空乾燥與裝罐 | **After it has been ground again**（完成式被動，表示前一步做完）→ 被動 is dried **and then** packed + **ready to be …**（最後的配送和販售） |

為什麼高分：
- 12 個步驟全部涵蓋，但只用了 7 句：幾乎每句都用 and then 放兩個步驟。
- 開頭一句用主動（picking … drying），之後改被動，照提示混著用。
- 排序詞不重複：The first stage → At the next stage → Subsequently → Then → After that → After。
- Overview 用 from … to … 和 three main phases 把 12 步收成 3 段。

可以做得更好的地方：Overview 說有三個階段，但 Body 只有一段。照 1.11 的 4 段結構，把 Body 分成兩段（例如準備＋加工一段、包裝配送一段），分段就會跟 overview 對上。

跟 1.13 果醬範文共用的結構：**to + 動詞**（目的）、**, V-ing …**（結果）、**After + has (been) + 過去分詞**（前一步完成）。這三個是流程圖最常用的高分句型。

## 2. Task 2（40 分鐘，≥ 250 字）

### 2.1 結構與字數（筆記本）

| 段落 | 句數 | 字數 |
|---|---|---|
| Introduction | 3 | ~30 |
| One aspect | 8–9 | 80–90 |
| Another aspect | 8–9 | 80–90 |
| Conclusion | 6–8 | 60–80 |

合計 250–280。（結論寫 2–3 句、40–60 字也足夠，時間不夠時優先保 body。）
時間分配：5 分鐘審題、列點 → 30 分鐘寫 → 5 分鐘檢查。

**One aspect（Body 段）的內部結構：3–4 個點**

| 部分 | 內容 | 句數 | 字數 |
|---|---|---|---|
| 點 1 | 切入詞帶出（In terms of the positive aspects, …），同時當 topic sentence + 至少一個 Support（解釋／結果／理由／例子） | ≥ 2 | 20–40 |
| 點 2 | 補充詞帶出（Moreover, …）+ 至少一個 Support | ≥ 2 | 20–40 |
| 點 3 | 補充詞帶出（Furthermore, … / In addition to this, …）+ 至少一個 Support | ≥ 2 | 20–40 |
| 點 4（可選） | 補充詞帶出（Another advantage is that… / More worryingly, …）+ 至少一個 Support | ≥ 2 | 20–40 |

- 字數對齊：一段 80–90 字的話，3 個點每點約 27–30 字、4 個點每點約 20–22 字；寫到 40 字的點最多一個。一段要超過 90 字，也要照顧結論和另一段的字數，總數停在 250–280。
- 一個點只放一個主張；Support 不是換句話重講，要多給一層（為什麼、會怎樣、例如什麼）。
- 最強或最嚴重的點放最後（More worryingly, …）。
- 範例：2.12 課本 Sample 2 的優點段、缺點段各 4 組，每組就是 Point + Support。

骨架（套 2.4 句型）：
> In terms of the positive aspects, [topic] can [benefit 1]. In other words, / This is because … .（點 1：Point + 解釋或理由）
> Moreover, [benefit 2]. As a result, … .（點 2：Point + 結果）
> Furthermore, / In addition to this, [benefit 3], which can … . For example, … .（點 3：Point + 結果 + 例子）
> Another advantage is that [benefit 4]. This is because … .（點 4，可選：Point + 理由；缺點段用 More worryingly 放最嚴重的點）

各題型的段落骨架與專用句型見 2.5。

### 2.2 技巧（課本解析 + 兩篇踩過的坑）

1. 回答題目的每一部分；結論要明說自己的觀點。
2. 每個論點都要「支撐、發展、延伸」：理由 → 例子 → 結果 → 解釋。一個論點寫透，勝過三個論點各寫一句。
3. 不用把想到的點全寫，挑最好的 2–3 個。
4. 不是列清單：用連接詞和 signposting 把句子串起來（見 2.4）。
5. 同義替換題目的字，不整句照抄（見 2.3）。
6. 內容要具體：do more valuable things → enjoy more leisure time with their families and friends；enjoy life → 補上「做什麼、跟誰」。
7. Intro 的預告要對得上 body：intro 寫 quality of life，body 就講身心健康與休閒。
8. 立場一致：largely agree 之後的讓步段不推翻立場。
9. 例子用具體國家或數據更有力：Several countries, including Iceland, have trialled…
10. 同一段裡「改善健康」不要講兩次：topic sentence 放大的概念（well-being / quality of life），段尾再具體到 physical and mental health。

### 2.3 同義替換（避免重複題目用字）

| 題目常用字 | 替換 |
|---|---|
| advantages | benefits, positive aspects, merits, upsides, arguments in favour of；pros（口語，最多用一次） |
| disadvantages | drawbacks, downsides, negative aspects, arguments against；cons（口語，最多用一次） |
| outweigh | the benefits far outweigh the drawbacks / the drawbacks are outweighed by the benefits / on balance, the advantages are greater than the disadvantages |
| people | individuals, workers, employees, the public, citizens |
| important | essential, crucial, vital, of greater importance |
| improve | enhance, boost（morale / happiness）, raise（standards） |
| big / many | significant, considerable, substantial, a large number of |
| company | business, employer, firm, organisation |
| the working week | working hours, work schedules, a four-day week |
| think | believe, argue, maintain, hold the view that |

### 2.4 共同句型與連接詞（所有 Task 2 題型通用）

**Intro（3 句：背景 → 改寫題目 → 本文要做什麼 / 立場）**

背景：
  * Nowadays, it is often argued that…
  * In recent years, many people have argued that…
  * It is widely believed that…
  * X has become a controversial issue in recent years.

他人觀點（改寫題目）：
  * They believe that…
  * Supporters of this view claim that…

本文要做什麼：
  * This essay will discuss…
  * In this essay, I will…

**Body 的 topic sentence**

切入、分類：
  * In terms of…,
    * In terms of the positive aspects, …
  * As for…,
    * As for the benefits of [topic], …
    * As for the drawbacks of [topic], …
  * Turning to…,
  * With regard to…,

第一點：
  * One major advantage / benefit / drawback of [topic] is that…
    * One major benefit of [topic] is that it improves… / it can improve… / it would improve…
      三種強度：improves = 已確立的事實（強）；can improve = 可能、有潛力（保守，最常用）；would improve = 假設性的政策（題目提議、尚未實施）。雅思偏好適度保守，多用 can / may / could。

補充第二點：
  * Moreover, …
  * Furthermore, …
  * In addition to this, …
  * Another benefit is that…
  * A further problem is that…

**支撐（理由 → 例子 → 結果 → 解釋）**

理由：
  * This is because…
  * This is due to the fact that…
  * The reason for this is that…

例子：
  * For example, [具體國家 / 數據 / 情境]…
  * For instance, …
  * A case in point is…
  * such as… / including…

結果：
  * As a result, …
  * Consequently, …
  * Therefore, …
  * This means that…
  * …, which could / can…

解釋：
  * In other words, …
  * …, which means…

**對比與讓步**

  * However, …
  * Nevertheless, …
  * In contrast, …
  * On the other hand, …
  * More worryingly, …
  * Although…, …
  * While it is true that…, …
  * …, while…
  * …, which may not be suitable for every…

**Conclusion（重申立場 → 一句理由 → 可選的條件或建議；不加新論點）**

開頭：
  * In conclusion,
  * To conclude,
  * To sum up,
  * In summary,
  * Overall,
  * On balance,（適合 outweigh 題）
  * Taking everything into account,

立場：
  * I believe that…
  * I am convinced that…
  * I would argue that…
  * In my view, …
  * It seems to me that…
  * I remain convinced that…（暗示前面有讓步、立場不變）

  立場句要跟 intro 換說法：intro 用 I largely agree with this view，結論用 I remain convinced that / I would argue that。別疊字（In my opinion, I think… 是兩個「我認為」）。

理由：
  * This is because…
  * For these reasons, …

條件或建議：
  * Nevertheless, [governments / employers] should recognise that…

**完整範例（立場 → 理由 → 條件或建議；順序對應 2.5 的 A、B）**

A. Advantages / disadvantages——優點大於缺點（outweigh）：
   To sum up, although there are strong arguments both for and against [topic], I would argue that the benefits outweigh the drawbacks. This is because it offers a practical alternative to [the current situation], while its downsides, such as [drawback], can be managed through strict regulation.

B-1. To what extent——同意：
   In conclusion, I remain convinced that the working week should be shortened where possible, since this would improve work-life balance and could even raise productivity. Nevertheless, governments and employers should recognise that different professions require different working hours.

B-2. To what extent——部分同意：
   On balance, I partly agree with this view: [X] clearly brings [benefit], but it should not be applied to every [sector]. For these reasons, a flexible approach that takes local conditions into account would be more effective than a single rule.

B-3. To what extent——不同意：
   In conclusion, it seems to me that the disadvantages of [X] far outweigh its benefits, mainly because [reason]. Unless [condition], I believe this policy should not be introduced.

### 2.5 題型專用

**A. Advantages / disadvantages（課本 Ch.19）**

題目寫法：What are the advantages and disadvantages of…? / Do the advantages outweigh the disadvantages?

段落骨架：Intro（說明兩面都會談，並預告結論）→ 優點段 → 缺點段 → 結論（明說哪邊更重要，給一個理由）

注意：
- 兩面都要寫，各一段，不能只寫一面。
- 問 outweigh 的話，intro 和 conclusion 都要明說哪邊勝。
- 優缺點的字要輪替：advantages / benefits / positive aspects / merits；disadvantages / drawbacks / downsides / negative aspects。

句型：
- Intro：
  * In this essay, the advantages and disadvantages of [topic] will be discussed, and I will conclude by saying that the benefits outweigh the drawbacks.
  * In this essay, the advantages and disadvantages of [topic] will be discussed, and I will conclude by saying that the benefits are more important than the drawbacks.
  （outweigh 題 intro 就要說出立場；What are the advantages and disadvantages? 題不必表態時，把 that 改成 whether）
  * While [topic] brings several benefits, it also has some drawbacks; this essay will examine both before arguing that…
- 優點段：
  * In terms of the positive aspects, …
  * As for the benefits of [topic], …
  * One major advantage of [topic] is that…
  * Another benefit is that…
  * In addition to this, …
- 缺點段：
  * As for the drawbacks of [topic], …
  * Turning to the negative aspects, …
  * Furthermore, …
  * A further problem is that…
  * More worryingly, …
  * This can lead to…
- 結論第一句（擇一；前半「兩面都有道理」、後半「哪邊勝」，兩半都可以互換）：
  - In conclusion, although there are strong arguments both **for and against** [topic], I believe that the benefits outweigh the drawbacks.（最常見，順序 for 在前）
  - In conclusion, although there are strong arguments both against and **in support of** [topic], I believe that the benefits are of more importance than the drawbacks.
  - In conclusion, although there are strong arguments both **supporting and opposing** [topic], I would argue that the benefits outweigh the drawbacks.
  - In conclusion, although there are strong arguments **on both sides of this debate**, I remain convinced that the benefits outweigh the drawbacks.（不必重複題目字）
  - 課本原句 both against and in favour of [topic] 也可以，只是順序偏彆扭。
- 結論第二句（給理由）：
  * This is because it is essential to find a [practical] and viable alternative to …, and the drawbacks such as … can be dealt with through [strict government regulation].

**B. To what extent do you agree or disagree（四天工作週）**

題目寫法：To what extent do you agree or disagree? / Do you agree or disagree?

段落骨架：Intro（背景 → 改寫題目 → 立場：I largely agree, although…）→ 支持 1 → 支持 2（含例子）→ 讓步段（反方觀點 + 為什麼不推翻立場）→ 結論（重申立場 + 原因 + 補充條件）

注意：
- 「to what extent」要回答「多大程度」：completely / largely / partly，intro 就說清楚，結論再說一次，中間不能變。
- 讓步段是加分項：顯示你看到反方，但用 However / Nevertheless 接回自己的立場；篇幅要小於支持段。

句型：
- 立場：
  * I largely / completely agree with this view, although I believe…
  * To a large extent, I agree that…
  * While I accept that…, I believe…
  * I partly agree: … but …
  * I strongly disagree with this idea because…
- 支持段：
  * One major advantage of [topic] is that it can improve…
  * Another benefit is that [companies] could also gain from this change.
  * Several countries, including Iceland, have trialled…
  * When…, they are often more…, which can benefit [employers] as well.
- 讓步段：
  * However, [topic] may not be suitable for every profession.
  * Admittedly, …
  * It is true that…, but…
  * Therefore, a flexible approach would be more realistic than applying the same rule to all [professions].
- 結論：
  * In conclusion, I believe [topic] should be … where possible because…
  * In conclusion, while there are some drawbacks, I remain convinced that…
  * Nevertheless, governments and employers should recognise that different … require different …

（其他題型——discuss both views、problem / solution——練到再補。）

### 2.6 主題字彙：工作與生活

work-life balance · well-being · quality of life · burnout / exhaustion / stress · heavy workloads · long commuting hours · a lack of personal time · relax / recharge / unwind · pursue hobbies / interests · quality time with loved ones · physical and mental health · productivity / output · morale · motivated / engaged / focused / efficient · retain staff · operate around the clock / 24 hours a day, seven days a week · throughout the week · additional staff · work / time pressure · a flexible / tailored approach · a one-size-fits-all rule

### 2.7 常見錯誤（自己踩過的）

| 寫成 | 應該是 | 規則 |
|---|---|---|
| experience exhaust | experience exhaustion | 動詞後接名詞 |
| feeling more satisfy | feeling more satisfied | feel + 形容詞；人的感受用 -ed |
| less stressful（形容人） | less stressed | -ful 形容事物，-ed 形容人（boring / bored） |
| spend time to do | spend time doing | spend + time + V-ing |
| pursue interest / fewer mistake / all profession | interests / mistakes / professions | 泛指、fewer、all → 複數 |
| employee's salary | employee salaries / employees' salaries | 名詞 + 名詞，或複數所有格 |
| the rest four countries | the other four / the remaining four | rest 後面不能直接接數字 |
| get benefits from / gain profits from | benefit / gain / profit from | 單一動詞 + from，不加名詞 |
| improve happiness | improve well-being / quality of life；boost happiness | 搭配 |
| operate can not stop | operate around the clock | 動詞後接副詞片語，不能再接動詞 |
| through out | throughout | 一個字 |
| 7x24 | 24/7（正式：around the clock） | 順序與寫法 |
| making it from A to B | which took it from A to B | making + 受詞 只能接補語 |
| Whereas + 句子單獨成句 | 併入前句，或用 In contrast, | 從屬連接詞不能單獨開句 |
| Spain rose to 20% | the rate in Spain rose to 20% | 升降的是數字 |
| fell slowly（一年內掉 0.5 點） | fell slightly | 幅度 vs 速度 |
| do more valuable things | enjoy more leisure time with their families and friends | 太籠統 → 具體 |

### 2.8 完成稿範例：四天工作週（To what extent do you agree，約 270 字）

> In recent years, many people have argued that the traditional five-day working week is no longer suitable for modern society. They believe that reducing it to four days would improve people's health and allow people to do more valuable things. I largely agree with this view, although I believe some industries would not allow their employees to reduce their working hours.
>
> One major advantage of a shorter working week is that it can improve people's happiness. Many employees experience exhaustion, long commuting hours and a lack of personal time. Having an extra day off would allow workers to relax, pursue interests or spend quality time with loved ones, which could improve both physical and mental health. As a result, employees may return to work feeling more satisfied and efficient.
>
> Another benefit is that companies could also gain from this change. Several countries, including Iceland, have trialled shorter working weeks without reducing employee salaries, and many businesses reported that output remained stable while employee productivity increased. When workers are happier and less stressed, they are often more motivated and make fewer mistakes, which can benefit employers as well.
>
> However, a four-day working week may not be suitable for every profession. Hospitals, emergency services and public transport operate 24/7 and require staff throughout the week. In these sectors, reducing working hours without hiring additional workers could place greater time pressure on existing workers and increase costs. Therefore, a flexible approach would be more realistic than applying the same rule to all professions.
>
> In conclusion, I believe the working week should be reduced where possible because it would improve work-life balance and could even increase productivity. Nevertheless, governments and employers should recognize that different professions require different working hours.

估分 6.5–7。還能往上的三處：拼字一致（trialled 英式 vs recognize 美式，改 recognise）；improve people's happiness → well-being / quality of life；do more valuable things → 具體寫出「跟誰、做什麼」。

### 2.9 主題字彙與句型：Globalization（優缺點題）

**優點動詞搭配**
enhance communication · promote cooperation / cultural understanding · encourage / drive innovation · strengthen economies · improve living standards · boost / stimulate economic growth · attract foreign investment · expand into overseas markets · reduce trade barriers · create employment opportunities · facilitate international communication · bridge geographical distances · access information instantly

**缺點動詞搭配**
widen the wealth gap · threaten local businesses · undermine cultural identity · increase pollution / income inequality · exploit cheap labour · lose traditional customs · disrupt supply chains · dominate the market · adopt Western lifestyles

**名詞**
- 經濟：global economy · international trade · multinational corporation (MNC) · foreign investment · free trade · tariffs · supply chain · outsourcing / offshoring · labour market · skilled workforce · competitiveness
- 文化：cultural exchange / diversity · Western influence · local identity · cultural heritage · intercultural / cross-cultural communication
- 科技：technological advancement · digital communication · collaboration · interconnected world
- 社會與環境：income inequality · environmental impact · carbon emissions · sustainable development · renewable energy · environmental regulations
- 工作與教育：remote workforce · international recruitment · cross-border employment · career opportunities abroad · global competition · student exchange programmes · global citizenship

**易混字**
- abroad（在國外）vs aboard（在船／機上）
- outsource (v.) / outsourcing (n.)；offshore (adj./v.) / offshoring (n.)
- facilitate = 讓某事更容易（被動、移除障礙）；stimulate = 刺激、促進（主動）
- undermine = 削弱；exploit = 不公平地利用；widen = 擴大（差距）
- economy / economic / economical：
  * economy (n.) = 經濟、經濟體：the global economy, a strong economy（另一義「節省」：economy class）
  * economic (adj.) = 跟經濟有關的：economic growth, economic development, economic crisis, economic policy
  * economical (adj.) = 省錢、省資源的：an economical car, an economical way to produce goods
  * 同家族：economics (n.) 經濟學；economist (n.) 經濟學家；economise (v.) 節省
  * 常見錯誤：economical growth ✗ → economic growth；economic car ✗ → economical car

**各段起手句**
- Intro：Globalization has become one of the defining features of the modern world. / In today's interconnected world, countries are more closely linked than ever before.
- 優點段：One major benefit is that… / Another significant advantage is… / This enables people to…
- 缺點段：However, this trend also brings several challenges. / Despite these benefits, some drawbacks cannot be ignored. / One concern is that…
- 結論：Overall, globalization presents both opportunities and challenges. / Striking a balance between economic development and cultural preservation is essential.

### 2.10 規劃範例：Globalization（Do the pros outweigh the cons?）

老師的骨架：Intro（介紹主題 + 立場：優點多）→ Pros ×3 → Cons ×2–3 → Conclusion（總結要點）。

5 分鐘 plan 的樣子（講義的 student's notes，列點不寫句子）：
- Intro：科技與通訊發展 → 世界越來越小 = globalization → 有利有弊 → 我的立場：advantages far outweigh disadvantages
- Pros：(1) 已開發國家把生產外包到較貧窮國家，成本低（例：車廠外包零件）→ 消費者買到更便宜的商品 + 較貧窮國家多了工作機會；(2) 開發中國家的人到已開發國家工作、留學 → 降低失業；(3) 疫病、人道危機等問題可以透過國際合作更快解決
- Cons：(1) 外包對較貧窮國家有利，但天然資源可能被低價消耗；(2) 大企業剝削廉價勞工、忽視勞工權益；人才外流 → 原國家缺乏有經驗的人力
- Conclusion：對已開發與開發中國家都有利有弊 → 我認為優點大於缺點

注意：3 個 pros + 2–3 個 cons 在 250 字裡每點只能各寫一兩句，發展深度會不夠。目標 6.5–7 的話，改成 2 個 pros + 2 個 cons、每點「理由 → 例子 → 結果」寫透，比較安全（見 2.2 第 2、3 條）。

### 2.11 範例文章：Globalization（Do the pros outweigh the cons?，約 290 字）

依 2.10 的規劃改成 2 個優點 + 2 個缺點，每點都有「理由 → 例子 → 結果」。

> In today's interconnected world, advances in technology and telecommunications have made countries more closely linked than ever before, a process known as globalization. While this trend brings certain drawbacks, I believe that its benefits far outweigh its negative aspects.
>
> One major benefit of globalization is that it can stimulate economic growth in both developed and developing nations. Many multinational corporations outsource production to countries where labour costs are lower; for example, Japanese car manufacturers produce parts in several other Asian countries. As a result, consumers can purchase goods at lower prices, while workers in less wealthy countries gain employment opportunities that did not previously exist. Furthermore, closer international cooperation enables governments to respond more effectively to global crises. During disease outbreaks, for instance, countries can share medical research and supplies, which helps to reduce suffering far more quickly than any nation could achieve alone.
>
> However, globalization also brings several challenges. One concern is that large corporations may exploit cheap labour, paying low wages and ignoring workers' rights in order to cut costs. In addition, poorer countries may sell their natural resources at very low prices, and their most qualified workers often move abroad in search of higher salaries. This brain drain can leave the original countries without the skilled workforce they need in order to develop.
>
> In conclusion, although there are strong arguments both for and against globalization, I remain convinced that the benefits outweigh the drawbacks. This is because it creates jobs, lowers prices and strengthens international cooperation, while problems such as labour exploitation can be dealt with through stricter international regulations.

用到的句型：In today's interconnected world（2.9 起手句）· One major benefit of [topic] is that it can…（2.4 第一點）· Furthermore / In addition（補充）· for example / for instance（例子）· As a result（結果）· However, … also brings several challenges / One concern is that…（缺點段）· both for and against / I remain convinced that…（2.4 結論）。

### 2.12 課本範例（二）核能：段落拆解

課本 Ch.19 的高分範文（題目：用核能取代化石燃料的優缺點）。原文請看課本；這裡只拆它的寫法。

| 段落 | 點 | 推進 |
|---|---|---|
| Intro（3 句） | 背景 | 常有人主張用核能發電取代排碳的化石燃料 |
| | 本文要做什麼 | **In this essay**：討論優缺點 |
| | 預告結論 | 最後說明優點還是缺點比較重要 |
| 優點段 | 1. 營運便宜 | **In terms of**（切入）→ 電廠蓋好後營運成本低 → **In other words**（解釋）：燃料便宜 |
| | 2. 燃料不會用完 | **Moreover**（補充）：燃料不會用完 → **As a result**（結果）：不會因供應減少而缺電 |
| | 3. 在地工作 | **In addition to this**（補充）：創造在地工作 → **, which can**（結果）：帶動地方經濟 |
| | 4. 安全 | **Another advantage**（補充）：核電廠相當安全 → **due to the fact that**（理由）：安全設計降低人為疏失 |
| 缺點段 | 1. 意外危險 | **As for**（切入）→ 發生意外時極度危險 → **For example**（例子）：日本福島 |
| | 2. 輻射廢料 | **… can also**（補充）：廢料危害環境數百年 → **Consequently**（結果）：處理成本很高 |
| | 3. 水源污染 | **Furthermore**（補充）：污染在地水源 → **This is because**（理由）：冷卻水排回海中 |
| | 4. 恐攻威脅 | **More worryingly**（補充，最嚴重的點放最後）：可能成為恐攻目標 → **Therefore**（結果）：需要額外保安 |
| 結論（2 句） | 立場 | **In conclusion**（開頭）：兩面都有強力論點 → 我認為優點更重要 |
| | 理由 | **This is because**（理由）：需要乾淨可行的替代能源，缺點可以靠嚴格的政府規範處理 |

為什麼高分（課本解析的重點，改寫）：
- 題目每一部分都回答了，結論明說立場。
- 沒有把第一篇的點全部塞進來，而是挑最好的幾點，每點都用理由、例子、結果、解釋撐開。
- 不是列清單：每個新點都有連接詞帶出，一個功能一個詞，不重複。
- 用 benefits / drawbacks、positive aspects、arguments for and against 替換題目的 advantages / disadvantages。

值得學的兩個結構：
- 每個點「主張 → 連接詞 → 延伸」，而且連接詞的功能要對：In other words 是解釋（換句話說），As a result / , which can 是結果（導致什麼）。例：「成本低 → In other words（解釋）→ 燃料便宜」「燃料不會用完 → As a result（結果）→ 不會缺電」「創造工作 → , which can（結果）→ 帶動經濟」。
- 缺點段用 More worryingly 把最嚴重的點放最後，比單純 Finally 更有力。

| UK | US |
|---|---|
| colour, flavour, labour, humour, harbour, neighbour, favourite | color, flavor, labor, humor, harbor, neighbor, favorite |
| organise, realise, recognise | organize, realize, recognize |
| centre, metre | center, meter |
| travelled, cancelled | traveled, canceled |
| programme | program |
| analyse | analyze |
| defence | defense |

IELTS 兩種都接受，重點是全篇一致。用了 trialled、labour 就不要再出現 recognize。

| 單字 | 重點 | 注意 |
|---|---|---|

| environment | envir**on**ment | environ + ment，n 不能漏 |
| corporation | corp**o**ration | corp 後面是 o，不是 a；跟 cooperation（合作）不同字 |

| threaten | thr**ea**ten | threat + en，ea 不能少 |

| modern | mod**er**n | r 只有一個，在 e 後面 |

| 單字 | 詞性 | 意思 | 例句 |

<script type="text/plain" id="md-en"># IELTS Writing: Techniques and Sentence Patterns

Compiled from: the pitfalls in two practice pieces (Task 2 "four-day working week", Task 1 line graph "unemployment rates in five European countries"), the textbook's Chapter 19 commentary on advantages/disadvantages essays, and the paragraph plans and templates in my notebook.

**Notation**: "A / B" = alternatives — choose one; the slash is not part of the sentence (e.g. *the benefits outweigh / are of more importance than the drawbacks* = two sentences, pick one). "[ ]" = fill in according to the question. "…" = omitted; add your own content.

---

## 0. Pre-submission checklist (both tasks)

Ordered by how often I miss each one:

1. **The subject is the figure, not the country** (Task 1): *the rate in Spain rose*, not *Spain rose*.
2. **Singular / plural**: all / fewer / many / generic groups → plural (interests, mistakes, professions, workers).
3. **Word class**: experience + noun; feel + adjective; less / more + adjective (parallel with *happier*).
4. **Collocation**: improve + quality / health / balance; boost / increase + happiness / morale.
5. **Articles**: the UK, the United Kingdom.
6. **Tense**: Task 1 in the past tense throughout; Task 2 mainly in the present simple.
7. **Spelling**: choose UK or US and keep it consistent throughout.
8. **Repetition**: the same word or the same structure in adjacent sentences (making them… / making it…).
9. **Word count**: Task 1 ≥ 150 (aim for 170–190); Task 2 ≥ 250 (aim for 250–280).
10. **Copying the question**: borrowing nouns from the question is fine; copying whole sentences loses marks.
11. **No contractions**: don't → do not, it's → it is, can't → cannot (flagged by my teacher).

**Four checks for any replacement word**: right word class, right number, collocates naturally with the surrounding words, and makes sense in the paragraph's logic (without repeating).

---

## 1. Task 1 (20 minutes, ≥ 150 words)

<!-- toc-group: Line graphs & general -->

### 1.1 Structure

| Paragraph | Content | Sentences | Words |
|---|---|---|---|
| Intro | Paraphrase the question in one sentence (change the verb, change the voice) | 1 | 15–20 |
| Overview | Main trends + the most striking feature; no figures, or only the key ones | 2 | 25–40 |
| Body 1 | Ranking and figures at the start → changes up to the middle of the period | 3–4 | 45–60 |
| Body 2 | Later changes up to the end; comparisons and rankings | 4–5 | 55–75 |

Total 150–195; aim for 170–190. (Final draft, actual: 17 / 29 / 50 / 78)

- Timing: 2 minutes reading the chart and counting the direction of every line → 15 minutes writing → 3 minutes checking against the checklist.
- A one-sentence paragraph should be merged into a neighbouring one.

### 1.2 Techniques

1. Before writing the overview, count the direction of every line (e.g. five countries: four up, one down). Missing a line costs Task Achievement marks.
2. Reversals, crossovers and swaps between highest and lowest are the highlights of the chart — put them in the overview (e.g. Germany went from highest to lowest).
3. Make the figure the subject: *the rate in X / unemployment in X / X's unemployment rate*, or rewrite as *X saw a rise to…*.
4. **Size vs speed**: a change within a single year is about size only (*slightly*); only changes across several years are about speed or manner (*steadily, gradually*). When several countries fall by different amounts, use *converge* to state the result directly instead of choosing an adverb.
5. *respectively* goes right after the paired figures: *…to 20% and 14% respectively*.
6. Rankings must be precise: 14% is the second highest → *the two highest*, not *the highest*.
7. *by* + a past year can take the past perfect (*By 2007, the rates had converged…*) — a grammar bonus.
8. Use *figures / rates*, not *numbers*; use *the other four / the remaining four*, not *the rest four*.
9. The overview and the body saying the same thing is by design (repeating information is fine); only repeated wording needs changing.
10. *Whereas / although / while* are subordinating conjunctions and cannot start a sentence on their own; to contrast in a new sentence, use *In contrast, / By contrast,*.

### 1.3 Time prepositions

| Usage | Meaning | Example |
|---|---|---|
| in 2005 | at that point in time (a snapshot) | In 2005, Germany recorded the highest rate at 12%. |
| by 2010 | up to that year (the end point of a change) | …climbed rapidly to 13% by 2010. |
| from 2005 to 2010 / between 2005 and 2010 | start and end of the whole period | Unemployment in the UK rose from 5% to 8% between 2005 and 2010. |
| over the period / over the five years | the whole period, without naming years | Unemployment in Germany declined over the period. |
| during 2008 | within that year | The rate dipped slightly during 2008. |
| by the end of the period | at the end | …leaving it the lowest by the end of the period. |

Test: describing "what the figure was in that year" → *in*; describing "a change that accumulated up to that year" → *by*.
*fell to 7.5% **in** 2008* = the fall happened within that year; *fell to 7.5% **by** 2008* = the fall began earlier and ended that year.

### 1.4 Trend verbs and nouns

| Direction | Verbs (past tense) | Nouns |
|---|---|---|
| Up | rose, increased, climbed, grew, surged (sharp rise), soared (dramatic rise) | a rise / an increase / growth / a surge in… |
| Down | fell, dropped, declined, decreased, dipped (small fall), plunged / plummeted (sharp fall) | a fall / a drop / a decline / a decrease in… |
| Flat | remained stable / steady, stayed constant, levelled off, plateaued | a plateau |
| Fluctuating | fluctuated | fluctuations |
| Highs and lows | peaked at, reached a high / low of, bottomed out at | a peak of… / a low of… |
| Converging | converged at (around 8%) | — |
| Reversing, overtaking | reversed, overtook | a reversal |

Noun patterns: There was a dramatic rise in Spain's unemployment rate, from 9% to 20%. / Spain saw a sharp increase of 11 percentage points.

### 1.5 Adverbs

- **Size**: slightly / marginally (small), moderately (medium), considerably / significantly / substantially (large), dramatically / sharply (very large, and implying speed)
- **Speed, manner**: gradually / steadily / slowly, rapidly / quickly, consistently
- Common collocations: rose dramatically, fell slightly, declined steadily, increased gradually, remained broadly stable

### 1.6 Comparison and ranking patterns

- X recorded the highest rate at 12%, followed by Y at 10% and Z at 9%.
- X and Y had considerably lower figures, at 5% and 4% respectively.
- …, making them the two highest figures by 2010.
- …, leaving it the lowest of the five countries by 2010.
- Unemployment declined in X, which took it from the highest to the lowest.
- X was the only country whose rate fell.
- The rates in X, Y and Z converged at around 8%.
- X's rate was twice as high as Y's. / X overtook Y in 2008.
- The following three years saw further changes. / 2008 marked a turning point for four of the five countries.
- The most striking feature is that…

### 1.7 Paraphrasing the intro

- The line graph illustrates / shows / compares how unemployment rates changed in five European countries between 2005 and 2010.
- Changes in unemployment rates in five European countries between 2005 and 2010 are illustrated in the line graph. (passive)
- Swaps: shows → illustrates / compares / gives information about; percentage → proportion; from … to … → between … and … / over a five-year period

### 1.8 Model: my final draft (about 174 words)

> Changes in unemployment rates in five European countries between 2005 and 2010 are illustrated in the line graph.
>
> Overall, unemployment declined in Germany, which took it from the highest to the lowest. In contrast, the rates of the other four countries increased, although there were some fluctuations.
>
> In 2005, Germany recorded the highest rate at 12%, followed by Greece at 10% and Spain at 9%. The UK and Ireland had considerably lower figures, at 5% and 4% respectively. By 2007, the three highest rates dropped to a similar level of around 8%, and the rest remained stable.
>
> The following three years saw further changes. The rates in Spain and Ireland rose dramatically to 20% and 14% respectively, making them the two highest figures by 2010, while the rate in Greece fell slightly to 7.5% in 2008 and climbed rapidly to 13% by 2010. Unemployment in the UK increased consistently from 5% to 8%.
>
> By contrast, the rate in Germany declined steadily from 8% to 7%, leaving it the lowest of the five countries by 2010.

From 7 towards 7.5: one or two higher-level words (converge, plateau, surge, peak at), one correctly used past perfect, and treating 2008 as the shared turning point for four countries.

<!-- toc-group: Bar charts -->

### 1.9 Static charts (bar charts with no time axis)

With no time axis there is no "trend"; the whole report is "comparison":

- Swap the verbs for *had / stood at / recorded / accounted for*; no *rose / fell*.
- Tense: present for the chart itself (*The bar chart shows…*), past for the 2005 data (*Poland had…*).
- The overview needs two things: ① the extremes (which country is highest, which is lowest); ② the pattern shared across categories (e.g. in every country the youth rate is far higher than the overall rate — roughly double). Missing ② is the most common Task Achievement deduction.
- Body 1: the two extremes (highest vs lowest, with actual figures). Body 2: the middle group, one category then the other, one comparison per sentence.
- Fraction comparisons (*one fifth, two thirds*) are a bonus, but pair them with at least one actual figure; fractions without figures read as not reporting the data.
- Gaps are in *percentage points*, not *percent*: *3.5 percentage points lower*. (*3.5 percent lower* is a relative amount and means something different.)
- A rate is high or low, not much: *as high as*, not *as much as*; *as much rate as* does not exist.

**Comparison patterns**

- X's rate was twice / three times as high as Y's. / …was double the figure for Y.
- Y's figure was only half / a third / two thirds of X's. / …roughly a fifth of the Polish rate.
- X was 3.5 percentage points lower than Y. / X exceeded Y by 5 percentage points.
- X had the second-highest rate, at 24%, followed by Y at 17.5%.
- In every country, the rate for young adults was considerably higher than the overall rate.
- The gap between the two groups was widest in X and narrowest in Y.
- X and Y recorded almost identical figures, at around 7.5%.
- Linkers and modifiers: compared with / whereas / while / by contrast / respectively / just / only / approximately / the population as a whole

### 1.10 Practice: bar chart (youth vs overall unemployment in five countries, 2005) — first draft, to be revised

> The bar chart shows the percentage of unemployment rates among young adults and total population in five European countries in 2005.
>
> Overall, Poland has the highest unemployment levels in all ages. In contrast, Denmark has the lowest rates, and much lower than other countries.
>
> In more specific terms, Poland has 35 percent of young adults and 15 percent for total that don't have jobs, compared with Denmark which has approximately one fifth as much as Poland among young adults and one sixth as much as in total.
>
> Turning to the unemployment rates in the other (three) countries, as for the unemployment rates among young people, Italy has two thirds as much rate as Poland, while Hungary has half as much as Poland, Germany is 3.5 percent lower than Hungary, which has twice as much as Denmark. However, as for the unemployment rates of total, Germany has higher rates, which has two thirds as much rate as Poland, Italy and Hungary both have half as much rate as Poland.

**Revision list**

1. The overview is missing the second feature: youth unemployment was far higher than the overall rate in all five countries.
2. Tense: all 2005 data in the past tense (has → had).
3. *in all ages* → there are only two categories; use *for both groups*.
4. *and much lower than other countries* → incomplete comparison; add a subject and *the*.
5. *the percentage of unemployment rates* → rates are already percentages; keep one.
6. *don't have jobs* → colloquial; use *were unemployed / out of work*; *for total* → *of the total population*.
7. *as much rate as* ×3 → use *as high as*, or *of X's figure*; vary the three structures.
8. *3.5 percent lower* → *3.5 percentage points lower*.
9. *which has twice as much as Denmark* → unclear reference (Hungary or Germany?).
10. Paragraph 4 is one long comma splice — split it into 3–4 sentences; *Turning to…* and *as for…* are stacked, keep one; remove the brackets.
11. Italy, Hungary and Germany have no actual figures; add at least one each.
12. *Germany has higher rates* → higher than whom? Write *the second-highest rate*.

Estimated band: about 6.0. Fixing 1, 2, 7, 10 and 11 gets it to 6.5; replacing the comparisons with the patterns in 1.9 can reach 7.

<!-- toc-group: Process diagrams -->

### 1.11 Process diagrams

**Two kinds of process**
- Manufacturing / production processes: how something is made (coffee, paper, bricks, recycled plastic, glass)
- Natural processes: a natural cycle or development (the water cycle, the life cycle of a butterfly, how a plant grows, the formation of rocks)

**Structure (4 paragraphs)**

| Paragraph | Content | Sentences | Words |
|---|---|---|---|
| Intro | Paraphrase the question: what process the diagram shows | 1 | 15–20 |
| Overview | How many main stages, where it starts and finishes, linear or cyclical; no details or figures | 1–2 | 25–40 |
| Body 1 | The first half of the process | 3–5 | 55–70 |
| Body 2 | The second half of the process | 3–5 | 55–70 |

**Four questions before writing the overview**
1. Where does it start?
2. Where does it finish?
3. How many main stages are there? (group the small steps into 2–4 main stages)
4. Is it linear or cyclical?

**Overview template**
- Overall, it is a linear / cyclical process which consists of [three] main stages, involving [twelve] steps in total, beginning with the [noun] of … and ending with the [noun] of … .

<!-- -->

- Overall, it is a linear / cyclical process **which consists of** …
- Overall, it is a linear / cyclical process **consisting of** …

<!-- -->

- Overall, the process consists of **[three] main stages, involving [twelve] steps in total**, beginning with … .
- Overall, the process consists of **[number] main stages**, beginning with … .
- Overall, the process consists of **[twelve] steps, which can be divided / grouped into [three] main stages**, beginning with … .
- It is a linear / cyclical process.

Notes: between *the* and *of* goes a noun or a V-ing (the sorting of beans, the packaging of the finished product); *the* and *of* come as a pair; when the action has its own noun, prefer it (production, storage, delivery, sale — not *the producing of*); *steps* are the small steps in the diagram and *main stages* are the groups you make from them; no comma before *and ending*.

**Sequencing language**

Start:
  * Initially,
  * First of all,
  * To begin with,
  * The first stage is to…
  * At the beginning of the process,

Middle:
  * After that,
  * Once this stage / step is complete,
  * The next stage / step involves…
  * Following this,
  * Subsequently,
  * Afterwards,
  * At this point,
  * Next,

End:
  * Finally,
  * Lastly,
  * The final stage is to…
  * The last stage involves…
  * Eventually,

**Sequencing tips**

- Don't keep using *Then*: rotate through the Middle list, or move *then* inside the sentence (The beans are then roasted.).
- Two small steps in a row can share a sentence: The beans are sorted by hand and then cleaned.

**Process verbs**
- Starting: begin / start
- Changing something: process / treat / transform / convert / crush / grind / heat / cool / dry / wash / filter / separate / mix / combine
- Finishing: pack / package / distribute / transport / deliver; noun: the finished product

**Grammar**
- **Passive voice**: in a manufacturing process, the subject is the thing being made, not the person making it. Formula: subject + am / is / are + past participle.
  * Workers sort the beans. → The beans are sorted by hand.
  * Machines grind the beans. → The beans are ground.
- **Tense**: processes use the present simple (unlike line graphs, which use the past).
- **Subject–verb agreement**: The beans **are** roasted. / The coffee **is** packed. (coffee is uncountable, so *is*)
- Leave out *by workers / by machines* unless how it is done matters (e.g. *by hand*).

### 1.12 Practice: the dry method of coffee production (12 steps)

**Plan** (a linear process, 12 steps → 3 main stages)
- Stage 1 on the farm (1–5): sorted by hand → cleaned with a sieve → dried in the sun for four weeks → raked and turned → stored in a silo
- Stage 2 at the mill (6–9): sent to a mill → hulled → graded → bagged
- Stage 3 roasting and retail (10–12): sold → roasted → packed and sold
- Body 1 covers the farm; Body 2 covers the mill through to retail

**Words from the diagram**

| Word | Meaning |
|---|---|
| sieve (n./v.) | a tool with small holes; to separate small things from larger ones with it |
| rake (v.) | to turn over or level with a rake |
| silo (n.) | a tall round tower for storing grain |
| mill (n.) | a processing plant (originally a building where grain is ground into flour) |
| hull (v.) / hulling | to remove the outer covering of a seed |
| grade (v.) / grading | to sort by quality (good and bad beans) |

**Model sentences**
- Intro:
  * The diagram illustrates the process involved in producing dry-roasted coffee.
  * The process involved in producing dry-roasted coffee is illustrated in the given diagram.
- Overview:

### 1.13 Textbook Sample 2 (fruit jam): paragraph breakdown

The high-scoring model in textbook Ch.10 (a process diagram: making fruit jam, 9 steps, about 163 words). See the textbook for the original text; this section only breaks down how it is written.

| Paragraph | Point | Moves |
|---|---|---|
| Intro + Overview (one paragraph) | Intro | Paraphrase the question: the diagram shows the procedure for making jam (*procedure* replaces *process*) |
| | Overview | **Overall, it is clear that** + how many steps → **beginning with … and ending with …** (start and finish) → **namely** (names the two main phases: preparation and cooking) |
| Body 1: preparation | 1. Selecting | **The first stage of the process is** + V-ing: choosing ripe fruit |
| | 2. Washing | **At the next stage** (Middle): passive *is washed* + **to remove** (purpose): insects and dirt |
| | 3. Peeling and coring | **Then** (Middle): passive *are removed* + **, leaving …** (result): only the flesh remains |
| | 4. Pulping and adding | **Subsequently** (Middle): passive *is pulped* + **and then** the next action: sugar, citric acid and pectin are added |
| Body 2: cooking | 5. Heating | **During the cooking stage** (Introducing): passive *is heated* **and then** *cooked*, with the time (about 15 minutes) |
| | 6. Pouring and sealing | **After the mixture has cooled** (present perfect: the previous step is finished) → passive *is poured* + **, which are then sealed** (relative clause for the next step) + **to preserve** (purpose) |
| | 7. Storing | **can then be stored** (modal + passive): the last step |

Why it scores highly:
- One overview sentence answers three of the four questions in 1.11: how many steps, where it starts and where it ends; *namely* then groups the 9 steps into 2 phases.
- Body 1 = the first phase and Body 2 = the second, so the paragraphs match the phases named in the overview exactly.
- Almost every sentence is passive: the subject stays on the fruit and the jam, not the people.
- No sequencing word repeats: The first stage → At the next stage → Then → Subsequently → During → After.
- Two steps are joined in one sentence instead of one step per sentence: *and then*, *, leaving …*, *, which are then …*.

Five structures worth copying:
- Purpose: passive + **to + verb** (*is washed to remove …*, *are sealed to preserve …*)
- Result: **, leaving …** (a participle clause for what remains)
- Previous step finished: **After + subject + has + past participle**, …
- Next step: **, which are then + past participle**
- Last step: **can then be + past participle**

Difference from 1.11: this answer merges the intro and overview into one paragraph, so it has 3 paragraphs. Both work; 4 paragraphs is clearer, and merging saves words.

### 1.14 Textbook sample: instant coffee: paragraph breakdown

A high-scoring model from the textbook (a flowchart: how instant coffee is made, 12 steps). See the textbook for the original text; this section only breaks down how it is written.

The textbook's tips (paraphrased):
- 12 steps is a lot, so write efficiently to cover them all: put two steps in one sentence.
- Mix active and passive structures rather than using one pattern every time.
- Always include an overview that summarises the main stages.

| Paragraph | Point | Moves |
|---|---|---|
| Intro + Overview (one paragraph) | Intro | Paraphrase the question: the flowchart shows the method for making instant coffee (*method* replaces *process*) + **from … to …** (start to finish) |
| | Overview | **In general, it is clear from the diagram that** + 12 steps → **can be divided into three main phases** (names them: preparation, processing, packaging and distribution) |
| Body | 1. Picking and drying | **The first stage in the process is** + V-ing **and then** V-ing (active gerunds, two steps in one sentence) |
| | 2. Roasting and cooling | **At the next stage** (Middle): passive *are roasted* **and then** *cooled* |
| | 3. Grinding and mixing | **Subsequently** (Middle): passive *are ground into a powder* **and then** *mixed with water* |
| | 4. Straining | passive *is strained* + **to separate … from …** (purpose) |
| | 5. Freeze-drying | **Then** (Middle): passive *is freeze-dried* + **, locking …** (result) |
| | 6. Grinding again | **After that** (Middle): passive *is ground for a second time* |
| | 7. Vacuum-drying and packing | **After it has been ground again** (present perfect passive: the previous step is finished) → passive *is dried* **and then** *packed* + **ready to be …** (the final delivery and sale) |

Why it scores highly:
- All 12 steps are covered in only 7 sentences: almost every sentence carries two steps with *and then*.
- The first sentence is active (*picking … drying*), and the rest switch to passive — the mix the tips ask for.
- No sequencing word repeats: The first stage → At the next stage → Subsequently → Then → After that → After.
- The overview uses *from … to …* and *three main phases* to group 12 steps into 3.

What could be better: the overview names three phases, but the body is a single paragraph. Following the 4-paragraph structure in 1.11, split the body into two (e.g. preparation + processing, then packaging and distribution) so the paragraphs match the overview.

Structures shared with the fruit-jam sample in 1.13: **to + verb** (purpose), **, V-ing …** (result), **After + has (been) + past participle** (previous step finished). These three are the most useful higher-level patterns for process diagrams.
