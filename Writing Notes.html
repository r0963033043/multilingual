## 2. Task 2 (40 minutes, ≥ 250 words)

### 2.1 Structure and word counts (from my notebook)

| Paragraph | Sentences | Words |
|---|---|---|
| Introduction | 3 | ~30 |
| One aspect | 8–9 | 80–90 |
| Another aspect | 8–9 | 80–90 |
| Conclusion | 6–8 | 60–80 |

Total 250–280. (A conclusion of 2–3 sentences / 40–60 words is also enough; when short of time, protect the body paragraphs first.)
Timing: 5 minutes analysing the question and listing points → 30 minutes writing → 5 minutes checking.

**Inside "One aspect" (a body paragraph): 3–4 points**

| Part | Content | Sentences | Words |
|---|---|---|---|
| Point 1 | Introduced by an introducing phrase (In terms of the positive aspects, …), which also works as the topic sentence + at least one support (explanation / consequence / reason / example) | ≥ 2 | 20–40 |
| Point 2 | Introduced by an adding word (Moreover, …) + at least one support | ≥ 2 | 20–40 |
| Point 3 | Introduced by an adding word (Furthermore, … / In addition to this, …) + at least one support | ≥ 2 | 20–40 |
| Point 4 (optional) | Introduced by an adding word (Another advantage is that… / More worryingly, …) + at least one support | ≥ 2 | 20–40 |

- Matching the word count: for an 80–90-word paragraph, three points means about 27–30 words each and four points about 20–22 words each; at most one point can run to 40. If a paragraph goes past 90, balance it against the other paragraph and the conclusion so the total stays at 250–280.
- One claim per point; the support must add a layer (why, what follows, for example what), not just restate the point.
- Put the strongest or most serious point last (More worryingly, …).
- Example: in 2.12, the textbook Sample 2's advantages and disadvantages paragraphs each have 4 groups, and every group is point + support.

Skeleton (using the patterns in 2.4):
> In terms of the positive aspects, [topic] can [benefit 1]. In other words, / This is because … . (point 1: point + explanation or reason)
> Moreover, [benefit 2]. As a result, … . (point 2: point + consequence)
> Furthermore, / In addition to this, [benefit 3], which can … . For example, … . (point 3: point + consequence + example)
> Another advantage is that [benefit 4]. This is because … . (point 4, optional: point + reason; in a disadvantages paragraph, use More worryingly for the most serious point)

Paragraph skeletons and type-specific patterns for each essay type are in 2.5.

### 2.2 Techniques (textbook commentary + pitfalls from two essays)

1. Answer every part of the question; state your own view explicitly in the conclusion.
2. Every point must be supported, developed and extended: reason → example → consequence → explanation. One point written in depth beats three points with one sentence each.
3. Don't write every idea you have; pick the best 2–3.
4. Don't just list: use linking words and signposting to join sentences (see 2.4).
5. Paraphrase the question's words with synonyms; never copy whole sentences (see 2.3).
6. Be specific: *do more valuable things* → *enjoy more leisure time with their families and friends*; *enjoy life* → add "doing what, with whom".
7. The intro's preview must match the body: if the intro says *quality of life*, the body covers physical and mental health and leisure.
8. Keep the position consistent: the concession paragraph after *largely agree* must not overturn it.
9. Concrete countries or data make examples stronger: *Several countries, including Iceland, have trialled…*
10. Don't say "improve health" twice in one paragraph: put the broad concept in the topic sentence (well-being / quality of life) and get specific at the end (physical and mental health).

### 2.3 Synonyms (to avoid repeating the question's words)

| Question word | Alternatives |
|---|---|
| advantages | benefits, positive aspects, merits, upsides, arguments in favour of; pros (colloquial — at most once) |
| disadvantages | drawbacks, downsides, negative aspects, arguments against; cons (colloquial — at most once) |
| outweigh | the benefits far outweigh the drawbacks / the drawbacks are outweighed by the benefits / on balance, the advantages are greater than the disadvantages |
| people | individuals, workers, employees, the public, citizens |
| important | essential, crucial, vital, of greater importance |
| improve | enhance, boost (morale / happiness), raise (standards) |
| big / many | significant, considerable, substantial, a large number of |
| company | business, employer, firm, organisation |
| the working week | working hours, work schedules, a four-day week |
| think | believe, argue, maintain, hold the view that |

### 2.4 Common patterns and linking words (all Task 2 types)

**Intro (3 sentences: background → paraphrase the question → what the essay will do / position)**

Background:
  * Nowadays, it is often argued that…
  * In recent years, many people have argued that…
  * It is widely believed that…
  * X has become a controversial issue in recent years.

Others' view (paraphrasing the question):
  * They believe that…
  * Supporters of this view claim that…

What the essay will do:
  * This essay will discuss…
  * In this essay, I will…

**Body topic sentences**

Introducing / categorising:
  * In terms of…,
    * In terms of the positive aspects, …
  * As for…,
    * As for the benefits of [topic], …
    * As for the drawbacks of [topic], …
  * Turning to…,
  * With regard to…,

First point:
  * One major advantage / benefit / drawback of [topic] is that…
    * One major benefit of [topic] is that it improves… / it can improve… / it would improve…
      Three strengths: *improves* = an established fact (strong); *can improve* = possible / potential (hedged — the most common); *would improve* = a hypothetical policy (proposed, not yet in place). IELTS rewards appropriate hedging, so *can / may / could* are usually safer.

Adding a second point:
  * Moreover, …
  * Furthermore, …
  * In addition to this, …
  * Another benefit is that…
  * A further problem is that…

**Support (reason → example → consequence → explanation)**

Reason:
  * This is because…
  * This is due to the fact that…
  * The reason for this is that…

Example:
  * For example, [a specific country / figure / situation]…
  * For instance, …
  * A case in point is…
  * such as… / including…

Consequence:
  * As a result, …
  * Consequently, …
  * Therefore, …
  * This means that…
  * …, which could / can…

Explanation:
  * In other words, …
  * …, which means…

**Contrast and concession**

  * However, …
  * Nevertheless, …
  * In contrast, …
  * On the other hand, …
  * More worryingly, …
  * Although…, …
  * While it is true that…, …
  * …, while…
  * …, which may not be suitable for every…

**Conclusion (restate the position → one reason → optional condition or recommendation; no new arguments)**

Openers:
  * In conclusion,
  * To conclude,
  * To sum up,
  * In summary,
  * Overall,
  * On balance, (good for *outweigh* questions)
  * Taking everything into account,

Position:
  * I believe that…
  * I am convinced that…
  * I would argue that…
  * In my view, …
  * It seems to me that…
  * I remain convinced that… (implies a concession came before and the position has not changed)

  Reword the position sentence from the intro: intro *I largely agree with this view*, conclusion *I remain convinced that / I would argue that*. Don't double up (*In my opinion, I think…* says "I think" twice).

Reason:
  * This is because…
  * For these reasons, …

Condition or recommendation:
  * Nevertheless, [governments / employers] should recognise that…

**Full examples (position → reason → condition or recommendation; in the same A/B order as 2.5)**

A. Advantages / disadvantages — the benefits outweigh:
   To sum up, although there are strong arguments both for and against [topic], I would argue that the benefits outweigh the drawbacks. This is because it offers a practical alternative to [the current situation], while its downsides, such as [drawback], can be managed through strict regulation.

B-1. To what extent — agree:
   In conclusion, I remain convinced that the working week should be shortened where possible, since this would improve work-life balance and could even raise productivity. Nevertheless, governments and employers should recognise that different professions require different working hours.

B-2. To what extent — partly agree:
   On balance, I partly agree with this view: [X] clearly brings [benefit], but it should not be applied to every [sector]. For these reasons, a flexible approach that takes local conditions into account would be more effective than a single rule.

B-3. To what extent — disagree:
   In conclusion, it seems to me that the disadvantages of [X] far outweigh its benefits, mainly because [reason]. Unless [condition], I believe this policy should not be introduced.

### 2.5 Type-specific patterns

**A. Advantages / disadvantages (textbook Ch.19)**

How the question is phrased: What are the advantages and disadvantages of…? / Do the advantages outweigh the disadvantages?

Skeleton: Intro (say both sides will be discussed and preview the conclusion) → advantages paragraph → disadvantages paragraph → conclusion (state which side matters more, with one reason)

Notes:
- Cover both sides, one paragraph each; never only one side.
- If the question asks *outweigh*, state the winning side in both the intro and the conclusion.
- Rotate the words for the two sides: advantages / benefits / positive aspects / merits; disadvantages / drawbacks / downsides / negative aspects.

Patterns:
- Intro:
  * In this essay, the advantages and disadvantages of [topic] will be discussed, and I will conclude by saying that the benefits outweigh the drawbacks.
  * In this essay, the advantages and disadvantages of [topic] will be discussed, and I will conclude by saying that the benefits are more important than the drawbacks.
  (*outweigh* questions need your position in the intro; for "What are the advantages and disadvantages?" questions, where you need not take a side, change *that* to *whether*)
  * While [topic] brings several benefits, it also has some drawbacks; this essay will examine both before arguing that…
- Advantages paragraph:
  * In terms of the positive aspects, …
  * As for the benefits of [topic], …
  * One major advantage of [topic] is that…
  * Another benefit is that…
  * In addition to this, …
- Disadvantages paragraph:
  * As for the drawbacks of [topic], …
  * Turning to the negative aspects, …
  * Furthermore, …
  * A further problem is that…
  * More worryingly, …
  * This can lead to…
- Conclusion, first sentence (choose one; the first half says "both sides have a point", the second half says "which side wins", and the halves are interchangeable):
  - In conclusion, although there are strong arguments both **for and against** [topic], I believe that the benefits outweigh the drawbacks. (most common; *for* comes first)
  - In conclusion, although there are strong arguments both against and **in support of** [topic], I believe that the benefits are of more importance than the drawbacks.
  - In conclusion, although there are strong arguments both **supporting and opposing** [topic], I would argue that the benefits outweigh the drawbacks.
  - In conclusion, although there are strong arguments **on both sides of this debate**, I remain convinced that the benefits outweigh the drawbacks. (no need to repeat the question's words)
  - The textbook's original *both against and in favour of [topic]* also works, but the order is slightly awkward.
- Conclusion, second sentence (the reason):
  * This is because it is essential to find a [practical] and viable alternative to …, and the drawbacks such as … can be dealt with through [strict government regulation].

**B. To what extent do you agree or disagree (four-day working week)**

How the question is phrased: To what extent do you agree or disagree? / Do you agree or disagree?

Skeleton: Intro (background → paraphrase → position: *I largely agree, although…*) → support 1 → support 2 (with an example) → concession paragraph (the opposing view + why it does not overturn your position) → conclusion (restate the position + reason + a condition)

Notes:
- "To what extent" asks how far: completely / largely / partly — say it in the intro, repeat it in the conclusion, and never change it in between.
- The concession paragraph is a bonus: show that you have seen the other side, then use *However / Nevertheless* to return to your position; keep it shorter than the support paragraphs.

Patterns:
- Position:
  * I largely / completely agree with this view, although I believe…
  * To a large extent, I agree that…
  * While I accept that…, I believe…
  * I partly agree: … but …
  * I strongly disagree with this idea because…
- Support paragraphs:
  * One major advantage of [topic] is that it can improve…
  * Another benefit is that [companies] could also gain from this change.
  * Several countries, including Iceland, have trialled…
  * When…, they are often more…, which can benefit [employers] as well.
- Concession paragraph:
  * However, [topic] may not be suitable for every profession.
  * Admittedly, …
  * It is true that…, but…
  * Therefore, a flexible approach would be more realistic than applying the same rule to all [professions].
- Conclusion:
  * In conclusion, I believe [topic] should be … where possible because…
  * In conclusion, while there are some drawbacks, I remain convinced that…
  * Nevertheless, governments and employers should recognise that different … require different …

(Other types — discuss both views, problem / solution — to be added once practised.)

### 2.6 Topic vocabulary: work and life

work-life balance · well-being · quality of life · burnout / exhaustion / stress · heavy workloads · long commuting hours · a lack of personal time · relax / recharge / unwind · pursue hobbies / interests · quality time with loved ones · physical and mental health · productivity / output · morale · motivated / engaged / focused / efficient · retain staff · operate around the clock / 24 hours a day, seven days a week · throughout the week · additional staff · work / time pressure · a flexible / tailored approach · a one-size-fits-all rule

### 2.7 Common errors (my own)

| Written | Should be | Rule |
|---|---|---|
| experience exhaust | experience exhaustion | verb + noun |
| feeling more satisfy | feeling more satisfied | feel + adjective; -ed for how people feel |
| less stressful (of a person) | less stressed | -ful describes things, -ed describes people (boring / bored) |
| spend time to do | spend time doing | spend + time + V-ing |
| pursue interest / fewer mistake / all profession | interests / mistakes / professions | generic, fewer, all → plural |
| employee's salary | employee salaries / employees' salaries | noun + noun, or plural possessive |
| the rest four countries | the other four / the remaining four | *rest* cannot be followed directly by a number (a literal translation of the Chinese 其餘四國) |
| get benefits from / gain profits from | benefit / gain / profit from | one verb + from, no noun |
| improve happiness | improve well-being / quality of life; boost happiness | collocation |
| operate can not stop | operate around the clock | verb + adverbial phrase, not another verb |
| through out | throughout | one word |
| 7x24 | 24/7 (formal: around the clock) | order and format |
| making it from A to B | which took it from A to B | making + object takes only a complement |
| Whereas + a stand-alone sentence | merge into the previous sentence, or use In contrast, | subordinating conjunctions cannot start a sentence alone |
| Spain rose to 20% | the rate in Spain rose to 20% | it is the figure that rises or falls |
| fell slowly (0.5 points in one year) | fell slightly | size vs speed |
| do more valuable things | enjoy more leisure time with their families and friends | too vague → specific |

### 2.8 Model: four-day working week (To what extent do you agree, about 270 words)

> In recent years, many people have argued that the traditional five-day working week is no longer suitable for modern society. They believe that reducing it to four days would improve people's health and allow people to do more valuable things. I largely agree with this view, although I believe some industries would not allow their employees to reduce their working hours.
>
> One major advantage of a shorter working week is that it can improve people's happiness. Many employees experience exhaustion, long commuting hours and a lack of personal time. Having an extra day off would allow workers to relax, pursue interests or spend quality time with loved ones, which could improve both physical and mental health. As a result, employees may return to work feeling more satisfied and efficient.
>
> Another benefit is that companies could also gain from this change. Several countries, including Iceland, have trialled shorter working weeks without reducing employee salaries, and many businesses reported that output remained stable while employee productivity increased. When workers are happier and less stressed, they are often more motivated and make fewer mistakes, which can benefit employers as well.
>
> However, a four-day working week may not be suitable for every profession. Hospitals, emergency services and public transport operate 24/7 and require staff throughout the week. In these sectors, reducing working hours without hiring additional workers could place greater time pressure on existing workers and increase costs. Therefore, a flexible approach would be more realistic than applying the same rule to all professions.
>
> In conclusion, I believe the working week should be reduced where possible because it would improve work-life balance and could even increase productivity. Nevertheless, governments and employers should recognize that different professions require different working hours.

Estimated band 6.5–7. Three things that could raise it: consistent spelling (*trialled* is British, *recognize* American — change to *recognise*); *improve people's happiness* → *well-being / quality of life*; *do more valuable things* → say specifically with whom and doing what.

### 2.9 Topic vocabulary and patterns: globalization (advantages / disadvantages)

**Advantage verbs and collocations**
enhance communication · promote cooperation / cultural understanding · encourage / drive innovation · strengthen economies · improve living standards · boost / stimulate economic growth · attract foreign investment · expand into overseas markets · reduce trade barriers · create employment opportunities · facilitate international communication · bridge geographical distances · access information instantly

**Disadvantage verbs and collocations**
widen the wealth gap · threaten local businesses · undermine cultural identity · increase pollution / income inequality · exploit cheap labour · lose traditional customs · disrupt supply chains · dominate the market · adopt Western lifestyles

**Nouns**
- Economy: global economy · international trade · multinational corporation (MNC) · foreign investment · free trade · tariffs · supply chain · outsourcing / offshoring · labour market · skilled workforce · competitiveness
- Culture: cultural exchange / diversity · Western influence · local identity · cultural heritage · intercultural / cross-cultural communication
- Technology: technological advancement · digital communication · collaboration · interconnected world
- Society and environment: income inequality · environmental impact · carbon emissions · sustainable development · renewable energy · environmental regulations
- Work and education: remote workforce · international recruitment · cross-border employment · career opportunities abroad · global competition · student exchange programmes · global citizenship

**Easily confused**
- abroad (in another country) vs aboard (on a ship / plane)
- outsource (v.) / outsourcing (n.); offshore (adj./v.) / offshoring (n.)
- facilitate = make something easier (passive — removing obstacles); stimulate = encourage, spur (active)
- undermine = weaken; exploit = use unfairly; widen = make (a gap) bigger
- economy / economic / economical:
  * economy (n.) = the system of money, trade and industry: the global economy, a strong economy (also "saving": economy class)
  * economic (adj.) = relating to the economy: economic growth, economic development, economic crisis, economic policy
  * economical (adj.) = saving money or resources: an economical car, an economical way to produce goods
  * Same family: economics (n.) the subject; economist (n.) the expert; economise (v.) to save
  * Common errors: economical growth ✗ → economic growth; economic car ✗ → economical car

**Paragraph openers**
- Intro: Globalization has become one of the defining features of the modern world. / In today's interconnected world, countries are more closely linked than ever before.
- Advantages paragraph: One major benefit is that… / Another significant advantage is… / This enables people to…
- Disadvantages paragraph: However, this trend also brings several challenges. / Despite these benefits, some drawbacks cannot be ignored. / One concern is that…
- Conclusion: Overall, globalization presents both opportunities and challenges. / Striking a balance between economic development and cultural preservation is essential.

### 2.10 Planning example: globalization (Do the pros outweigh the cons?)

Teacher's skeleton: Intro (introduce the topic + position: more benefits) → Pros ×3 → Cons ×2–3 → Conclusion (summarise the main points).

What a 5-minute plan looks like (the student's notes from the handout — bullet points, not sentences):
- Intro: technological and telecommunication developments → the world is becoming smaller = globalization → pros and cons → my position: advantages far outweigh disadvantages
- Pros: (1) developed countries outsource production to poorer countries at lower cost (e.g. car makers outsourcing parts) → cheaper goods for consumers + more jobs in poorer countries; (2) people from developing countries work and study in developed nations → lower unemployment; (3) diseases and humanitarian crises are solved faster through international cooperation
- Cons: (1) outsourcing benefits poorer countries, but their natural resources may be used up cheaply; (2) big corporations exploit cheap labour and ignore workers' rights; brain drain → the home country lacks experienced workers
- Conclusion: benefits and drawbacks for both developed and developing nations → the advantages are greater

Note: 3 pros + 2–3 cons in 250 words leaves only one or two sentences per point, so the development is too thin. For a 6.5–7 target, 2 pros + 2 cons, each developed as reason → example → consequence, is safer (see 2.2, points 2 and 3).

### 2.11 Model: globalization (Do the pros outweigh the cons?, about 290 words)

Following the plan in 2.10, reduced to 2 advantages + 2 disadvantages, each with reason → example → consequence.

> In today's interconnected world, advances in technology and telecommunications have made countries more closely linked than ever before, a process known as globalization. While this trend brings certain drawbacks, I believe that its benefits far outweigh its negative aspects.
>
> One major benefit of globalization is that it can stimulate economic growth in both developed and developing nations. Many multinational corporations outsource production to countries where labour costs are lower; for example, Japanese car manufacturers produce parts in several other Asian countries. As a result, consumers can purchase goods at lower prices, while workers in less wealthy countries gain employment opportunities that did not previously exist. Furthermore, closer international cooperation enables governments to respond more effectively to global crises. During disease outbreaks, for instance, countries can share medical research and supplies, which helps to reduce suffering far more quickly than any nation could achieve alone.
>
> However, globalization also brings several challenges. One concern is that large corporations may exploit cheap labour, paying low wages and ignoring workers' rights in order to cut costs. In addition, poorer countries may sell their natural resources at very low prices, and their most qualified workers often move abroad in search of higher salaries. This brain drain can leave the original countries without the skilled workforce they need in order to develop.
>
> In conclusion, although there are strong arguments both for and against globalization, I remain convinced that the benefits outweigh the drawbacks. This is because it creates jobs, lowers prices and strengthens international cooperation, while problems such as labour exploitation can be dealt with through stricter international regulations.

Patterns used: In today's interconnected world (2.9 openers) · One major benefit of [topic] is that it can… (2.4 first point) · Furthermore / In addition (adding) · for example / for instance (examples) · As a result (consequence) · However, … also brings several challenges / One concern is that… (disadvantages paragraph) · both for and against / I remain convinced that… (2.4 conclusion).

### 2.12 Textbook Sample 2 (nuclear power): paragraph breakdown

The high-scoring model essay in textbook Ch.19 (question: advantages and disadvantages of using nuclear power instead of fossil fuels). See the textbook for the original text; this section only breaks down how it is written.

| Paragraph | Point | Moves |
|---|---|---|
| Intro (3 sentences) | Background | It is often argued that nuclear power should replace carbon-emitting fossil fuels |
| | What the essay will do | **In this essay**: discuss both sides |
| | Preview of the conclusion | Say whether the benefits or the drawbacks matter more |
| Advantages | 1. Cheap to run | **In terms of** (Introducing) → cheap to run once built → **In other words** (Explanation): the fuel is cheap |
| | 2. Fuel will not run out | **Moreover** (Adding): the fuel will not run out → **As a result** (Consequence): no power shortages from dwindling supply |
| | 3. Local jobs | **In addition to this** (Adding): creates local jobs → **, which can** (Consequence): boost the local economy |
| | 4. Safety | **Another advantage** (Adding): nuclear stations are quite safe → **due to the fact that** (Reason): safety features reduce human error |
| Disadvantages | 1. Dangerous accidents | **As for** (Introducing) → extremely dangerous in an accident → **For example** (Example): Fukushima, Japan |
| | 2. Radioactive waste | **… can also** (Adding): the waste harms the environment for centuries → **Consequently** (Consequence): the clean-up is costly |
| | 3. Water pollution | **Furthermore** (Adding): pollutes the local water supply → **This is because** (Reason): cooling water is released into the sea |
| | 4. Terrorism | **More worryingly** (Adding — the most serious point last): a possible terrorist target → **Therefore** (Consequence): extra security is needed |
| Conclusion (2 sentences) | Position | **In conclusion** (Openers): strong arguments on both sides → the benefits matter more |
| | Reason | **This is because** (Reason): a clean, viable alternative is essential, and the drawbacks can be handled through strict government regulation |

Why it scores highly (the textbook's commentary, paraphrased):
- It answers every part of the question and states a clear view in the conclusion.
- It does not cram in every idea; it chooses the best points and develops each with reasons, examples, consequences and explanation.
- It does not list: each new point is introduced by a linking word, one per function, without repetition.
- It replaces the question's *advantages / disadvantages* with *benefits / drawbacks*, *positive aspects*, *arguments for and against*.

Two structures worth copying:
- Each point goes claim → linker → extension, and the linker must fit its function: *In other words* is Explanation (saying it another way); *As a result* and *, which can* are Consequence (what it leads to). E.g. "cheap to run → *In other words* (Explanation) → cheap fuel", "fuel will not run out → *As a result* (Consequence) → no shortages", "creates jobs → *, which can* (Consequence) → boost the economy".
- The disadvantages paragraph saves the most serious point for last with *More worryingly*, which lands harder than a plain *Finally*.

## 3. UK / US spelling

| UK | US |
|---|---|
| colour, flavour, labour, humour, harbour, neighbour, favourite | color, flavor, labor, humor, harbor, neighbor, favorite |
| organise, realise, recognise | organize, realize, recognize |
| centre, metre | center, meter |
| travelled, cancelled | traveled, canceled |
| programme | program |
| analyse | analyze |
| defence | defense |

IELTS accepts both; what matters is consistency throughout. Once you have used *trialled* and *labour*, *recognize* must not appear.

### 3.1 Commonly misspelled words

| Word | Key part | Watch out |
|---|---|---|
| government | gover**n**ment | govern + ment — keep the n |
| environment | envir**on**ment | environ + ment — keep the n |
| corporation | corp**o**ration | an o after corp, not an a; a different word from cooperation |
| co-operate | co-op**e**rate | an e after op, not an a; cooperate is also correct (noun co-operation / cooperation) — keep one form throughout |
| opportunity | opp**o**rtunity | double p, then an o |
| against | a**gain**st | there is a *gain* inside |
| fluctuate | fluct**u**ate | a u after the t; the same in the noun fluctuation |
| threaten | thr**ea**ten | threat + en — keep the ea |
| temperature | temper**a**ture | there is an a after temper; four syllables |
| modern | mod**er**n | only one r, after the e |
| valuable | val**u**able | drop the e of value, then add able |
| argument | arg**u**ment | drop the e of argue, then add ment (the same rule as valuable) |
| advantage | ad**van**tage | van in the middle, not ven |
| several | sev**er**al | three syllables |
| flexible | flex**ible** | ends in -ible |
| pressure | pre**ss**ure | double s |
| therefore | **therefore** | one word |
| throughout | **throughout** | one word |
| beginning | begin**n**ing | double the n when adding -ing to begin |

modern, valuable, advantage, several, flexible, pressure, therefore, throughout and beginning are my own misspellings from past drafts — check them first when going through point 7 of the checklist in section 0.

### 3.2 Easily confused words

| Word | Part of speech | Meaning | Example |
|---|---|---|---|
| phrase | n. / v. | a group of words; to word something in a certain way | a useful phrase / phrase the question politely |
| rephrase | v. | to say something again in different words (usually your own, to make it clearer) | Could you rephrase that? |
| paraphrase | v. / n. | to restate someone else's text in your own words, keeping the meaning | Paraphrase the question in the introduction. |
| paragraph | n. | a section of writing (similar spelling, unrelated meaning) | the overview paragraph |

The easiest pair to mix up is rephrase and paraphrase: in an intro you reword the question, which is someone else's text, so it is *paraphrase the question*.

  function applyTocShut(){
    Array.prototype.forEach.call(tocList.querySelectorAll('.toc-part, .toc-group'), function(li){
      var tg = li.querySelector(':scope > .toc-row > .toc-tog'), has = li.querySelector(':scope > ul').children.length > 0;
      tg.hidden = !has;
      var shut = has && !!tocShut[li.dataset.p];
      li.classList.toggle('shut', shut);
      tg.setAttribute('aria-expanded', String(!shut));
      tg.setAttribute('aria-label', (shut ? (lang === 'zh' ? '展開 ' : 'Expand ') : (lang === 'zh' ? '收合 ' : 'Collapse ')) + li.querySelector(':scope > .toc-row').textContent.trim());
    });
  }

  function postProcess(){
    var t = T[lang];
    // 2.4: split into selectable groups
    units.forEach(function(u){
      if (!u.collapsible || !/^2\.4\b/.test(u.title.trim())) return;
      var kids = Array.prototype.slice.call(u.body.childNodes), groups = [], curG = null;
      var keyOf = function(el){
        if (!el || el.nodeType !== 1 || el.tagName !== 'P') return null;
        var st = el.firstElementChild; if (!st || st.tagName !== 'STRONG' || el.textContent.trim() !== st.textContent.trim()) return null;
        var x = st.textContent.trim();
        if (/^Intro/i.test(x)) return 'intro';
        if (/^(Body|Support|支撐)/i.test(x)) return 'body';
        if (/^(Contrast|對比)/i.test(x)) return 'contrast';
        if (/^(Conclusion|Full examples|完整範例)/i.test(x)) return 'conclusion';
        return null;
      };
      var lead = document.createDocumentFragment();
      kids.forEach(function(k){
        var key = keyOf(k);
        if (key && !(curG && curG.dataset.g === key)){ curG = document.createElement('div'); curG.className = 'pgroup'; curG.dataset.g = key; groups.push(curG); }
        if (curG) curG.appendChild(k); else lead.appendChild(k);
      });
      if (!groups.length) return;
      u.body.innerHTML = '';
      var bar = document.createElement('div'); bar.className = 'ptabs'; bar.setAttribute('role', 'group');
      ['all','intro','body','contrast','conclusion'].forEach(function(k){
        var b = document.createElement('button'); b.type = 'button'; b.dataset.tab = k; b.textContent = t.tabs[k]; b.setAttribute('aria-pressed', 'false'); bar.appendChild(b);
      });
      u.body.appendChild(lead); u.body.appendChild(bar);
      groups.forEach(function(g){ u.body.appendChild(g); splitSubs(g, t); });
    });
    // 2.5: filter each type's pattern list
    units.forEach(function(u){
      if (!u.collapsible || !/^2\.5\b/.test(u.title.trim())) return;
      var block = 0;
      Array.prototype.forEach.call(u.body.querySelectorAll(':scope > ul'), function(ul){
        var prev = ul.previousElementSibling;
        if (!prev || prev.tagName !== 'P' || !/^(句型|Patterns)[:：]$/.test(prev.textContent.trim())) return;
        var keys = [];
        Array.prototype.forEach.call(ul.querySelectorAll(':scope > li'), function(li){
          var lab = (li.firstChild && li.firstChild.textContent || '').trim();
          var k = /^Intro/i.test(lab) ? 'intro' : /^(優點段|Advantages)/i.test(lab) ? 'adv' : /^(缺點段|Disadvantages)/i.test(lab) ? 'dis'
                : /^(立場|Position)/i.test(lab) ? 'position' : /^(支持段|Support)/i.test(lab) ? 'support' : /^(讓步段|Concession)/i.test(lab) ? 'concession'
                : /^(結論|Conclusion)/i.test(lab) ? 'conclusion' : null;
          if (!k) return; li.dataset.k = k; if (keys.indexOf(k) < 0) keys.push(k);
        });
        if (keys.length < 2) return;
        var bar = document.createElement('div'); bar.className = 'ttabs'; bar.dataset.block = 'b' + block; bar.setAttribute('role', 'group');
        ['all'].concat(keys).forEach(function(k){
          var b = document.createElement('button'); b.type = 'button'; b.dataset.tt = k; b.textContent = k === 'all' ? t.tabs.all : t.ttab[k]; b.setAttribute('aria-pressed', 'false'); bar.appendChild(b);
        });
        ul.parentNode.insertBefore(bar, ul); block++;
      });
    });
    Array.prototype.forEach.call(main.querySelectorAll('table'), function(tb){
      var w = document.createElement('div'); w.className = 'tbl'; tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
      var th = tb.querySelector('th'); if (th && /^(寫成|Written)$/.test(th.textContent.trim())) w.classList.add('errors');
    });
    Array.prototype.forEach.call(main.querySelectorAll('blockquote'), function(bq){
      var tools = document.createElement('div'); tools.className = 'bq-tools';
      tools.innerHTML = '<button class="copy-bq" type="button">' + t.copyAll + '</button>';
      bq.parentNode.insertBefore(tools, bq.nextSibling);
    });
    // checklist: first ordered list under the "0." part
    var zeroPart = null;
    Array.prototype.forEach.call(main.querySelectorAll('.part > h2'), function(h2){ if (/^0\./.test(h2.textContent.trim())) zeroPart = h2.parentNode; });
    if (zeroPart){
      var ol = zeroPart.querySelector('ol');
      if (ol){
        var items = ol.querySelectorAll(':scope > li');
        Array.prototype.forEach.call(items, function(li, i){
          li.className = 'check';
          li.innerHTML = '<label class="chk"><input class="chkbox" type="checkbox" data-i="' + i + '"><span><span class="n">' + (i + 1) + '.</span>' + li.innerHTML + '</span></label>';
        });
        var tools = document.createElement('div'); tools.className = 'chk-tools';
        tools.innerHTML = '<span class="chk-progress" id="chk-progress"></span><button type="button" id="chk-clear">' + t.clear + '</button>';
        ol.parentNode.insertBefore(tools, ol.nextSibling);
      }
    }
    // copy buttons on English list items
    Array.prototype.forEach.call(main.querySelectorAll('li'), function(li){
      if (li.classList.contains('check') || li.querySelector(':scope > label.chk')) return;
      var txt = ownText(li);
      if (txt.length < 3 || !/[A-Za-z]{2,}/.test(txt)) return;
      var b = document.createElement('button'); b.type = 'button'; b.className = 'copy'; b.setAttribute('aria-label', t.copy); b.innerHTML = ICON;
      li.appendChild(b); li.classList.add('has-copy');
    });
  }

  function setOpen(sec, open){
    var btn = sec.querySelector('.tog'); if (!btn) return;
    btn.setAttribute('aria-expanded', String(open)); sec.classList.toggle('collapsed', !open);
  }
  function applyCollapsed(){ units.forEach(function(u){ if (u.collapsible) setOpen(u.el, !collapsed[u.idx]); }); }
  function saveCollapsed(){ store.set('ielts.collapsed', Object.keys(collapsed).filter(function(k){ return collapsed[k]; }).map(Number)); }

  function applyChecks(){
    var boxes = main.querySelectorAll('.chkbox'); var n = 0;
    Array.prototype.forEach.call(boxes, function(cb){ var on = !!checks[cb.dataset.i]; cb.checked = on; cb.closest('.chk').classList.toggle('done', on); if (on) n++; });
    var p = $('#chk-progress'); if (p) p.innerHTML = T[lang].ticked(n, boxes.length);
  }

  function highlight(root, q){
    var re = new RegExp(escRe(q), 'gi');
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: function(n){
      var p = n.parentNode; if (!p || /^(BUTTON|SCRIPT|STYLE|MARK)$/.test(p.tagName)) return NodeFilter.FILTER_REJECT;
      return re.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP; } });
    var nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(n){
      var frag = document.createDocumentFragment(), text = n.nodeValue, last = 0, m; re.lastIndex = 0;
      while ((m = re.exec(text))){
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        var mk = document.createElement('mark'); mk.textContent = m[0]; frag.appendChild(mk); last = m.index + m[0].length;
        if (!m[0].length) re.lastIndex++;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  }

  function applySearch(){ applySearchCore(); applyTabs(); var q = search.value.trim(); Array.prototype.forEach.call(main.querySelectorAll('.group-h'), function(g){ g.hidden = !!q; }); }
  function applySearchCore(){
    var q = search.value.trim(), ql = q.toLowerCase(), count = 0;
    searchWrap.classList.toggle('has', q.length > 0);
    var intro = main.querySelector('.intro'), title = main.querySelector('.doc-title');
    units.forEach(function(u){ u.body.innerHTML = u.html; });
    if (!q){
      units.forEach(function(u){ u.el.hidden = false; if (u.partEl) u.partEl.hidden = false; });
      if (intro) intro.hidden = false; if (title) title.hidden = false;
      applyCollapsed(); applyChecks(); $('#results').textContent = ''; return;
    }
    var parts = {};
    units.forEach(function(u){
      var hit = u.title.toLowerCase().indexOf(ql) >= 0 || u.body.textContent.toLowerCase().indexOf(ql) >= 0;
      u.el.hidden = !hit;
      if (hit){ count++; highlight(u.body, q); if (u.collapsible) setOpen(u.el, true); }
      if (u.partEl){ if (!(u.partEl.id in parts)) parts[u.partEl.id] = false; if (hit) parts[u.partEl.id] = true; }
    });
    units.forEach(function(u){ if (u.partEl) u.partEl.hidden = !parts[u.partEl.id]; });
    if (intro) intro.hidden = true; if (title) title.hidden = true;
    applyChecks();
    $('#results').textContent = count ? T[lang].results(count) : T[lang].none;
  }

  var toastTimer;
  function toast(msg){ var el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1400); }
  function copyText(text){
    var done = function(){ toast(T[lang].copied); };
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, function(){ fallback(); }); } else fallback();
    function fallback(){ var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); done(); }
  }

  // events
  main.addEventListener('click', function(e){
    var tog = e.target.closest('.tog');
    if (tog){ var sec = tog.closest('.sec'), open = tog.getAttribute('aria-expanded') !== 'true'; setOpen(sec, open);
      if (!search.value.trim()){ if (open) delete collapsed[sec.dataset.idx]; else collapsed[sec.dataset.idx] = true; saveCollapsed(); } return; }
    var tt = e.target.closest('.ttabs button'); if (tt){ ttSel[tt.parentNode.dataset.block] = tt.dataset.tt; store.set('ielts.ttab', ttSel); applyTabs(); return; }
    var ps = e.target.closest('.psubs button'); if (ps){ var gg = ps.closest('.pgroup'); psubSel[gg.dataset.g] = ps.dataset.sub; store.set('ielts.psub', psubSel); applyTabs(); return; }
    var pt = e.target.closest('.ptabs button'); if (pt){ ptab = pt.dataset.tab; store.set('ielts.ptab', ptab); applyTabs(); return; }
    var cp = e.target.closest('.copy'); if (cp){ copyText(ownText(cp.parentNode)); return; }
    var cb = e.target.closest('.copy-bq'); if (cb){ var bq = cb.parentNode.previousElementSibling; if (bq) copyText(Array.prototype.map.call(bq.querySelectorAll('p'), function(p){ return p.textContent.trim(); }).join('\n\n')); return; }
    if (e.target.closest('#chk-clear')){ checks = {}; store.set('ielts.checks', checks); applyChecks(); return; }
  });
  main.addEventListener('change', function(e){
    var cb = e.target.closest('.chkbox'); if (!cb) return;
    if (cb.checked) checks[cb.dataset.i] = true; else delete checks[cb.dataset.i];
    store.set('ielts.checks', checks); applyChecks();
  });
  var deb; search.addEventListener('input', function(){ clearTimeout(deb); deb = setTimeout(applySearch, 120); });
  $('#search-clear').addEventListener('click', function(){ search.value = ''; applySearch(); search.focus(); });
  search.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ search.value = ''; applySearch(); } });
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function(b){
    b.addEventListener('click', function(){
      if (b.dataset.lang === lang) return;
      var top = currentUnitId(); lang = b.dataset.lang; store.set('ielts.lang.v2', lang); render();
      if (top){ var el = document.getElementById(top); if (el) el.scrollIntoView({ block: 'start' }); }
    });
  });
  $('#expand-all').addEventListener('click', function(){
    collapsed = {}; saveCollapsed(); applyCollapsed();
    tocShut = {}; store.set('ielts.tocShut', tocShut); applyTocShut();
  });
  $('#collapse-all').addEventListener('click', function(){
    units.forEach(function(u){ if (u.collapsible) collapsed[u.idx] = true; }); saveCollapsed(); applyCollapsed();
    Array.prototype.forEach.call(tocList.querySelectorAll('.toc-part, .toc-group'), function(li){ if (li.querySelector(':scope > ul').children.length) tocShut[li.dataset.p] = true; });
    store.set('ielts.tocShut', tocShut); applyTocShut();
  });

  function currentUnitId(){
    var barH = document.querySelector('.bar').getBoundingClientRect().bottom;
    for (var i = 0; i < units.length; i++){ var r = units[i].el.getBoundingClientRect(); if (!units[i].el.hidden && r.bottom > barH + 8) return units[i].el.id; }
    return null;
  }

  // drawer
  var toc = $('#toc'), scrim = $('#scrim'), menuBtn = $('#menu-btn');
  var desk = window.matchMedia('(min-width:900px)');
  function openToc(o){ toc.classList.toggle('open', o); scrim.classList.toggle('show', o); menuBtn.setAttribute('aria-expanded', String(o)); }
  function setHidden(h){ tocHidden = h; store.set('ielts.tocHidden', h); document.body.classList.toggle('toc-hidden', h); if (desk.matches) menuBtn.setAttribute('aria-expanded', String(!h)); }
  document.body.classList.toggle('toc-hidden', tocHidden);
  if (desk.matches) menuBtn.setAttribute('aria-expanded', String(!tocHidden));
  menuBtn.addEventListener('click', function(){ if (desk.matches) setHidden(!tocHidden); else openToc(!toc.classList.contains('open')); });
  $('#toc-close').addEventListener('click', function(){ if (desk.matches) setHidden(true); else openToc(false); });
  var onMq = function(){ openToc(false); menuBtn.setAttribute('aria-expanded', String(desk.matches ? !tocHidden : false)); };
  if (desk.addEventListener) desk.addEventListener('change', onMq); else if (desk.addListener) desk.addListener(onMq);
  scrim.addEventListener('click', function(){ openToc(false); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') openToc(false); });
  tocList.addEventListener('click', function(e){
    var tg = e.target.closest('.toc-tog');
    if (tg){ var li = tg.closest('.toc-group, .toc-part'); if (tocShut[li.dataset.p]) delete tocShut[li.dataset.p]; else tocShut[li.dataset.p] = true; store.set('ielts.tocShut', tocShut); applyTocShut(); return; }
    var a = e.target.closest('a'); if (!a) return;
    var id = a.getAttribute('href').slice(1), el = document.getElementById(id);
    if (el){ var sec = el.closest('.sec'); if (sec && sec.classList.contains('collapsed')){ setOpen(sec, true); delete collapsed[sec.dataset.idx]; saveCollapsed(); } }
    if (!desk.matches) openToc(false);
  });

  // active heading in TOC
  var io;
  function observeHeadings(){
    if (io) io.disconnect(); if (!('IntersectionObserver' in window)) return;
    var links = {}; Array.prototype.forEach.call(tocList.querySelectorAll('a'), function(a){ links[a.getAttribute('href').slice(1)] = a; });
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if (en.isIntersecting){ Array.prototype.forEach.call(tocList.querySelectorAll('a.active'), function(a){ a.classList.remove('active'); }); var l = links[en.target.id]; if (l){ l.classList.add('active'); } } });
    }, { rootMargin: '-64px 0px -75% 0px', threshold: 0 });
    units.forEach(function(u){ if (u.collapsible) io.observe(u.el); });
    Array.prototype.forEach.call(main.querySelectorAll('.part > h2'), function(h){ io.observe(h); });
  }

  function boot(){ setupMarked(); render(); }
  if (window.marked){ boot(); }
  else {
    var alt = document.createElement('script'); alt.src = 'https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js';
    alt.onload = boot; alt.onerror = boot; document.head.appendChild(alt);
  }
})();
</script>
</body>
