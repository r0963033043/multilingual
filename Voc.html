"vw\" data-w=\"gesture\">gesture<\/b> could undo her resolve, and she felt his stare <b class=\"vw\" data-w=\"weigh\">weigh<\/b> on her long after he looked away. Love, she joked, was never a simple <b class=\"vw\" data-w=\"equation\">equation<\/b>; her <b class=\"vw\" data-w=\"imagination\">imagination<\/b> could never have invented a stranger world.<\/p><p>Alice planned the wedding <b class=\"vw\" data-w=\"ceremony\">ceremony<\/b> as if it were a <b class=\"vw\" data-w=\"historic\">historic<\/b> event. Her <b class=\"vw\" data-w=\"expenditure\">expenditure<\/b> on flowers alone could have funded a small town, and she seemed determined to <b class=\"vw\" data-w=\"exceed\">exceed<\/b> every expectation. When Bella refused certain traditions, Alice had to <b class=\"vw\" data-w=\"modify\">modify<\/b> the whole plan, and she and Edward would <b class=\"vw\" data-w=\"disagree\">disagree<\/b> for hours about what was safest. Charlie, meanwhile, grumbled about <b class=\"vw\" data-w=\"inflation\">inflation<\/b> every time he filled the truck and packed his fishing <b class=\"vw\" data-w=\"gear\">gear<\/b> the same careful way each weekend. A <b class=\"vw\" data-w=\"pile\">pile<\/b> of unread books sat on Bella&#x27;s desk, and she would hear the <b class=\"vw\" data-w=\"click\">click<\/b> of the front door when Charlie came home.<\/p><p>Months later, Bella was <b class=\"vw\" data-w=\"pregnant\">pregnant<\/b>, and the <b class=\"vw\" data-w=\"mixture\">mixture<\/b> of terror and certainty in her eyes frightened everyone. A <b class=\"vw\" data-w=\"flash\">flash<\/b> of pain could <b class=\"vw\" data-w=\"twist\">twist<\/b> her whole body. Edward&#x27;s hand rose to his own <b class=\"vw\" data-w=\"throat\">throat<\/b> whenever her scent grew stronger, but he would rather <b class=\"vw\" data-w=\"injure\">injure<\/b> himself than let anything touch her. Jasper joked that being near her calm felt like <b class=\"vw\" data-w=\"therapy\">therapy<\/b>, and Emmett tried to <b class=\"vw\" data-w=\"entertain\">entertain<\/b> everyone with a story about chasing a wild <b class=\"vw\" data-w=\"pig\">pig<\/b>. Charlie had once tried to <b class=\"vw\" data-w=\"assign\">assign<\/b> her extra chores just to keep her home, and her sleep <b class=\"vw\" data-w=\"deficit\">deficit<\/b> from nightmares left her exhausted. Jacob stayed as <b class=\"vw\" data-w=\"reliable\">reliable<\/b> as ever.<\/p><p>Bella decided to <b class=\"vw\" data-w=\"tackle\">tackle<\/b> her fear head-on. Later, only a <b class=\"vw\" data-w=\"poet\">poet<\/b> could have described her <b class=\"vw\" data-w=\"joy\">joy<\/b> at Renesmee&#x27;s first laugh. Her life had become so <b class=\"vw\" data-w=\"fantastic\">fantastic<\/b> that ordinary problems felt like a relief. Edward had promised her <b class=\"vw\" data-w=\"forever\">forever<\/b>, and the sky over La Push glowed deep <b class=\"vw\" data-w=\"orange\">orange<\/b> that evening.<\/p>"}, {"tier": "T4", "id": "T4-04", "html": "<p>Jacob&#x27;s <b class=\"vw\" data-w=\"tale\">tale<\/b> about the &quot;cold ones&quot;, told on First Beach, was the first real warning Bella ignored. To the Quileute, the wolves were protectors, not monsters, and the tribal council of elders made its decisions in a more <b class=\"vw\" data-w=\"democratic\">democratic<\/b> way than the pack, which simply followed its Alpha. Carlisle studied the old legends like a <b class=\"vw\" data-w=\"scholar\">scholar<\/b>.<\/p><p>The uneasy <b class=\"vw\" data-w=\"partnership\">partnership<\/b> between the wolves and the Cullens held only because of Bella. Alice joked that the treaty needed a <b class=\"vw\" data-w=\"clause\">clause<\/b> just for Bella&#x27;s clumsiness, and crossing into Cullen land carried a <b class=\"vw\" data-w=\"penalty\">penalty<\/b> the wolves took seriously. Bella&#x27;s <b class=\"vw\" data-w=\"participation\">participation<\/b> in her own rescue mattered more to her than anyone&#x27;s permission; she had more at <b class=\"vw\" data-w=\"stake\">stake<\/b> than anyone else in that clearing.<\/p><p>She had never expected to fall in love with a <b class=\"vw\" data-w=\"creature\">creature<\/b> from the old stories. Her nightmares were <b class=\"vw\" data-w=\"psychological\">psychological<\/b> rather than physical. Edward stayed away for months for her <b class=\"vw\" data-w=\"sake\">sake<\/b>, or so he told himself, and lived under a <b class=\"vw\" data-w=\"constraint\">constraint<\/b> he never fully explained. Jacob&#x27;s mood shifted <b class=\"vw\" data-w=\"dramatically\">dramatically<\/b> whenever Edward was mentioned, while Seth&#x27;s wolf <b class=\"vw\" data-w=\"tail\">tail<\/b> flicked with excitement when Bella visited. Jacob&#x27;s easy laugh always gave her a <b class=\"vw\" data-w=\"boost\">boost<\/b>. Her fear of the Cullens began to <b class=\"vw\" data-w=\"evolve\">evolve<\/b> into a sense of belonging, and every crisis seemed to <b class=\"vw\" data-w=\"strengthen\">strengthen<\/b> her bond with Edward.<\/p><p>Charlie&#x27;s idea of truck <b class=\"vw\" data-w=\"maintenance\">maintenance<\/b> was mostly hope and tape, and his dinners rarely went beyond whatever fit in one <b class=\"vw\" data-w=\"pot\">pot<\/b>. An old photograph sat on the <b class=\"vw\" data-w=\"shelf\">shelf<\/b> above his desk, the <b class=\"vw\" data-w=\"wooden\">wooden<\/b> porch creaked under his boots, and he tossed takeaway boxes into the <b class=\"vw\" data-w=\"bin\">bin<\/b>. Beyond the Cullens&#x27; land, a single stubborn <b class=\"vw\" data-w=\"cow\">cow<\/b> still grazed in an old pasture. One evening the news was full of the debate over <b class=\"vw\" data-w=\"abortion\">abortion<\/b> laws, and Charlie switched it off as a <b class=\"vw\" data-w=\"boom\">boom<\/b> of thunder rolled over Forks.<\/p><p>Alice always seemed to <b class=\"vw\" data-w=\"fancy\">fancy<\/b> the most extravagant plan, and she replaced Bella&#x27;s entire <b class=\"vw\" data-w=\"clothing\">clothing<\/b> collection more than once. Bella&#x27;s most treasured <b class=\"vw\" data-w=\"possession\">possession<\/b> was a bundle of old letters that her mother said read like <b class=\"vw\" data-w=\"poetry\">poetry<\/b>, and a quick <b class=\"vw\" data-w=\"chat\">chat<\/b> with Angela was the closest thing to normal she had left. She stayed <b class=\"vw\" data-w=\"curious\">curious<\/b> long after a sensible person would have run. Edward&#x27;s body reacted <b class=\"vw\" data-w=\"automatically\">automatically<\/b> to her scent, and <b class=\"vw\" data-w=\"whilst\">whilst<\/b> he hunted, she counted the hours. She missed the warning signs and <b class=\"vw\" data-w=\"consequently\">consequently<\/b> walked into the trap. She knew she would <b class=\"vw\" data-w=\"undergo\">undergo<\/b> terrible pain if she chose his life, and every decision felt <b class=\"vw\" data-w=\"potentially\">potentially<\/b> fatal; the <b class=\"vw\" data-w=\"scope\">scope<\/b> of Alice&#x27;s visions kept shifting. As Esme began to <b class=\"vw\" data-w=\"fold\">fold<\/b> the same blanket twice, Bella realised she could no longer <b class=\"vw\" data-w=\"pretend\">pretend<\/b> an ordinary life was possible. The Volturi&#x27;s stone <b class=\"vw\" data-w=\"chamber\">chamber<\/b> would be colder than anywhere she had ever stood.<\/p>"}, {"tier": "T4", "id": "T4-05", "html": "<p>Charlie&#x27;s <b class=\"vw\" data-w=\"pride\">pride<\/b> in Bella never needed loud words, and his routines gave her a <b class=\"vw\" data-w=\"stability\">stability<\/b> her mother&#x27;s house had never offered. His small-town <b class=\"vw\" data-w=\"jail\">jail<\/b> rarely held anyone overnight, and his fridge held little besides eggs and a block of <b class=\"vw\" data-w=\"cheese\">cheese<\/b>. An old <b class=\"vw\" data-w=\"pipe\">pipe<\/b> under the sink leaked every winter. He kept a shotgun in the <b class=\"vw\" data-w=\"rear\">rear<\/b> of his truck, which produced more <b class=\"vw\" data-w=\"carbon\">carbon<\/b> emissions than any car in Forks.<\/p><p>Carlisle&#x27;s <b class=\"vw\" data-w=\"strict\">strict<\/b> rule about human blood never bent, and his <b class=\"vw\" data-w=\"wise\">wise<\/b>, patient calm steadied the whole family. Each Cullen had a <b class=\"vw\" data-w=\"distinct\">distinct<\/b> gift, but their <b class=\"vw\" data-w=\"diversity\">diversity<\/b> of talents still did not include the one thing Edward wanted most. Jasper worked constantly to <b class=\"vw\" data-w=\"regulate\">regulate<\/b> the mood of the house, and Emmett&#x27;s dark <b class=\"vw\" data-w=\"humor\">humor<\/b> made Bella laugh during the worst weeks; he once dared Jasper to <b class=\"vw\" data-w=\"ski\">ski<\/b> down a slope no human would attempt.<\/p><p>Bella had never believed in <b class=\"vw\" data-w=\"magic\">magic<\/b> until she fell in love with something that shouldn&#x27;t exist, and every new fact only deepened the <b class=\"vw\" data-w=\"mystery\">mystery<\/b>. She used to think humans were the only <b class=\"vw\" data-w=\"species\">species<\/b> worth worrying about. Edward would <b class=\"vw\" data-w=\"whisper\">whisper<\/b> her name as if it were fragile, and his <b class=\"vw\" data-w=\"piano\">piano<\/b> filled the house at night. She wished she had learned the <b class=\"vw\" data-w=\"guitar\">guitar<\/b>, just to keep her hands busy. The <b class=\"vw\" data-w=\"intense\">intense<\/b> look he gave her made her forget what she had been saying.<\/p><p>There was no <b class=\"vw\" data-w=\"indication\">indication<\/b> that anything had changed until Alice&#x27;s face went blank; her silence was always a <b class=\"vw\" data-w=\"flag\">flag<\/b> that danger was near. Victoria&#x27;s plan for <b class=\"vw\" data-w=\"destruction\">destruction<\/b> never accounted for Bella&#x27;s friends, and the smallest paper cut could <b class=\"vw\" data-w=\"trigger\">trigger<\/b> a disaster. Charlie&#x27;s careful <b class=\"vw\" data-w=\"inquiry\">inquiry<\/b> about Edward always ended badly. The wolves would <b class=\"vw\" data-w=\"allege\">allege<\/b> that the treaty had been broken long before anyone found proof. &quot;<b class=\"vw\" data-w=\"damn\">Damn<\/b>,&quot; Jacob muttered, reading the tracks in the mud.<\/p><p>Bella needed something <b class=\"vw\" data-w=\"concrete\">concrete<\/b> to hold on to. During Edward&#x27;s absence she had felt like an empty <b class=\"vw\" data-w=\"shell\">shell<\/b>, and now she had to <b class=\"vw\" data-w=\"resign\">resign<\/b> herself to secrets she could never share. Her fragility was more than <b class=\"vw\" data-w=\"mere\">mere<\/b> weakness; she slowly accepted the <b class=\"vw\" data-w=\"limitation\">limitations<\/b> of her body, even as she began to <b class=\"vw\" data-w=\"neglect\">neglect<\/b> her own safety. Edward would <b class=\"vw\" data-w=\"compose\">compose<\/b> himself before speaking, and Alice could <b class=\"vw\" data-w=\"craft\">craft<\/b> an alibi faster than Bella could invent an excuse. The Cullen house became her only <b class=\"vw\" data-w=\"shelter\">shelter<\/b>. <b class=\"vw\" data-w=\"presumably\">Presumably<\/b>, Alice already knew how the evening would end, so Bella barely glanced at the <b class=\"vw\" data-w=\"menu\">menu<\/b> and watched the <b class=\"vw\" data-w=\"moon\">moon<\/b> rise over the trees.<\/p>"}, {"tier": "T4", "id": "T4-06", "html": "<p>Forks saw almost no <b class=\"vw\" data-w=\"tourism\">tourism<\/b>, which suited the Cullens perfectly. The <b class=\"vw\" data-w=\"interior\">interior<\/b> of their house looked nothing like a gothic mansion, and Esme was always the first to <b class=\"vw\" data-w=\"greet\">greet<\/b> Bella at the door. Edward&#x27;s latest <b class=\"vw\" data-w=\"composition\">composition<\/b> on the piano sounded as if it had been written just for her.<\/p><p>Bella <b class=\"vw\" data-w=\"barely\">barely<\/b> noticed the cold once Edward was beside her. His skin would <b class=\"vw\" data-w=\"shine\">shine<\/b> faintly in the sun, and he seemed to appear from <b class=\"vw\" data-w=\"nowhere\">nowhere<\/b> whenever she was in danger. She once listed every <b class=\"vw\" data-w=\"pro\">pro<\/b> and con of immortality on a notepad, then threw it away. Her <b class=\"vw\" data-w=\"motivation\">motivation<\/b> for staying in Forks had changed completely; her life felt <b class=\"vw\" data-w=\"romantic\">romantic<\/b> and dangerous at once.<\/p><p>When Edward was in danger, Alice bought the first <b class=\"vw\" data-w=\"airline\">airline<\/b> tickets to Italy she could find, and Bella felt like a <b class=\"vw\" data-w=\"civilian\">civilian<\/b> caught in someone else&#x27;s war. At school her <b class=\"vw\" data-w=\"stomach\">stomach<\/b> dropped at the smell of blood, and she pressed a <b class=\"vw\" data-w=\"tissue\">tissue<\/b> to her nose; on the <b class=\"vw\" data-w=\"stair\">stair<\/b> she gripped the rail, sure her clumsiness would catch up with her. Charlie wasn&#x27;t a man who would <b class=\"vw\" data-w=\"pray\">pray<\/b> often, but that year he might have started. He would <b class=\"vw\" data-w=\"bless\">bless<\/b> her stubbornness one moment and curse it the next, and he spoke <b class=\"vw\" data-w=\"firmly\">firmly<\/b> about curfews. He kept a lucky <b class=\"vw\" data-w=\"coin\">coin<\/b> in his pocket and hung his uniform <b class=\"vw\" data-w=\"belt\">belt<\/b> by the door, boiled every <b class=\"vw\" data-w=\"potato\">potato<\/b> until it fell apart, bought a new coffee <b class=\"vw\" data-w=\"maker\">maker<\/b> when the old one broke and hid a box of <b class=\"vw\" data-w=\"chocolate\">chocolate<\/b> for Bella&#x27;s bad days. A <b class=\"vw\" data-w=\"bunch\">bunch<\/b> of wildflowers wilted on her desk.<\/p><p>Carlisle and Sam agreed on an <b class=\"vw\" data-w=\"amendment\">amendment<\/b> to the treaty that let the wolves and the Cullens fight side by side. The agreement depended on <b class=\"vw\" data-w=\"cooperation\">cooperation<\/b> that neither side fully trusted, and the elders gave only reluctant <b class=\"vw\" data-w=\"sanction\">sanction<\/b>. At times Bella felt she stood before a silent <b class=\"vw\" data-w=\"jury\">jury<\/b> of Cullens. Carlisle would <b class=\"vw\" data-w=\"scan\">scan<\/b> the emergency reports each night. Alice&#x27;s visions felt like a cruel <b class=\"vw\" data-w=\"trick\">trick<\/b> when they showed nothing useful, and they seemed to <b class=\"vw\" data-w=\"stimulate\">stimulate<\/b> more panic than they solved. Edward stayed, <b class=\"vw\" data-w=\"regardless\">regardless<\/b> of every reason Bella gave him to go, and would <b class=\"vw\" data-w=\"hesitate\">hesitate<\/b> for only a moment before putting her safety first.<\/p><p>Bella had to <b class=\"vw\" data-w=\"invent\">invent<\/b> explanations Charlie might believe, and her own <b class=\"vw\" data-w=\"narrative\">narrative<\/b> of that year left out almost everything true. She would reread the same <b class=\"vw\" data-w=\"paragraph\">paragraph<\/b> four times without taking it in. Renesmee never met her human <b class=\"vw\" data-w=\"grandmother\">grandmother<\/b>. After an unfair incident at school, the principal held a meeting on <b class=\"vw\" data-w=\"racial\">racial<\/b> equality. Emmett treated every argument like a <b class=\"vw\" data-w=\"championship\">championship<\/b>, and Bella looked <b class=\"vw\" data-w=\"hopefully\">hopefully<\/b> at the tree line.<\/p>"}, {"tier": "T4", "id": "T4-07", "html": "<p>Bella used to think vampires belonged only in <b class=\"vw\" data-w=\"fiction\">fiction<\/b>. Then a single <b class=\"vw\" data-w=\"bite\">bite<\/b> changed the course of her life. <b class=\"vw\" data-w=\"firstly\">Firstly<\/b>, she had to convince Charlie that she was fine; everything else could wait.<\/p><p>The <b class=\"vw\" data-w=\"attraction\">attraction<\/b> between Bella and Edward defied every warning. His eyes turned a warm <b class=\"vw\" data-w=\"golden\">golden<\/b> colour whenever he had hunted. Bella grew <b class=\"vw\" data-w=\"anxious\">anxious<\/b> whenever Alice went quiet mid-sentence, and the constant fear seemed to <b class=\"vw\" data-w=\"exhaust\">exhaust<\/b> her. It took <b class=\"vw\" data-w=\"nerve\">nerve<\/b> to walk toward danger, but her <b class=\"vw\" data-w=\"determination\">determination<\/b> to stay with Edward never wavered. She had never asked for an <b class=\"vw\" data-w=\"adventure\">adventure<\/b>, yet she was living one.<\/p><p>The <b class=\"vw\" data-w=\"complexity\">complexity<\/b> of the treaty gave her a headache. Its <b class=\"vw\" data-w=\"implementation\">implementation<\/b> required patience from both sides, and the Volturi&#x27;s main <b class=\"vw\" data-w=\"guideline\">guideline<\/b> — never expose vampires to humans — was the one rule nobody dared break. Charlie&#x27;s <b class=\"vw\" data-w=\"bias\">bias<\/b> against Edward never fully disappeared, and Bella worried that she was more of a <b class=\"vw\" data-w=\"liability\">liability<\/b> than a help in the fight against Victoria. <b class=\"vw\" data-w=\"surprisingly\">Surprisingly<\/b>, the truce between Jacob and Edward held longer than anyone predicted.<\/p><p>In Volterra, a human <b class=\"vw\" data-w=\"servant\">servant<\/b> greeted visitors without knowing who her masters were. The Volturi&#x27;s headquarters looked like a <b class=\"vw\" data-w=\"castle\">castle<\/b>, and Jasper fought like a <b class=\"vw\" data-w=\"veteran\">veteran<\/b> of wars no book recorded. The Cullens&#x27; <b class=\"vw\" data-w=\"excess\">excess<\/b> of wealth never impressed Bella; to Edward, an ordinary morning together was a <b class=\"vw\" data-w=\"luxury\">luxury<\/b>. She sometimes felt like an <b class=\"vw\" data-w=\"immigrant\">immigrant<\/b> in her strange new world and feared it would <b class=\"vw\" data-w=\"consume\">consume<\/b> her old life. She saw everything <b class=\"vw\" data-w=\"differently\">differently<\/b> now.<\/p><p>Carlisle&#x27;s <b class=\"vw\" data-w=\"biological\">biological<\/b> curiosity never faded. Alice tried to <b class=\"vw\" data-w=\"extract\">extract<\/b> every detail from her visions and kept a mental <b class=\"vw\" data-w=\"catalog\">catalog<\/b> of every dress Bella refused to wear. Charlie&#x27;s <b class=\"vw\" data-w=\"weekly\">weekly<\/b> fishing trips continued, the <b class=\"vw\" data-w=\"continuous\">continuous<\/b> rain never stopped, and the <b class=\"vw\" data-w=\"ocean\">ocean<\/b> stayed cold and grey. Bella posted a letter without a <b class=\"vw\" data-w=\"stamp\">stamp<\/b>, found an old <b class=\"vw\" data-w=\"envelope\">envelope<\/b> of photos, and fought with an ancient <b class=\"vw\" data-w=\"printer\">printer<\/b> the night before an essay was due. Jacob could carve wood with a <b class=\"vw\" data-w=\"knife\">knife<\/b> better than anyone she knew, and an old <b class=\"vw\" data-w=\"fence\">fence<\/b> marked the line no one crossed. Bella traced the pattern in the <b class=\"vw\" data-w=\"carpet\">carpet<\/b>, slipped <b class=\"vw\" data-w=\"quietly\">quietly<\/b> out of the house and saw her <b class=\"vw\" data-w=\"reflection\">reflection<\/b> look more tired each week. She promised to follow Edward <b class=\"vw\" data-w=\"wherever\">wherever<\/b> he went, though she wasn&#x27;t <b class=\"vw\" data-w=\"altogether\">altogether<\/b> sure what that would mean.<\/p>"}, {"tier": "T4", "id": "T4-08", "html": "<p>Bella&#x27;s English teacher cared more about <b class=\"vw\" data-w=\"grammar\">grammar<\/b> than about the students falling asleep, and he circled the wrong <b class=\"vw\" data-w=\"verb\">verb<\/b> tense in her essay and told her to <b class=\"vw\" data-w=\"revise\">revise<\/b> it. When the <b class=\"vw\" data-w=\"bell\">bell<\/b> rang, she rushed out, though she didn&#x27;t need to <b class=\"vw\" data-w=\"hurry\">hurry<\/b>; Edward could close any distance in a second.<\/p><p>Her <b class=\"vw\" data-w=\"confusion\">confusion<\/b> grew the longer he avoided her questions. No <b class=\"vw\" data-w=\"logic\">logic<\/b> could explain why she felt safest around the most dangerous person she knew. The pack&#x27;s decision to protect a human was <b class=\"vw\" data-w=\"controversial\">controversial<\/b>, and Bella&#x27;s fear felt <b class=\"vw\" data-w=\"raw\">raw<\/b> the first time she saw Jasper struggle for control. Edward wouldn&#x27;t even <b class=\"vw\" data-w=\"hint\">hint<\/b> at what he was thinking, and Charlie <b class=\"vw\" data-w=\"reckon\">reckoned<\/b> she was hiding something.<\/p><p>Her only <b class=\"vw\" data-w=\"transportation\">transportation<\/b> was an ancient truck. She slipped twice on an icy <b class=\"vw\" data-w=\"slope\">slope<\/b> before Edward caught her, and she tried not to <b class=\"vw\" data-w=\"panic\">panic<\/b> in the dark woods. Old boxes filled the house&#x27;s <b class=\"vw\" data-w=\"storage\">storage<\/b> space; Charlie kept a fishing <b class=\"vw\" data-w=\"hook\">hook<\/b> in his hat, and his cooking stopped at boiling <b class=\"vw\" data-w=\"rice\">rice<\/b>. Bella had no <b class=\"vw\" data-w=\"uncle\">uncle<\/b> nearby, only the borrowed family the Cullens offered. A <b class=\"vw\" data-w=\"rat\">rat<\/b> scurried across an empty car park the night Bella got lost in Port Angeles, and the sunlight would <b class=\"vw\" data-w=\"filter\">filter<\/b> only weakly through the clouds.<\/p><p>Her <b class=\"vw\" data-w=\"happiness\">happiness<\/b> felt fragile. Charlie&#x27;s worry was always <b class=\"vw\" data-w=\"genuine\">genuine<\/b>, and he <b class=\"vw\" data-w=\"reasonably\">reasonably<\/b> expected explanations she could never give. She felt <b class=\"vw\" data-w=\"silly\">silly<\/b> for hoping an ordinary story could cover any of it, and she began to <b class=\"vw\" data-w=\"harbor\">harbor<\/b> doubts about surviving the change. After Victoria appeared, she had <b class=\"vw\" data-w=\"horrible\">horrible<\/b> nightmares. Emmett treated every disaster like a <b class=\"vw\" data-w=\"comedy\">comedy<\/b>, while Edward would <b class=\"vw\" data-w=\"chase\">chase<\/b> down anything that threatened her. Sometimes Bella felt the <b class=\"vw\" data-w=\"universe\">universe<\/b> had made a mistake. Jacob joked that she followed Edward around like a <b class=\"vw\" data-w=\"sheep\">sheep<\/b>; she had never expected to become the <b class=\"vw\" data-w=\"lover\">lover<\/b> of a &quot;monster&quot;. An old <b class=\"vw\" data-w=\"portrait\">portrait<\/b> of Carlisle hung in the study, and Bella no longer felt <b class=\"vw\" data-w=\"innocent\">innocent<\/b> about the world.<\/p><p>Nothing could <b class=\"vw\" data-w=\"substitute\">substitute<\/b> for what she really wanted, and Jacob&#x27;s warmth was no exception. Charlie took a vitamin <b class=\"vw\" data-w=\"supplement\">supplement<\/b> every morning. Bella&#x27;s plans needed more than one <b class=\"vw\" data-w=\"adjustment\">adjustment<\/b>, so she tried to stay <b class=\"vw\" data-w=\"flexible\">flexible<\/b>. She imagined her body as a <b class=\"vw\" data-w=\"vessel\">vessel<\/b> for a secret too large to hold, and Edward&#x27;s eyes looked dark and <b class=\"vw\" data-w=\"liquid\">liquid<\/b> when he had not hunted. That night, a <b class=\"vw\" data-w=\"cluster\">cluster<\/b> of Cullens gathered around Carlisle&#x27;s desk.<\/p>"}, {"tier": "T4", "id": "T4-09", "html": "<p>Bella&#x27;s fear used to be <b class=\"vw\" data-w=\"abstract\">abstract<\/b>, until it had a name and a scent. Alice&#x27;s visions were never <b class=\"vw\" data-w=\"precise\">precise<\/b> enough to give her peace, and Edward&#x27;s eyes went <b class=\"vw\" data-w=\"distant\">distant<\/b> whenever he remembered the past. Bella began to feel like a <b class=\"vw\" data-w=\"stranger\">stranger<\/b> in her own skin.<\/p><p>The Cullens kept to the <b class=\"vw\" data-w=\"shade\">shade<\/b>, and their house was <b class=\"vw\" data-w=\"situate\">situated<\/b> far from town. Edward could <b class=\"vw\" data-w=\"leap\">leap<\/b> across a ravine as easily as Bella stepped over a puddle, but whenever a branch would <b class=\"vw\" data-w=\"snap\">snap<\/b> in the woods, she froze. She tried to <b class=\"vw\" data-w=\"summarize\">summarize<\/b> the impossible situation and still came up short. She calculated the <b class=\"vw\" data-w=\"probability\">probability<\/b> of surviving her choices and decided not to think about it, living instead with constant <b class=\"vw\" data-w=\"uncertainty\">uncertainty<\/b>.<\/p><p>Charlie&#x27;s old <b class=\"vw\" data-w=\"leather\">leather<\/b> jacket smelled of fish. Bella made Jacob <b class=\"vw\" data-w=\"swear\">swear<\/b> not to tell him anything; sometimes she felt like a <b class=\"vw\" data-w=\"refugee\">refugee<\/b> from her ordinary life. She and Jacob spent hours on the <b class=\"vw\" data-w=\"shore\">shore<\/b> at La Push, and Charlie&#x27;s <b class=\"vw\" data-w=\"monthly\">monthly<\/b> fishing trip with Billy was one of the few normal things left. The pack now <b class=\"vw\" data-w=\"comprise\">comprised<\/b> more wolves than Sam had expected to lead.<\/p><p>Edward&#x27;s voice could <b class=\"vw\" data-w=\"stir\">stir<\/b> something in her she couldn&#x27;t explain. Her <b class=\"vw\" data-w=\"excitement\">excitement<\/b> about the wedding never quite drowned out her nerves, and Charlie would <b class=\"vw\" data-w=\"sigh\">sigh<\/b> whenever Edward was mentioned. Then came the <b class=\"vw\" data-w=\"pregnancy\">pregnancy<\/b>, and everything changed. Carlisle&#x27;s <b class=\"vw\" data-w=\"experimental\">experimental<\/b> theories kept the family on edge, while the Volturi&#x27;s <b class=\"vw\" data-w=\"institutional\">institutional<\/b> power made them more dangerous than any single vampire; they ran their <b class=\"vw\" data-w=\"empire\">empire<\/b> of secrecy with a frightening calm. Bella could barely eat a <b class=\"vw\" data-w=\"slice\">slice<\/b> of toast.<\/p><p>She would <b class=\"vw\" data-w=\"wander\">wander<\/b> through the woods to feel closer to what she had lost, and <b class=\"vw\" data-w=\"subsequently\">subsequently<\/b> learned that some choices cannot be undone. Edward&#x27;s voice always stayed <b class=\"vw\" data-w=\"gentle\">gentle<\/b>. Her <b class=\"vw\" data-w=\"attendance\">attendance<\/b> at school had become a performance, and she struggled with the idea of <b class=\"vw\" data-w=\"ownership\">ownership<\/b> over a life that no longer felt like hers. What <b class=\"vw\" data-w=\"qualification\">qualification<\/b> could anyone have for what she was facing? She had to <b class=\"vw\" data-w=\"suspend\">suspend<\/b> every normal plan and simply stay <b class=\"vw\" data-w=\"functional\">functional<\/b>. Loving Edward no longer felt <b class=\"vw\" data-w=\"voluntary\">voluntary<\/b>. His skin was <b class=\"vw\" data-w=\"pale\">pale<\/b> and smooth; she scrubbed at a <b class=\"vw\" data-w=\"stain\">stain<\/b> on her shirt and joked that only an <b class=\"vw\" data-w=\"athlete\">athlete<\/b> could keep up with him. She had never cared whether her food was <b class=\"vw\" data-w=\"organic\">organic<\/b>. The night before the battle, she slept in a <b class=\"vw\" data-w=\"tent\">tent<\/b> on the mountain while Jacob kept her warm. There wasn&#x27;t a <b class=\"vw\" data-w=\"grain\">grain<\/b> of doubt left in her mind.<\/p>"}, {"tier": "T4", "id": "T4-10", "html": "<p>Bella arrived in Forks in January, expecting grey skies and boredom; by the following <b class=\"vw\" data-w=\"autumn\">autumn<\/b>, nothing about her life was boring. The town barely had enough people to need a <b class=\"vw\" data-w=\"mayor\">mayor<\/b>. At the diner, the <b class=\"vw\" data-w=\"server\">server<\/b> kept refilling Charlie&#x27;s coffee, used to his long silences, and Bella&#x27;s <b class=\"vw\" data-w=\"aunt\">aunt<\/b> far away had no idea how strange her niece&#x27;s life was about to become. Forks received so little sunshine that <b class=\"vw\" data-w=\"solar\">solar<\/b> panels would have been useless there.<\/p><p>Bella bit her <b class=\"vw\" data-w=\"tongue\">tongue<\/b> to keep from blurting out the truth, and searched an old <b class=\"vw\" data-w=\"website\">website<\/b> about local legends. She refused to <b class=\"vw\" data-w=\"fool\">fool<\/b> herself. Jacob walked <b class=\"vw\" data-w=\"alongside\">alongside<\/b> her in silence; the treaty was supposed to <b class=\"vw\" data-w=\"unite\">unite<\/b> two enemies who trusted nothing about each other. Edward <b class=\"vw\" data-w=\"gently\">gently<\/b> brushed the hair from her face, and his <b class=\"vw\" data-w=\"gaze\">gaze<\/b> could hold her still across a crowded room. She tried to <b class=\"vw\" data-w=\"compute\">compute<\/b> how much human time she had left, and gave up.<\/p><p>She would <b class=\"vw\" data-w=\"wipe\">wipe<\/b> the fog from her window each morning. She had grown used to <b class=\"vw\" data-w=\"weird\">weird<\/b>, but she feared her human memories would <b class=\"vw\" data-w=\"fade\">fade<\/b>. Charlie&#x27;s winter <b class=\"vw\" data-w=\"cough\">cough<\/b> worried her. Carlisle&#x27;s <b class=\"vw\" data-w=\"hypothesis\">hypothesis<\/b> about her resistance kept changing. The Volturi carried themselves with a <b class=\"vw\" data-w=\"royal\">royal<\/b> certainty, and her danger stopped being <b class=\"vw\" data-w=\"theoretical\">theoretical<\/b> the day Victoria showed up. Bella kept the <b class=\"vw\" data-w=\"curtain\">curtain<\/b> drawn; the <b class=\"vw\" data-w=\"darkness\">darkness<\/b> outside had never felt dangerous before.<\/p><p>Emmett organised a wrestling <b class=\"vw\" data-w=\"tournament\">tournament<\/b> that nearly destroyed the garden, and the heavy snow later caused <b class=\"vw\" data-w=\"structural\">structural<\/b> damage to the school gym roof. Bella&#x27;s <b class=\"vw\" data-w=\"registration\">registration<\/b> for the new term felt pointless, and only a <b class=\"vw\" data-w=\"fragment\">fragment<\/b> of her old life still felt familiar. Jacob was a better <b class=\"vw\" data-w=\"listener\">listener<\/b> than she admitted. She joked that even <b class=\"vw\" data-w=\"immigration\">immigration<\/b> paperwork would be easier than explaining Edward to her mother. Edward&#x27;s voice turned <b class=\"vw\" data-w=\"tender\">tender<\/b> whenever she was afraid. Carlisle once explained the <b class=\"vw\" data-w=\"density\">density<\/b> of vampire bone; Bella never found the transformation <b class=\"vw\" data-w=\"ugly\">ugly<\/b>, only frightening, and her biology <b class=\"vw\" data-w=\"module\">module<\/b> suddenly felt laughably simple.<\/p><p>Jacob waited <b class=\"vw\" data-w=\"faithfully\">faithfully<\/b> by the phone. Edward pressed his cold hand against her <b class=\"vw\" data-w=\"cheek\">cheek<\/b>, and her <b class=\"vw\" data-w=\"attachment\">attachment<\/b> to him defied every warning. She kept a ticket stub in a small <b class=\"vw\" data-w=\"holder\">holder<\/b> on her desk, beside a single <b class=\"vw\" data-w=\"rose\">rose<\/b> wilting in a vase. Emmett&#x27;s <b class=\"vw\" data-w=\"grin\">grin<\/b> widened every time he teased her. &quot;Danger&quot; had become the only <b class=\"vw\" data-w=\"noun\">noun<\/b> that mattered, she joked — yet she still felt <b class=\"vw\" data-w=\"fortunate\">fortunate<\/b>.<\/p>"}, {"tier": "T4", "id": "T4-11", "html": "<p>Bella practised a casual <b class=\"vw\" data-w=\"hello\">hello<\/b> in the mirror before meeting Edward&#x27;s family. She kept telling Charlie she was <b class=\"vw\" data-w=\"alright\">alright<\/b>, even on nights when it wasn&#x27;t true, and felt <b class=\"vw\" data-w=\"ashamed\">ashamed<\/b> of how easily she lied. Jacob accused her of being <b class=\"vw\" data-w=\"lazy\">lazy<\/b> about calling him back, and she almost started a <b class=\"vw\" data-w=\"blog\">blog<\/b> just to have somewhere to put the thoughts she couldn&#x27;t say aloud. Edward&#x27;s <b class=\"vw\" data-w=\"thirst\">thirst<\/b> never disappeared, and Bella did not understand that kind of <b class=\"vw\" data-w=\"hunger\">hunger<\/b> until she saw it up close. Charlie joked that no policy could <b class=\"vw\" data-w=\"insure\">insure<\/b> against the trouble she attracted. The town of Forks had been <b class=\"vw\" data-w=\"found\">founded<\/b> by settlers who worked in timber, and it had never seen a family like the Cullens.<\/p>"}, {"tier": "AWL", "id": "AWL-F01", "html": "<p>Science week at Forks High covered every <b class=\"vw\" data-w=\"domain\">domain<\/b> of knowledge. In chemistry, Bella learned that an <b class=\"vw\" data-w=\"ion\">ion<\/b> is an atom with an electric charge, that every <b class=\"vw\" data-w=\"electron\">electron<\/b> carries a negative charge, and that a strong <b class=\"vw\" data-w=\"acid\">acid<\/b> can burn through metal. In physics, the teacher drew a <b class=\"vw\" data-w=\"vector\">vector<\/b> on the board to show <b class=\"vw\" data-w=\"velocity\">velocity<\/b>, and in maths the class had to find a <b class=\"vw\" data-w=\"coefficient\">coefficient<\/b> and prove a simple <b class=\"vw\" data-w=\"theorem\">theorem<\/b>. Edward finished each problem within the first short <b class=\"vw\" data-w=\"interval\">interval<\/b>, well below <b class=\"vw\" data-w=\"par\">par<\/b> for him.<\/p><p>In biology, Mr Banner explained how a <b class=\"vw\" data-w=\"receptor\">receptor<\/b> in the nose responds to a <b class=\"vw\" data-w=\"stimulus\">stimulus<\/b> and how one chemical can <b class=\"vw\" data-w=\"induce\">induce<\/b> a reaction at a <b class=\"vw\" data-w=\"molecular\">molecular<\/b> level. Bella drew a <b class=\"vw\" data-w=\"graph\">graph<\/b> of her results: it showed a clear <b class=\"vw\" data-w=\"correlation\">correlation<\/b> between temperature and speed, although the line was not <b class=\"vw\" data-w=\"linear\">linear<\/b>. &quot;This <b class=\"vw\" data-w=\"aspect\">aspect<\/b> of the experiment matters,&quot; Mr Banner said. &quot;Choose each <b class=\"vw\" data-w=\"parameter\">parameter<\/b> carefully.&quot;<\/p><p>That evening, Carlisle described the <b class=\"vw\" data-w=\"transformation\">transformation<\/b> from human to vampire with quiet <b class=\"vw\" data-w=\"authority\">authority<\/b>. Venom moved through the body like a <b class=\"vw\" data-w=\"fluid\">fluid<\/b>, he said, rewriting it cell by cell, almost like an <b class=\"vw\" data-w=\"algorithm\">algorithm<\/b> working through a <b class=\"vw\" data-w=\"matrix\">matrix<\/b> of instructions. Its <b class=\"vw\" data-w=\"cognitive\">cognitive<\/b> and <b class=\"vw\" data-w=\"developmental\">developmental<\/b> effects were hard to predict, but Bella&#x27;s <b class=\"vw\" data-w=\"spatial\">spatial<\/b> awareness would sharpen at once.<\/p><p>Edward had a whole <b class=\"vw\" data-w=\"repertoire\">repertoire<\/b> of old-fashioned expressions. His <b class=\"vw\" data-w=\"linguistic\">linguistic<\/b> habits, and the <b class=\"vw\" data-w=\"semantic\">semantic<\/b> difference he drew between &quot;danger&quot; and &quot;doom&quot;, seemed to <b class=\"vw\" data-w=\"denote\">denote<\/b> a century of reading. Bella asked Jacob for a <b class=\"vw\" data-w=\"translation\">translation<\/b> of an old Quileute word, and their late-night <b class=\"vw\" data-w=\"discourse\">discourse<\/b> about death never ended comfortably. Bella hated that her life was <b class=\"vw\" data-w=\"finite\">finite<\/b> while his was not.<\/p><p>Bella tried to <b class=\"vw\" data-w=\"obtain\">obtain<\/b> Edward&#x27;s blessing for a visit to La Push, but the <b class=\"vw\" data-w=\"distribution\">distribution<\/b> of territory was strict, and both sides felt <b class=\"vw\" data-w=\"bound\">bound<\/b> by the treaty. The <b class=\"vw\" data-w=\"impact\">impact<\/b> of Edward&#x27;s secret was enormous, and the <b class=\"vw\" data-w=\"dynamic\">dynamic<\/b> between Bella and Jacob shifted the day he came back. One day, Bella thought, someone might <b class=\"vw\" data-w=\"publish\">publish<\/b> a story just like theirs.<\/p>"}, {"tier": "AWL", "id": "AWL-F02", "html": "<p>Mr Banner&#x27;s class was studying the cell. He showed how water passes through a cell <b class=\"vw\" data-w=\"membrane\">membrane<\/b>, how a <b class=\"vw\" data-w=\"neuron\">neuron<\/b> carries signals and how the <b class=\"vw\" data-w=\"nucleus\">nucleus<\/b> controls everything else. Every <b class=\"vw\" data-w=\"molecule\">molecule<\/b> and <b class=\"vw\" data-w=\"particle\">particle<\/b> mattered, he said. Bella watched a computer <b class=\"vw\" data-w=\"simulation\">simulation<\/b> and tried to take notes, but with Edward away she moved through the day like a <b class=\"vw\" data-w=\"robot\">robot<\/b>.<\/p><p>Carlisle explained what venom would do in <b class=\"vw\" data-w=\"explicit\">explicit<\/b> terms. No <b class=\"vw\" data-w=\"antibody\">antibody<\/b> could fight it; the change was closer to a <b class=\"vw\" data-w=\"mutation\">mutation<\/b> than an illness. After the <b class=\"vw\" data-w=\"onset\">onset<\/b> of the burning, the <b class=\"vw\" data-w=\"duration\">duration<\/b> of the pain would be about three days, and its <b class=\"vw\" data-w=\"intensity\">intensity<\/b> would only grow. Human <b class=\"vw\" data-w=\"mortality\">mortality<\/b> was the one thing Edward could never accept. Carlisle trusted <b class=\"vw\" data-w=\"empirical\">empirical<\/b> evidence more than legend, and every <b class=\"vw\" data-w=\"diagnosis\">diagnosis<\/b> he made was careful. When Bella recognised a strange scent in the woods, her <b class=\"vw\" data-w=\"identification\">identification<\/b> sent Edward straight to him.<\/p><p>Jasper&#x27;s <b class=\"vw\" data-w=\"sensitivity\">sensitivity<\/b> let him notice the smallest <b class=\"vw\" data-w=\"behavioral\">behavioral<\/b> change. He saw how closely Bella&#x27;s fear seemed to <b class=\"vw\" data-w=\"correlate\">correlate<\/b> with Edward&#x27;s tension, and the <b class=\"vw\" data-w=\"statistical\">statistical<\/b> odds of the coming fight worried him. The <b class=\"vw\" data-w=\"variance\">variance<\/b> in Edward&#x27;s moods was like the weather. After the wedding, the couple found a fragile <b class=\"vw\" data-w=\"equilibrium\">equilibrium<\/b>, although Jacob&#x27;s anger sometimes felt like a <b class=\"vw\" data-w=\"regression\">regression<\/b> to the boy he used to be. The Cullens&#x27; <b class=\"vw\" data-w=\"consumption\">consumption<\/b> of animal blood defined their way of life, and Edward&#x27;s protective instinct was the <b class=\"vw\" data-w=\"dominant\">dominant<\/b> force behind every decision.<\/p><p>His speech showed his age: his <b class=\"vw\" data-w=\"lexical\">lexical<\/b> choices grew formal when he was nervous, his faint accent carried a <b class=\"vw\" data-w=\"phonological\">phonological<\/b> trace of another century, and he drew out each <b class=\"vw\" data-w=\"vowel\">vowel<\/b> of her name. Angela, who was <b class=\"vw\" data-w=\"bilingual\">bilingual<\/b>, noticed an odd <b class=\"vw\" data-w=\"similarity\">similarity<\/b> between Edward&#x27;s stillness and the statues in old paintings. Alice insisted the wedding date was the <b class=\"vw\" data-w=\"optimal\">optimal<\/b> choice and ran a strict <b class=\"vw\" data-w=\"regime\">regime<\/b> of shopping trips. An old <b class=\"vw\" data-w=\"colonial\">colonial<\/b> house stood empty at the edge of town, a stone <b class=\"vw\" data-w=\"marker\">marker<\/b> showed where the treaty line began, and the Cullens acted as a <b class=\"vw\" data-w=\"node\">node<\/b> linking old vampire allies. Bella&#x27;s feelings ran across the whole <b class=\"vw\" data-w=\"spectrum\">spectrum<\/b>, from terror to joy; she felt only <b class=\"vw\" data-w=\"partial\">partial<\/b> relief when Edward promised to stay, their love seemed to exist outside <b class=\"vw\" data-w=\"temporal\">temporal<\/b> limits, and her <b class=\"vw\" data-w=\"integration\">integration<\/b> into the family took time.<\/p>"}, {"tier": "AWL", "id": "AWL-F03", "html": "<p>In biology, Mr Banner taught the class about genes. Each <b class=\"vw\" data-w=\"chromosome\">chromosome<\/b> carries thousands of instructions, he explained, and a single change can alter an inherited <b class=\"vw\" data-w=\"trait\">trait<\/b>. Carlisle later guessed that something in Renesmee&#x27;s chromosomes explained her rapid growth; he even wrote a short <b class=\"vw\" data-w=\"thesis\">thesis<\/b> on it. To him, every new <b class=\"vw\" data-w=\"occurrence\">occurrence<\/b> needed careful <b class=\"vw\" data-w=\"classification\">classification<\/b>.<\/p><p>The <b class=\"vw\" data-w=\"transmission\">transmission<\/b> of venom through one bite could change everything, and even a small <b class=\"vw\" data-w=\"dose\">dose<\/b> was enough. Carlisle warned that a wound could <b class=\"vw\" data-w=\"infect\">infect<\/b> quickly, and he checked Bella&#x27;s <b class=\"vw\" data-w=\"pulse\">pulse<\/b> every hour. <b class=\"vw\" data-w=\"essentially\">Essentially<\/b>, he said, the change took the body from human, through an <b class=\"vw\" data-w=\"intermediate\">intermediate<\/b> state, to something new. His <b class=\"vw\" data-w=\"calculation\">calculation<\/b> of when Victoria&#x27;s army would arrive left him uneasy, and Alice&#x27;s <b class=\"vw\" data-w=\"prediction\">prediction<\/b> of the attack came true within days.<\/p><p>In maths, Edward helped Bella with <b class=\"vw\" data-w=\"numerical\">numerical<\/b> problems: an <b class=\"vw\" data-w=\"approximation\">approximation<\/b> here, a rotation around an <b class=\"vw\" data-w=\"axis\">axis<\/b> there. In English, he pronounced every <b class=\"vw\" data-w=\"syllable\">syllable<\/b> of the old Quileute words with care, and his old-fashioned <b class=\"vw\" data-w=\"syntactic\">syntactic<\/b> patterns made her smile. Their <b class=\"vw\" data-w=\"correspondence\">correspondence<\/b> of notes in class came long before they talked properly. Bella learned not to <b class=\"vw\" data-w=\"generalize\">generalize<\/b> about vampires; the Cullens broke every <b class=\"vw\" data-w=\"norm\">norm<\/b>. Their <b class=\"vw\" data-w=\"orientation\">orientation<\/b> to the world was not that of the Volturi, who saw themselves as an <b class=\"vw\" data-w=\"elite\">elite<\/b>.<\/p><p>The narrow <b class=\"vw\" data-w=\"pathway\">pathway<\/b> through the forest was the only route to the Cullen house, and the old meadow became the <b class=\"vw\" data-w=\"locus\">locus<\/b> of their quiet moments. A single <b class=\"vw\" data-w=\"beam\">beam<\/b> of sunlight sent Edward back into the shade. Alice had to <b class=\"vw\" data-w=\"coordinate\">coordinate<\/b> everyone&#x27;s schedules, and a strange stillness always seemed to <b class=\"vw\" data-w=\"precede\">precede<\/b> her visions. Bella belonged to a small <b class=\"vw\" data-w=\"subset\">subset<\/b> of humans who knew the secret.<\/p><p>Edward&#x27;s <b class=\"vw\" data-w=\"proposition\">proposition<\/b> that they marry came before she felt ready. The <b class=\"vw\" data-w=\"inequality\">inequality<\/b> between her fragile body and his strength was obvious every day; Carlisle noted the <b class=\"vw\" data-w=\"differential\">differential<\/b> between how fast newborns and older vampires healed. Alice and Edward looked nothing alike, but their protective instincts were <b class=\"vw\" data-w=\"identical\">identical<\/b>. The <b class=\"vw\" data-w=\"prevalence\">prevalence<\/b> of rain in Forks was the first thing Bella had noticed. Edward was <b class=\"vw\" data-w=\"magnetic\">magnetic<\/b> to her; Esme&#x27;s <b class=\"vw\" data-w=\"maternal\">maternal<\/b> warmth made her feel at home. Only one thing frightened Edward more than losing her, <b class=\"vw\" data-w=\"namely\">namely<\/b> becoming the reason she was hurt. He called loving her a kind of <b class=\"vw\" data-w=\"sin\">sin<\/b>, though he tried to stay <b class=\"vw\" data-w=\"rational\">rational<\/b>. The <b class=\"vw\" data-w=\"configuration\">configuration<\/b> of scars on Jacob&#x27;s arm told a story he would not explain.<\/p>"}, {"tier": "AWL", "id": "AWL-F04", "html": "<p>Bella sometimes felt older than any ordinary <b class=\"vw\" data-w=\"adolescent\">adolescent<\/b>. Charlie joked that she had a &quot;constant distraction <b class=\"vw\" data-w=\"syndrome\">syndrome<\/b>&quot;, but she was simply in love. Edward&#x27;s <b class=\"vw\" data-w=\"vocabulary\">vocabulary<\/b> carried traces of a century she could barely imagine, and his <b class=\"vw\" data-w=\"grammatical\">grammatical<\/b> precision made his speech stand out. Even a single <b class=\"vw\" data-w=\"utterance\">utterance<\/b> from him could calm her. Alice&#x27;s visions seemed to <b class=\"vw\" data-w=\"encode\">encode<\/b> the future in flashes, and her <b class=\"vw\" data-w=\"accuracy\">accuracy<\/b> was rarely wrong.<\/p><p>Mr Banner&#x27;s lesson on sound showed how <b class=\"vw\" data-w=\"amplitude\">amplitude<\/b> affects volume, and his lesson on the brain showed the <b class=\"vw\" data-w=\"cortex\">cortex<\/b> and its <b class=\"vw\" data-w=\"neural\">neural<\/b> pathways. Carlisle wondered whether an <b class=\"vw\" data-w=\"enzyme\">enzyme<\/b> in venom triggered the change so quickly. A vampire, he said, was an <b class=\"vw\" data-w=\"organism\">organism<\/b> perfectly built for survival, and adaptation began at the <b class=\"vw\" data-w=\"threshold\">threshold<\/b> of the transformation. Bella&#x27;s <b class=\"vw\" data-w=\"adaptation\">adaptation<\/b> to her new senses happened faster than anyone expected.<\/p><p>The <b class=\"vw\" data-w=\"incidence\">incidence<\/b> of animal attacks rose after Victoria returned, and the <b class=\"vw\" data-w=\"emergence\">emergence<\/b> of newborn vampires in Seattle worried Carlisle. Alice&#x27;s early <b class=\"vw\" data-w=\"detection\">detection<\/b> of the danger gave the family time. Jasper approached training in a <b class=\"vw\" data-w=\"systematic\">systematic<\/b> way, step by step, while Carlisle sketched a <b class=\"vw\" data-w=\"projection\">projection<\/b> of the battle. The clearing was barely fifty metres in <b class=\"vw\" data-w=\"diameter\">diameter<\/b>. A <b class=\"vw\" data-w=\"cone\">cone<\/b> of pale light from Bella&#x27;s torch reached the edge of the trees.<\/p><p>Edward <b class=\"vw\" data-w=\"explicitly\">explicitly<\/b> forbade her to cross into La Push alone. It was <b class=\"vw\" data-w=\"evident\">evident<\/b> that he cared deeply, and his <b class=\"vw\" data-w=\"chronic\">chronic<\/b> worry never eased. Trust became an <b class=\"vw\" data-w=\"integral\">integral<\/b> part of their relationship, and Alice&#x27;s planning helped <b class=\"vw\" data-w=\"facilitate\">facilitate<\/b> the wedding. Bella noticed an <b class=\"vw\" data-w=\"overlap\">overlap<\/b> between her nightmares and the real danger, and struggled with the <b class=\"vw\" data-w=\"conceptual\">conceptual<\/b> leap of imagining eternity. She hated her <b class=\"vw\" data-w=\"dependence\">dependence<\/b> on Edward, but no <b class=\"vw\" data-w=\"substitution\">substitution<\/b> for him eased her loneliness while he was away.<\/p><p>She watched closely to see how Jacob and Edward would <b class=\"vw\" data-w=\"interact\">interact<\/b> at the treaty line. Edward carried her almost <b class=\"vw\" data-w=\"horizontal\">horizontal<\/b> as he ran, calculating the <b class=\"vw\" data-w=\"trajectory\">trajectory<\/b> of every branch. In <b class=\"vw\" data-w=\"comparative\">comparative<\/b> terms, Jacob&#x27;s warmth felt ordinary beside Edward&#x27;s cold. Something in Edward&#x27;s voice seemed to <b class=\"vw\" data-w=\"activate\">activate<\/b> her nerves. Vampires were <b class=\"vw\" data-w=\"commonly\">commonly<\/b> imagined as monsters, but Edward showed <b class=\"vw\" data-w=\"minimal\">minimal<\/b> interest in anything except protecting her. Her <b class=\"vw\" data-w=\"induction\">induction<\/b> into the vampire world had begun with one conversation in biology, and her feelings stayed hidden like an unfinished <b class=\"vw\" data-w=\"manuscript\">manuscript<\/b>; Carlisle described vampirism as a strange <b class=\"vw\" data-w=\"synthesis\">synthesis<\/b> of human memory and inhuman strength.<\/p>"}, {"tier": "AWL", "id": "AWL-F05", "html": "<p>In biology, Mr Banner explained human reproduction, from the moment a <b class=\"vw\" data-w=\"sperm\">sperm<\/b> cell meets an egg to the <b class=\"vw\" data-w=\"conception\">conception<\/b> of a child. Carlisle, a skilled <b class=\"vw\" data-w=\"physician\">physician<\/b>, later admitted that Bella&#x27;s pregnancy broke every rule he knew. He tried to <b class=\"vw\" data-w=\"classify\">classify<\/b> Renesmee, but she seemed to be a new <b class=\"vw\" data-w=\"variant\">variant<\/b> of life, and no <b class=\"vw\" data-w=\"evolutionary\">evolutionary<\/b> theory could explain her. He kept <b class=\"vw\" data-w=\"quantitative\">quantitative<\/b> records of her growth and drew a <b class=\"vw\" data-w=\"diagram\">diagram<\/b> of how fast she was changing.<\/p><p>Carlisle&#x27;s <b class=\"vw\" data-w=\"estimation\">estimation<\/b> was that the newborn army would reach Forks within days. Any <b class=\"vw\" data-w=\"deviation\">deviation<\/b> from Jasper&#x27;s training could get a newborn killed, and the <b class=\"vw\" data-w=\"instability\">instability<\/b> of their tempers made every session dangerous. Jasper judged them <b class=\"vw\" data-w=\"sufficiently\">sufficiently<\/b> trained only a few days before the battle. Everyone sensed a dangerous <b class=\"vw\" data-w=\"convergence\">convergence<\/b> of enemies around Forks that summer, and Edward&#x27;s rapid <b class=\"vw\" data-w=\"computation\">computation<\/b> of the odds did nothing to ease Bella&#x27;s fear.<\/p><p>Sam tried to <b class=\"vw\" data-w=\"mediate\">mediate<\/b> between the wolves and the Cullens. The pack&#x27;s <b class=\"vw\" data-w=\"collective\">collective<\/b> memory let every wolf share what one of them saw, and the treaty line sometimes seemed <b class=\"vw\" data-w=\"arbitrary\">arbitrary<\/b> to Bella, although both sides took it seriously. Billy preferred the <b class=\"vw\" data-w=\"oral\">oral<\/b> tradition of the Quileute legends to any written record. The line worked almost like an <b class=\"vw\" data-w=\"interface\">interface<\/b> between two worlds.<\/p><p>Alice gave the caterers an exact <b class=\"vw\" data-w=\"specification\">specification<\/b> for every detail and welcomed Bella&#x27;s <b class=\"vw\" data-w=\"feedback\">feedback<\/b>, though she rarely changed anything. The wedding rings sat in a small, <b class=\"vw\" data-w=\"compact\">compact<\/b> box. Edward joked about taking Bella somewhere <b class=\"vw\" data-w=\"tropical\">tropical<\/b>, far from the grey skies. Bella never thought of Jacob as an <b class=\"vw\" data-w=\"ex\">ex<\/b>. The Cullens&#x27; <b class=\"vw\" data-w=\"ideology\">ideology<\/b> of restraint set them apart from every other clan.<\/p><p>By <b class=\"vw\" data-w=\"mid\">mid<\/b>-afternoon, the fog had rolled back in. A sudden chill was often the only <b class=\"vw\" data-w=\"indicator\">indicator<\/b> that a vampire was near, and Alice&#x27;s visions arrived in a <b class=\"vw\" data-w=\"nonlinear\">nonlinear<\/b> rush. Bella healed in a <b class=\"vw\" data-w=\"fraction\">fraction<\/b> of the time a human would need. Carlisle studied vampire <b class=\"vw\" data-w=\"morphology\">morphology<\/b> with curiosity, and explained that exposure to <b class=\"vw\" data-w=\"radiation\">radiation<\/b> at the hospital had to be controlled. Edward climbed the <b class=\"vw\" data-w=\"vertical\">vertical<\/b> cliff face without effort. His <b class=\"vw\" data-w=\"syntax\">syntax<\/b> slipped into old patterns when he was upset, and he hid his fear, <b class=\"vw\" data-w=\"thereby\">thereby<\/b> protecting her. Bella joked that clumsiness was one <b class=\"vw\" data-w=\"defect\">defect<\/b> vampirism would cure. Her fear of the Volturi was completely <b class=\"vw\" data-w=\"valid\">valid<\/b>. The memory of their first meeting stayed <b class=\"vw\" data-w=\"embed\">embedded<\/b> in her mind, and the <b class=\"vw\" data-w=\"separation\">separation<\/b> from Edward had left her hollow; her senses became suddenly <b class=\"vw\" data-w=\"acute\">acute<\/b> after the change. Bella felt she had stepped into a new <b class=\"vw\" data-w=\"sphere\">sphere<\/b> of existence.<\/p>"}, {"tier": "AWL", "id": "AWL-F06", "html": "<p>After the change, Bella&#x27;s <b class=\"vw\" data-w=\"consciousness\">consciousness<\/b> sharpened instantly. She could see every vein in a single <b class=\"vw\" data-w=\"leaf\">leaf<\/b> and every <b class=\"vw\" data-w=\"fiber\">fiber<\/b> in her sleeve. Carlisle explained that a vampire&#x27;s body kept no <b class=\"vw\" data-w=\"organ\">organ<\/b> working the way a human&#x27;s did, and he ran a quiet <b class=\"vw\" data-w=\"diagnostic\">diagnostic<\/b> check of his own. He had once treated a <b class=\"vw\" data-w=\"tumor\">tumor<\/b> that no ordinary doctor could have found so early.<\/p><p>Jasper studied a whole <b class=\"vw\" data-w=\"corpus\">corpus<\/b> of vampire history. His <b class=\"vw\" data-w=\"methodology\">methodology<\/b> for training newborns relied on patience, and the <b class=\"vw\" data-w=\"variability\">variability<\/b> of their strength made every session unpredictable. The <b class=\"vw\" data-w=\"magnitude\">magnitude<\/b> of the danger was clear: a <b class=\"vw\" data-w=\"diverse\">diverse<\/b> group of vampires had gathered as witnesses, and the <b class=\"vw\" data-w=\"likelihood\">likelihood<\/b> of the Volturi simply walking away seemed small. No danger Bella had faced was <b class=\"vw\" data-w=\"comparable\">comparable<\/b>.<\/p><p>Renesmee was an <b class=\"vw\" data-w=\"entity\">entity<\/b> unlike anything Carlisle had seen, and the Cullens shattered every <b class=\"vw\" data-w=\"paradigm\">paradigm<\/b> Bella had held about vampires. Jasper&#x27;s understanding of <b class=\"vw\" data-w=\"psychology\">psychology<\/b> helped him calm a room. Edward&#x27;s patience seemed <b class=\"vw\" data-w=\"infinite\">infinite<\/b>, though she knew it was not. Edward taught Bella the musical <b class=\"vw\" data-w=\"notation\">notation<\/b> for her lullaby. Alice tried to <b class=\"vw\" data-w=\"probe\">probe<\/b> deeper into a vision, but the future slipped away. The <b class=\"vw\" data-w=\"migration\">migration<\/b> of newborns toward Forks worried Carlisle, and the steep <b class=\"vw\" data-w=\"gradient\">gradient<\/b> of the cliff did not slow Edward at all.<\/p><p>The Volturi&#x27;s <b class=\"vw\" data-w=\"hierarchy\">hierarchy<\/b> placed Aro, Caius and Marcus above everyone else. A strange <b class=\"vw\" data-w=\"disturbance\">disturbance<\/b> in the forest sent the wolves racing to the border, and Jacob and Edward arrived <b class=\"vw\" data-w=\"simultaneously\">simultaneously<\/b>. Alice&#x27;s <b class=\"vw\" data-w=\"periodic\">periodic<\/b> visions kept the family on edge. Bella questioned the <b class=\"vw\" data-w=\"utility\">utility<\/b> of running from vampires, and Charlie questioned the <b class=\"vw\" data-w=\"validity\">validity<\/b> of her excuses. Her <b class=\"vw\" data-w=\"inference\">inference<\/b> that Edward was hiding something proved right. Edward&#x27;s rule about crossing the treaty line was <b class=\"vw\" data-w=\"non\">non<\/b>-negotiable.<\/p><p>An <b class=\"vw\" data-w=\"array\">array<\/b> of candles lit the aisle at the wedding, and Bella&#x27;s <b class=\"vw\" data-w=\"inclusion\">inclusion<\/b> in the Cullen family felt natural. Jasper&#x27;s calm seemed to <b class=\"vw\" data-w=\"complement\">complement<\/b> Emmett&#x27;s wild energy. Edward rarely needed <b class=\"vw\" data-w=\"verbal\">verbal<\/b> warnings, and his <b class=\"vw\" data-w=\"mathematical\">mathematical<\/b> precision let him predict Bella&#x27;s next move. The <b class=\"vw\" data-w=\"aggregate\">aggregate<\/b> of small signs finally convinced her something was wrong. Bella wanted <b class=\"vw\" data-w=\"equality\">equality<\/b> in their relationship. Only the <b class=\"vw\" data-w=\"outer\">outer<\/b> edge of the meadow caught any sunlight, and even the faint <b class=\"vw\" data-w=\"emission\">emission<\/b> of heat from her body drew a vampire&#x27;s attention. The slow <b class=\"vw\" data-w=\"rotation\">rotation<\/b> of the ceiling fan was the only sound in her room, and Edward worried about the <b class=\"vw\" data-w=\"continuity\">continuity<\/b> of her human life.<\/p>"}, {"tier": "AWL", "id": "AWL-F07", "html": "<p>Bella&#x27;s <b class=\"vw\" data-w=\"biology\">biology<\/b> teacher never guessed the secrets sitting in his <b class=\"vw\" data-w=\"classroom\">classroom<\/b>. In one lesson, he described the <b class=\"vw\" data-w=\"morphological\">morphological<\/b> changes of a growing <b class=\"vw\" data-w=\"insect\">insect<\/b>; in another, he explained how the body uses <b class=\"vw\" data-w=\"oxygen\">oxygen<\/b>. Edward tutored Bella through <b class=\"vw\" data-w=\"calculus\">calculus<\/b> with a patience she found unfair. The old Quileute legends felt like <b class=\"vw\" data-w=\"archaeology\">archaeology<\/b> to her: fragments of a buried truth. Carlisle once compared a vampire&#x27;s craving to the pull between every <b class=\"vw\" data-w=\"atom\">atom<\/b> in the universe.<\/p><p>Becoming a vampire would require more than physical <b class=\"vw\" data-w=\"modification\">modification<\/b>. The venom spread faster than any <b class=\"vw\" data-w=\"injection\">injection<\/b>, and Carlisle kept a <b class=\"vw\" data-w=\"longitudinal\">longitudinal<\/b> record of every symptom. His <b class=\"vw\" data-w=\"formulation\">formulation<\/b> of a treatment came only after years of study. He wrestled with the <b class=\"vw\" data-w=\"ethical\">ethical<\/b> weight of turning humans, and he tried to give an <b class=\"vw\" data-w=\"approximate\">approximate<\/b> timeline, though Alice&#x27;s visions kept changing. Renesmee&#x27;s <b class=\"vw\" data-w=\"fetal\">fetal<\/b> heartbeat changed everything about Bella&#x27;s plans.<\/p><p>Aro seemed eager to <b class=\"vw\" data-w=\"initiate\">initiate<\/b> a confrontation once he sensed Bella&#x27;s hidden gift. Alice ran through every <b class=\"vw\" data-w=\"scenario\">scenario<\/b> before warning the family, and Jasper questioned the <b class=\"vw\" data-w=\"effectiveness\">effectiveness<\/b> of his own calm. Bella fought for her <b class=\"vw\" data-w=\"autonomy\">autonomy<\/b>; nothing could <b class=\"vw\" data-w=\"inhibit\">inhibit<\/b> Edward&#x27;s need to protect her. His promise felt <b class=\"vw\" data-w=\"conditional\">conditional<\/b> on her accepting a life she barely understood. <b class=\"vw\" data-w=\"contrary\">Contrary<\/b> to what Charlie believed, she had never felt safer.<\/p><p>A <b class=\"vw\" data-w=\"lateral\">lateral<\/b> movement in the trees told Bella she was not alone. The treaty forced both sides into an uneasy, <b class=\"vw\" data-w=\"neutral\">neutral<\/b> truce, and any <b class=\"vw\" data-w=\"marginal\">marginal<\/b> chance of survival felt like a miracle. Edward&#x27;s <b class=\"vw\" data-w=\"superior\">superior<\/b> speed meant he always reached her first. A glass <b class=\"vw\" data-w=\"partition\">partition<\/b> separated the waiting room from the rest of the hospital. Jenks treated Jasper like his most important <b class=\"vw\" data-w=\"client\">client<\/b>. Charlie&#x27;s <b class=\"vw\" data-w=\"characterization\">characterization<\/b> of Edward as &quot;too intense&quot; was an understatement.<\/p><p>Edward, a gifted <b class=\"vw\" data-w=\"composer\">composer<\/b>, wrote her lullaby before admitting he loved her. Her scent was <b class=\"vw\" data-w=\"singular\">singular<\/b> enough to undo every vampire in the room. Every danger she had faced seemed to <b class=\"vw\" data-w=\"converge\">converge<\/b> in the final battle. Her <b class=\"vw\" data-w=\"comprehension\">comprehension<\/b> of what she was becoming grew clearer each hour, and a vampire&#x27;s life <b class=\"vw\" data-w=\"span\">span<\/b> stretched beyond anything she could imagine. There was an <b class=\"vw\" data-w=\"implicit\">implicit<\/b> understanding between her and Jacob, and the pack slipped into their own <b class=\"vw\" data-w=\"dialect\">dialect<\/b> when they didn&#x27;t want her to understand; Jacob&#x27;s accent softened every <b class=\"vw\" data-w=\"consonant\">consonant<\/b>. Each memory Edward shared felt like a <b class=\"vw\" data-w=\"discrete\">discrete<\/b> piece of his life. Her plan seemed <b class=\"vw\" data-w=\"logical\">logical<\/b> only because she ignored the danger, and her <b class=\"vw\" data-w=\"usage\">usage<\/b> of the word &quot;fine&quot; fooled no one.<\/p>"}, {"tier": "AWL", "id": "AWL-F08", "html": "<p>The Quileute were the <b class=\"vw\" data-w=\"indigenous\">indigenous<\/b> people who had guarded La Push for generations, and the wolves saw the <b class=\"vw\" data-w=\"conservation\">conservation<\/b> of their land as more important than any treaty. The Volturi, by contrast, ruled from Volterra like an ancient <b class=\"vw\" data-w=\"colony\">colony<\/b> of power. Their <b class=\"vw\" data-w=\"assembly\">assembly<\/b> in the clearing was larger than Bella had imagined.<\/p><p>Jasper gave her a quick <b class=\"vw\" data-w=\"overview\">overview<\/b> of the newborn army before the battle. Bella tried to <b class=\"vw\" data-w=\"assert\">assert<\/b> her independence and insisted on deciding <b class=\"vw\" data-w=\"independently\">independently<\/b>. Her <b class=\"vw\" data-w=\"competence\">competence<\/b> in dealing with vampires grew faster than Charlie suspected, and Irina&#x27;s report of an &quot;immortal child&quot; caused <b class=\"vw\" data-w=\"widespread\">widespread<\/b> alarm in the vampire world. The treaty line was <b class=\"vw\" data-w=\"strictly\">strictly<\/b> enforced. For one moment, the Cullens and the wolves stood in complete <b class=\"vw\" data-w=\"unity\">unity<\/b> against the Volturi.<\/p><p>Carlisle explained that proteins are made of <b class=\"vw\" data-w=\"amino\">amino<\/b> acids, and that no amount of <b class=\"vw\" data-w=\"calcium\">calcium<\/b> could prepare Bella&#x27;s body for what came next. The <b class=\"vw\" data-w=\"diffusion\">diffusion<\/b> of venom through her body felt like fire; the venom would <b class=\"vw\" data-w=\"render\">render<\/b> her immortal. The <b class=\"vw\" data-w=\"physiological\">physiological<\/b> changes of her pregnancy alarmed even Carlisle, and its <b class=\"vw\" data-w=\"preliminary\">preliminary<\/b> signs had frightened him from the start. Aro examined Bella like a rare <b class=\"vw\" data-w=\"specimen\">specimen<\/b>. Her <b class=\"vw\" data-w=\"pre\">pre<\/b>-transformation life felt like someone else&#x27;s story.<\/p><p>In maths, Bella&#x27;s <b class=\"vw\" data-w=\"algebra\">algebra<\/b> homework felt dull, and Edward showed her how to find a <b class=\"vw\" data-w=\"derivative\">derivative<\/b>. In the <b class=\"vw\" data-w=\"appendix\">appendix<\/b> of an old history book, she found a list of local legends. Charlie once wondered, half joking, whether she needed <b class=\"vw\" data-w=\"psychiatric\">psychiatric<\/b> help. Edward grew almost <b class=\"vw\" data-w=\"philosophical\">philosophical<\/b> about his own mortality. Patience was not a <b class=\"vw\" data-w=\"virtue\">virtue<\/b> he could manage where her safety was concerned; nothing could <b class=\"vw\" data-w=\"constrain\">constrain<\/b> her determination. Even Jasper struggled to <b class=\"vw\" data-w=\"differentiate\">differentiate<\/b> her excitement from her fear, and the <b class=\"vw\" data-w=\"differentiate\">differentiation<\/b> grew harder each day.<\/p><p>The <b class=\"vw\" data-w=\"transaction\">transaction<\/b> with Jenks for false documents was quick and expensive. Jasper offered a quiet <b class=\"vw\" data-w=\"critique\">critique<\/b> of her fighting stance. Bella learned to <b class=\"vw\" data-w=\"utilize\">utilize<\/b> her new strength carefully. Her human memories remained only <b class=\"vw\" data-w=\"partially\">partially<\/b> intact, and a <b class=\"vw\" data-w=\"residual\">residual<\/b> chill hung in the air long after the Volturi left. The wedding ring felt <b class=\"vw\" data-w=\"symbolic\">symbolic<\/b> of an old promise. Alice&#x27;s warnings were <b class=\"vw\" data-w=\"indirect\">indirect<\/b>, hidden in comments about the weather. Bella felt a strange <b class=\"vw\" data-w=\"fusion\">fusion<\/b> of human fear and vampire calm. Edward drove the same <b class=\"vw\" data-w=\"loop\">loop<\/b> past her house more often than he admitted, the Cullens held a <b class=\"vw\" data-w=\"prominent\">prominent<\/b> place in town, and Bella had always seemed <b class=\"vw\" data-w=\"immune\">immune<\/b> to the fear others felt around them. Only when the Volturi walked away did she feel any <b class=\"vw\" data-w=\"closure\">closure<\/b>.<\/p>"}, {"tier": "AWL", "id": "AWL-F09", "html": "<p>The forest around Forks grew so <b class=\"vw\" data-w=\"dense\">dense<\/b> that sunlight barely reached the ground. In biology, the class briefly studied <b class=\"vw\" data-w=\"ecology\">ecology<\/b>, and Mr Banner explained how every <b class=\"vw\" data-w=\"nutrient\">nutrient<\/b> moves through an <b class=\"vw\" data-w=\"ecological\">ecological<\/b> system. Forks had little <b class=\"vw\" data-w=\"agriculture\">agriculture<\/b>, just rain, forest and fog. Bella&#x27;s mind was elsewhere.<\/p><p>Carlisle&#x27;s <b class=\"vw\" data-w=\"occupation\">occupation<\/b> as a doctor let him watch over the town. He was a skilled <b class=\"vw\" data-w=\"practitioner\">practitioner<\/b>, and his <b class=\"vw\" data-w=\"progressive\">progressive<\/b> views on living with humans set him apart from most vampires. He had changed Edward when he was dying of a <b class=\"vw\" data-w=\"terminal\">terminal<\/b> illness. When Bella was <b class=\"vw\" data-w=\"discharge\">discharged<\/b> from hospital after two days, Carlisle checked every symptom and kept a careful <b class=\"vw\" data-w=\"transcription\">transcription<\/b> of her notes. On her health <b class=\"vw\" data-w=\"questionnaire\">questionnaire<\/b>, she mentioned none of the truth.<\/p><p>The Volturi followed a strict <b class=\"vw\" data-w=\"protocol\">protocol<\/b> whenever a law might have been broken, and they were <b class=\"vw\" data-w=\"selective\">selective<\/b> about who could live in Volterra. The old paintings in their tower <b class=\"vw\" data-w=\"depict\">depict<\/b> battles from long ago. <b class=\"vw\" data-w=\"statistically\">Statistically<\/b>, surviving them seemed impossible. Once the treaty was broken, it would be <b class=\"vw\" data-w=\"null\">null<\/b> and void.<\/p><p>Jasper could <b class=\"vw\" data-w=\"simulate\">simulate<\/b> calm so well that even Bella believed it, and Emmett&#x27;s confidence seemed to <b class=\"vw\" data-w=\"reinforce\">reinforce<\/b> her courage. Edward tried to <b class=\"vw\" data-w=\"minimize\">minimize<\/b> the danger, and <b class=\"vw\" data-w=\"readily\">readily<\/b> admitted he would do anything to keep her safe. Jasper waited for Edward&#x27;s <b class=\"vw\" data-w=\"cue\">cue<\/b> before stepping forward. Charlie&#x27;s <b class=\"vw\" data-w=\"parental\">parental<\/b> instincts kicked in when she came home pale; the room grew <b class=\"vw\" data-w=\"tense\">tense<\/b> whenever the Volturi were mentioned. Victoria planned to <b class=\"vw\" data-w=\"exploit\">exploit<\/b> the newborns&#x27; wild strength.<\/p><p>Alice checked the <b class=\"vw\" data-w=\"availability\">availability<\/b> of every flight out of Seattle. Her <b class=\"vw\" data-w=\"aesthetic\">aesthetic<\/b> sense meant no outfit went unquestioned, and the Cullens kept family meetings <b class=\"vw\" data-w=\"informal\">informal<\/b>, even though the stakes were life and death. The wedding felt like more than a <b class=\"vw\" data-w=\"ritual\">ritual<\/b>. No one had ever tested a vampire&#x27;s <b class=\"vw\" data-w=\"fertility\">fertility<\/b> until Bella&#x27;s pregnancy proved it possible. Her room was <b class=\"vw\" data-w=\"adjacent\">adjacent<\/b> to the one Edward had claimed for years. To any <b class=\"vw\" data-w=\"observer\">observer<\/b>, the Cullens looked like an ordinary family, and news of them spread <b class=\"vw\" data-w=\"locally\">locally<\/b> fast. Bella lost every human <b class=\"vw\" data-w=\"inhibition\">inhibition<\/b> around Edward. Charlie&#x27;s <b class=\"vw\" data-w=\"generalization\">generalization<\/b> about teenage moods never fitted her, and Carlisle noticed a <b class=\"vw\" data-w=\"qualitative\">qualitative<\/b> shift in her heartbeat. Bella&#x27;s <b class=\"vw\" data-w=\"adaptive\">adaptive<\/b> nature helped her accept a world most people would deny. She never believed in an <b class=\"vw\" data-w=\"equivalence\">equivalence<\/b> between her life and Edward&#x27;s, Charlie&#x27;s <b class=\"vw\" data-w=\"pragmatic\">pragmatic<\/b> nature made secrets harder to keep, and her <b class=\"vw\" data-w=\"productivity\">productivity<\/b> at home dropped once Edward returned.<\/p>"}, {"tier": "AWL", "id": "AWL-F10", "html": "<p>In maths class, Bella learned to use <b class=\"vw\" data-w=\"pi\">pi<\/b> to calculate the area of a circle. Her English <b class=\"vw\" data-w=\"assignment\">assignment<\/b> felt trivial next to her secrets. Edward&#x27;s interest in <b class=\"vw\" data-w=\"linguistics\">linguistics<\/b> helped him learn new languages, and Charlie&#x27;s constant <b class=\"vw\" data-w=\"commentary\">commentary<\/b> on Edward made dinner unbearable. The old radio in Charlie&#x27;s truck crackled with <b class=\"vw\" data-w=\"static\">static<\/b> in the mountains.<\/p><p>A newborn vampire is dangerously <b class=\"vw\" data-w=\"unstable\">unstable<\/b>, ruled by thirst. No newborn was allowed within a fifty-mile <b class=\"vw\" data-w=\"radius\">radius<\/b> of Forks. The newborns began to <b class=\"vw\" data-w=\"scatter\">scatter<\/b> the moment Jasper gave the signal, and Emmett joked that even an <b class=\"vw\" data-w=\"arrow\">arrow<\/b> through the heart could not stop him. Aro called Edward&#x27;s plan to provoke the Volturi a kind of <b class=\"vw\" data-w=\"suicide\">suicide<\/b>.<\/p><p>Carlisle explained that scientists <b class=\"vw\" data-w=\"randomize\">randomize<\/b> the groups in a study to make the results fair. No lab could <b class=\"vw\" data-w=\"replicate\">replicate<\/b> what venom did to a dying body, and it seemed to act on some <b class=\"vw\" data-w=\"substrate\">substrate<\/b> deep in human cells. No one thought vampires could <b class=\"vw\" data-w=\"reproduce\">reproduce<\/b> until Bella&#x27;s pregnancy. She joked that pregnancy <b class=\"vw\" data-w=\"hormone\">hormone<\/b> swings were the least strange thing in her life. A faint <b class=\"vw\" data-w=\"residue\">residue<\/b> of venom stayed on her skin after the bite. Every <b class=\"vw\" data-w=\"sensory\">sensory<\/b> detail felt sharper after the change. The <b class=\"vw\" data-w=\"accumulation\">accumulation<\/b> of journals in Carlisle&#x27;s study was older than any human alive, and not even the rarest <b class=\"vw\" data-w=\"mineral\">mineral<\/b> could match a vampire&#x27;s skin in sunlight.<\/p><p>The family reached a quiet <b class=\"vw\" data-w=\"consensus\">consensus<\/b> that Bella should choose her own fate. The treaty required <b class=\"vw\" data-w=\"consent\">consent<\/b> from both sides, and it was born from centuries of <b class=\"vw\" data-w=\"discrimination\">discrimination<\/b> and distrust. Carlisle&#x27;s personal <b class=\"vw\" data-w=\"ethics\">ethics<\/b> kept him from taking a human life. The Quileute legends described the wolves in almost <b class=\"vw\" data-w=\"primitive\">primitive<\/b>, sacred terms. Bella never treated Billy&#x27;s <b class=\"vw\" data-w=\"disability\">disability<\/b> as something that made him less, and Jacob felt like a <b class=\"vw\" data-w=\"peripheral\">peripheral<\/b> figure in her life. The Volturi tried to <b class=\"vw\" data-w=\"confine\">confine<\/b> Alice&#x27;s gift to their own interests.<\/p><p>Jacob tried to <b class=\"vw\" data-w=\"simplify\">simplify<\/b> things by pretending his feelings did not exist. Bella&#x27;s calm face was a <b class=\"vw\" data-w=\"contradiction\">contradiction<\/b> to her fear, and his feelings made family gatherings <b class=\"vw\" data-w=\"problematic\">problematic<\/b>. She made a quiet <b class=\"vw\" data-w=\"correction\">correction<\/b> whenever Charlie assumed Edward was simply away. Edward&#x27;s warning was <b class=\"vw\" data-w=\"straightforward\">straightforward<\/b>, and he insisted his hesitation was <b class=\"vw\" data-w=\"purely\">purely<\/b> about her safety. They were questioned <b class=\"vw\" data-w=\"separately\">separately<\/b>, but their stories matched. Alice&#x27;s calm before a vision felt <b class=\"vw\" data-w=\"artificial\">artificial<\/b>. Her smile at school grew <b class=\"vw\" data-w=\"mechanical\">mechanical<\/b>. The forest was the perfect <b class=\"vw\" data-w=\"habitat\">habitat<\/b> for creatures no textbook mentioned; the Cullens hunted deer and stayed away from the farmers&#x27; <b class=\"vw\" data-w=\"cattle\">cattle<\/b>. Autumn brought the smell of <b class=\"vw\" data-w=\"harvest\">harvest<\/b> smoke, and Emmett claimed he had once wrestled a <b class=\"vw\" data-w=\"monkey\">monkey<\/b>.<\/p>"}, {"tier": "AWL", "id": "AWL-F11", "html": "<p>No one believed Bella could <b class=\"vw\" data-w=\"conceive\">conceive<\/b> a child until the truth was impossible to deny. Renesmee was the impossible <b class=\"vw\" data-w=\"offspring\">offspring<\/b> of a vampire and a human, and she began to <b class=\"vw\" data-w=\"resemble\">resemble<\/b> her father more each week. No vampire had considered <b class=\"vw\" data-w=\"reproduction\">reproduction<\/b> possible. Her pregnancy became a <b class=\"vw\" data-w=\"complication\">complication<\/b> nobody had planned for.<\/p><p>Carlisle watched every organ. Bella&#x27;s <b class=\"vw\" data-w=\"circulation\">circulation<\/b> slowed, her <b class=\"vw\" data-w=\"liver\">liver<\/b> adjusted in strange ways, and he described her heart as a <b class=\"vw\" data-w=\"valve\">valve<\/b> slowly failing under pressure. She gasped, filling her <b class=\"vw\" data-w=\"lung\">lungs<\/b> with mountain air. The venom&#x27;s <b class=\"vw\" data-w=\"absorption\">absorption<\/b> was faster than he predicted; venom could <b class=\"vw\" data-w=\"transmit\">transmit<\/b> the change in an instant, though the process took days. Bella stayed <b class=\"vw\" data-w=\"conscious\">conscious<\/b> through the worst of it. Carlisle had to <b class=\"vw\" data-w=\"insert\">insert<\/b> a needle carefully, and his <b class=\"vw\" data-w=\"productive\">productive<\/b> research filled notebook after notebook. Fallen trees in the forest slowly began to <b class=\"vw\" data-w=\"decay\">decay<\/b> in the rain.<\/p><p>Jasper worked to <b class=\"vw\" data-w=\"maximize\">maximize<\/b> every advantage before the newborns arrived. The newborns acted so alike they could have been a <b class=\"vw\" data-w=\"clone\">clone<\/b> army. Alice&#x27;s <b class=\"vw\" data-w=\"allocation\">allocation<\/b> of time left nothing to chance. Sam&#x27;s <b class=\"vw\" data-w=\"dominance\">dominance<\/b> over the pack was never questioned. Secrecy was a <b class=\"vw\" data-w=\"necessity\">necessity<\/b> the Cullens had lived with for a century, and Edward&#x27;s <b class=\"vw\" data-w=\"reliability\">reliability<\/b> was the one constant Bella could count on. The treaty gave the Cullens only a <b class=\"vw\" data-w=\"nominal\">nominal<\/b> claim to peace. The wolves patrolled every <b class=\"vw\" data-w=\"tract\">tract<\/b> of forest. Bella reminded Mike that the <b class=\"vw\" data-w=\"plural\">plural<\/b> of &quot;wolf&quot; is &quot;wolves&quot;.<\/p><p>Her decision to jump from the cliff had been more <b class=\"vw\" data-w=\"spontaneous\">spontaneous<\/b> than she liked to admit. It took days to <b class=\"vw\" data-w=\"orient\">orient<\/b> herself to the Cullens&#x27; constant attention. Alice planned an <b class=\"vw\" data-w=\"elaborate\">elaborate<\/b> wedding. Edward&#x27;s lullaby felt like a <b class=\"vw\" data-w=\"metaphor\">metaphor<\/b> for everything he couldn&#x27;t say. Bella&#x27;s fear of the Volturi felt <b class=\"vw\" data-w=\"subjective\">subjective<\/b> until she stood before them. Secrets tended to <b class=\"vw\" data-w=\"accumulate\">accumulate<\/b> quickly. Jacob&#x27;s <b class=\"vw\" data-w=\"rejection\">rejection<\/b> of her choice never faded, though no wolf could be a <b class=\"vw\" data-w=\"replacement\">replacement<\/b> for the family she had chosen. Bella felt at peace <b class=\"vw\" data-w=\"amongst\">amongst<\/b> a family that was not, technically, alive. The Cullens&#x27; <b class=\"vw\" data-w=\"monetary\">monetary<\/b> resources made moving easy, and Jacob&#x27;s <b class=\"vw\" data-w=\"thermal\">thermal<\/b> warmth was the only thing that took the chill from her skin. Edward promised to protect her; Emmett, <b class=\"vw\" data-w=\"likewise\">likewise<\/b>, swore the same. Her <b class=\"vw\" data-w=\"tolerance\">tolerance<\/b> for secrets grew, and the <b class=\"vw\" data-w=\"thickness\">thickness<\/b> of the fog made the town feel hidden. She struggled to <b class=\"vw\" data-w=\"articulate\">articulate<\/b> what she wanted, and Jasper read the room <b class=\"vw\" data-w=\"correctly\">correctly<\/b> the second she walked in.<\/p>"}, {"tier": "AWL", "id": "AWL-F12", "html": "<p>Bella could feel every <b class=\"vw\" data-w=\"vein\">vein<\/b> burn as the venom spread. Its <b class=\"vw\" data-w=\"adverse\">adverse<\/b> effects left her in agony for three days, and the <b class=\"vw\" data-w=\"acceleration\">acceleration<\/b> of her pregnancy had already left Carlisle searching for answers. Her fragile human <b class=\"vw\" data-w=\"constitution\">constitution<\/b> seemed laughably breakable beside the family she had chosen. Being human was a <b class=\"vw\" data-w=\"disadvantage\">disadvantage<\/b> she felt every day.<\/p><p>Carlisle&#x27;s work with <b class=\"vw\" data-w=\"donor\">donor<\/b> organs was the closest he could get to ordinary medicine. Mr Banner reminded the class that <b class=\"vw\" data-w=\"nitrogen\">nitrogen<\/b> makes up most of the air we breathe. A vampire&#x27;s <b class=\"vw\" data-w=\"mobility\">mobility<\/b> far outmatched any human&#x27;s, and Jasper&#x27;s <b class=\"vw\" data-w=\"manipulation\">manipulation<\/b> of emotions kept the newborns from panicking. Alice&#x27;s <b class=\"vw\" data-w=\"strategic\">strategic<\/b> thinking gave the family an edge, and Jasper&#x27;s <b class=\"vw\" data-w=\"execution\">execution<\/b> of the plan left the newborn army no chance.<\/p><p>Bella&#x27;s emotions were in constant <b class=\"vw\" data-w=\"flux\">flux<\/b> that first year. Being with Edward seemed to <b class=\"vw\" data-w=\"elevate\">elevate<\/b> every ordinary moment. Edward tried an <b class=\"vw\" data-w=\"analogy\">analogy<\/b> about lions and lambs that she never let him forget. Charlie found her excuses barely <b class=\"vw\" data-w=\"plausible\">plausible<\/b>. Her choice sparked quiet <b class=\"vw\" data-w=\"controversy\">controversy<\/b> in her family, and Jacob&#x27;s warnings only seemed to <b class=\"vw\" data-w=\"undermine\">undermine<\/b> his own case. Their history teacher explaine
