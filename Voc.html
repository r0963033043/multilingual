<style>

:root[data-theme="dark"]{ --paper:#15161A; --ink:#ECEBE6; --ink-2:#B3B2AB; --rule:#2B2C33; --rule-2:#3F4049; --red:#F07386; --blue:#93ABE8; --blue-soft:#232B3F; --hl:#8A7A1E; --hl-ink:#FFF6C4; --panel:#1C1D23; --green:#7BCF9C; }

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

maximum", "b": "minimum", "zh": "最大值／最小值"}, {"a": "majority", "b": "minority", "zh": "多數／少數"}, {"a": "superior", "b": "inferior", "zh": "較優的／較差的"}, {"a": "internal", "b": "external", "zh": "內部的／外部的"}, {"a": "explicit", "b": "implicit", "zh": "明確的／隱含的"}, {"a": "permanent", "b": "temporary", "zh": "永久的／暫時的"}, {"a": "urban", "b": "rural", "zh": "都市的／鄉村的"}, {"a": "modern", "b": "ancient", "zh": "現代的／古代的"}, {"a": "abundant", "b": "scarce", "zh": "豐富的／稀少的"}, {"a": "voluntary", "b": "compulsory", "zh": "自願的／強制的"}, {"a": "flexible", "b": "rigid", "zh": "有彈性的／僵化的"}, {"a": "stable", "b": "unstable", "zh": "穩定的／不穩定的"}, {"a": "efficient", "b": "inefficient", "zh": "有效率的／沒效率的"}, {"a": "legal", "b": "illegal", "zh": "合法的／非法的"}, {"a": "relevant", "b": "irrelevant", "zh": "相關的／無關的"}, {"a": "direct", "b": "indirect", "zh": "直接的／間接的"}, {"a": "formal", "b": "informal", "zh": "正式的／非正式的"}, {"a": "quantitative", "b": "qualitative", "zh": "量化的／質性的"}, {"a": "objective", "b": "subjective", "zh": "客觀的／主觀的"}, {"a": "rational", "b": "irrational", "zh": "理性的／不理性的"}, {"a": "import", "b": "export", "zh": "進口／出口"}, {"a": "employed", "b": "unemployed", "zh": "有工作的／失業的"}, {"a": "success", "b": "failure", "zh": "成功／失敗"}, {"a": "strengthen", "b": "weaken", "zh": "加強／削弱"}, {"a": "simplify", "b": "complicate", "zh": "簡化／使複雜"}, {"a": "construct", "b": "destroy", "zh": "建造／摧毀"}, {"a": "encourage", "b": "discourage", "zh": "鼓勵／勸阻"}, {"a": "permit", "b": "prohibit", "zh": "允許／禁止"}, {"a": "private", "b": "public", "zh": "私人的／公共的"}, {"a": "individual", "b": "collective", "zh": "個人的／集體的"}, {"a": "local", "b": "global", "zh": "在地的／全球的"}, {"a": "domestic", "b": "foreign", "zh": "國內的／外國的"}, {"a": "wealth", "b": "poverty", "zh": "財富／貧窮"}, {"a": "surplus", "b": "deficit", "zh": "盈餘／赤字"}, {"a": "accurate", "b": "inaccurate", "zh": "準確的／不準確的"}, {"a": "consistent", "b": "inconsistent", "zh": "一致的／不一致的"}, {"a": "sufficient", "b": "insufficient", "zh": "足夠的／不足的"}, {"a": "optimistic", "b": "pessimistic", "zh": "樂觀的／悲觀的"}, {"a": "gain", "b": "loss", "zh": "獲得／損失"}, {"a": "vertical", "b": "horizontal", "zh": "垂直的／水平的"}, {"a": "maximize", "b": "minimize", "zh": "最大化／最小化"}, {"a": "accelerate", "b": "slow down", "zh": "加速／減速"}, {"a": "comply", "b": "violate", "zh": "遵守／違反"}, {"a": "natural", "b": "artificial", "zh": "天然的／人造的"}, {"a": "deliberate", "b": "accidental", "zh": "故意的／意外的"}, {"a": "profound", "b": "superficial", "zh": "深刻的／膚淺的"}, {"a": "complex", "b": "simple", "zh": "複雜的／簡單的"}, {"a": "innate", "b": "acquired", "zh": "天生的／後天的"}], "paras": [{"tier": "T1", "id": "stating & showing", "html": "<p>In biology class, Bella had to <b class=\"vw\" data-w=\"present\">present<\/b> a lab report with Edward, yet she could hardly <b class=\"vw\" data-w=\"express\">express<\/b> what she felt sitting beside him. His cold hand and golden eyes seemed to <b class=\"vw\" data-w=\"indicate\">indicate<\/b> that he was hiding something, and everyone in Forks <b class=\"vw\" data-w=\"regard\">regarded<\/b> the Cullens as strange. That night she <b class=\"vw\" data-w=\"debate\">debated<\/b> with herself for hours: one voice <b class=\"vw\" data-w=\"demand\">demanded<\/b> that she stay away from him, while another <b class=\"vw\" data-w=\"propose\">proposed<\/b> a far more dangerous idea — getting closer to learn his secret.<\/p>"}, {"tier": "T1", "id": "certainty / emphasis", "html": "<p>At first everyone <b class=\"vw\" data-w=\"assume\">assumed<\/b> the crash was a simple accident, but Bella had little <b class=\"vw\" data-w=\"doubt\">doubt<\/b> about what she had seen. Edward had <b class=\"vw\" data-w=\"certain\">certainly<\/b> moved faster than any human could — <b class=\"vw\" data-w=\"indeed\">indeed<\/b>, he had stopped the van with one bare hand. She was certain he was hiding something; the only thing she <b class=\"vw\" data-w=\"lack\">lacked<\/b> was proof.<\/p>"}, {"tier": "T1", "id": "achieving / trying / doing", "html": "<p>Every <b class=\"vw\" data-w=\"attempt\">attempt<\/b> Edward made to stay away from Bella failed, no matter how much <b class=\"vw\" data-w=\"effort\">effort<\/b> he put in. To <b class=\"vw\" data-w=\"establish\">establish<\/b> trust, he <b class=\"vw\" data-w=\"provide\">provided<\/b> honest answers to her endless questions and even <b class=\"vw\" data-w=\"perform\">performed<\/b> his strangest trick — reading the minds of everyone in the diner. Their conversations <b class=\"vw\" data-w=\"extend\">extended<\/b> late into the night, <b class=\"vw\" data-w=\"fill\">filling<\/b> the silence that had followed Bella since she moved to Forks; at last, she felt she had <b class=\"vw\" data-w=\"achieve\">achieved<\/b> something like happiness.<\/p>"}, {"tier": "T1", "id": "deciding / cause & tendency", "html": "<p>Bella was <b class=\"vw\" data-w=\"determine\">determined<\/b> to discover the truth, and several <b class=\"vw\" data-w=\"factor\">factors<\/b> pointed the same way: the Cullens <b class=\"vw\" data-w=\"tend\">tended<\/b> to disappear whenever the sun came out, and in one <b class=\"vw\" data-w=\"particular\">particular<\/b> <b class=\"vw\" data-w=\"instance\">instance<\/b>, Edward&#x27;s eyes turned from black to gold within a single week. The Quileute legends, <b class=\"vw\" data-w=\"particular\">particularly<\/b> the old stories Jacob told her on First Beach, finally gave her the answer.<\/p>"}, {"tier": "T1", "id": "business / money / legal", "html": "<p>No one in Forks understood how the Cullens <b class=\"vw\" data-w=\"fund\">funded<\/b> their lifestyle; Carlisle&#x27;s <b class=\"vw\" data-w=\"professional\">professional<\/b> salary alone could not explain the sports cars, and rumour said Alice&#x27;s stock-market predictions brought the family huge <b class=\"vw\" data-w=\"profit\">profits<\/b>. Their house stood on a private <b class=\"vw\" data-w=\"property\">property<\/b> deep in the forest, a <b class=\"vw\" data-w=\"site\">site<\/b> no stranger could ever find, where Emmett lifted boulders weighing hundreds of <b class=\"vw\" data-w=\"pound\">pounds<\/b> just for fun. In the vampire world, the Volturi&#x27;s law worked like an unwritten <b class=\"vw\" data-w=\"contract\">contract<\/b>, and anyone who broke it faced their <b class=\"vw\" data-w=\"court\">court<\/b> in Volterra — without a lawyer.<\/p>"}, {"tier": "T1", "id": "strength / firmness / potential", "html": "<p>Edward kept a <b class=\"vw\" data-w=\"firm\">firm<\/b> grip on Bella&#x27;s hand as they ran, because James — a hunter who could <b class=\"vw\" data-w=\"track\">track<\/b> his prey across an entire country — had chosen her as his next game. The Cullens stayed <b class=\"vw\" data-w=\"patient\">patient<\/b> while planning their defence, but no one underestimated the tracker&#x27;s <b class=\"vw\" data-w=\"potential\">potential<\/b>. Bella would forever <b class=\"vw\" data-w=\"associate\">associate<\/b> the smell of the ballet studio with the moment James finally chose to <b class=\"vw\" data-w=\"strike\">strike<\/b>.<\/p>"}, {"tier": "T1", "id": "time / sequence / others", "html": "<p>Before her wedding, Bella packed her <b class=\"vw\" data-w=\"stuff\">stuff<\/b> and said goodbye to her <b class=\"vw\" data-w=\"former\">former<\/b> bedroom, where a poster from an old vampire <b class=\"vw\" data-w=\"film\">film<\/b> still hung on the wall. Life among vampires, she learned, was deeply <b class=\"vw\" data-w=\"political\">political<\/b>: neither Edward <b class=\"vw\" data-w=\"nor\">nor<\/b> Carlisle could ignore the Volturi&#x27;s law — &quot;You <b class=\"vw\" data-w=\"shall\">shall<\/b> keep the secret, or you shall die.&quot;<\/p>"}, {"tier": "T2", "id": "business, money & commerce", "html": "<p>The Cullen <b class=\"vw\" data-w=\"household\">household<\/b> never worried about money.<\/p><p>Alice&#x27;s visions of the market brought in more <b class=\"vw\" data-w=\"revenue\">revenue<\/b> than any ordinary family could match, so they never needed a <b class=\"vw\" data-w=\"loan\">loan<\/b> and carried no <b class=\"vw\" data-w=\"debt\">debt<\/b>; their <b class=\"vw\" data-w=\"estate\">estate<\/b> in the forest was bought outright, the largest <b class=\"vw\" data-w=\"purchase\">purchase<\/b> in the county that year.<\/p><p>Carlisle still worked at the hospital for a modest <b class=\"vw\" data-w=\"wage\">wage<\/b>, because a doctor with no <b class=\"vw\" data-w=\"insurance\">insurance<\/b> paperwork would look strange, and he quietly <b class=\"vw\" data-w=\"grant\">granted<\/b> scholarships to Forks students — <b class=\"vw\" data-w=\"commit\">committed<\/b> to a life that looked human.<\/p>"}, {"tier": "T2", "id": "government, politics & law", "html": "<p>The Volturi rule the vampire world like a government with no <b class=\"vw\" data-w=\"federal\">federal<\/b> court above it. Aro acts as <b class=\"vw\" data-w=\"chairman\">chairman<\/b> of a <b class=\"vw\" data-w=\"council\">council<\/b> of three, and their single law — never expose our kind — needs no <b class=\"vw\" data-w=\"legislation\">legislation<\/b>, no <b class=\"vw\" data-w=\"minister\">minister<\/b> and no <b class=\"vw\" data-w=\"reform\">reform<\/b>, because the <b class=\"vw\" data-w=\"regulation\">regulation<\/b> is enforced by a <b class=\"vw\" data-w=\"troop\">troop<\/b> of gifted guards. They <b class=\"vw\" data-w=\"commission\">commission<\/b> no inquiry and pass no <b class=\"vw\" data-w=\"resolution\">resolution<\/b>; they simply arrive in your <b class=\"vw\" data-w=\"district\">district<\/b> and <b class=\"vw\" data-w=\"impose\">impose<\/b> the penalty. The Cullens are <b class=\"vw\" data-w=\"conservative\">conservative<\/b> by comparison: they change nothing and keep the secret.<\/p>"}, {"tier": "T2", "id": "institutions, organisations & society", "html": "<p>Forks is a small <b class=\"vw\" data-w=\"settlement\">settlement<\/b> where the local <b class=\"vw\" data-w=\"folk\">folk<\/b> know everyone, and the high school is the only <b class=\"vw\" data-w=\"institution\">institution<\/b> that matters. The town has no arts <b class=\"vw\" data-w=\"sector\">sector<\/b> and no <b class=\"vw\" data-w=\"construction\">construction<\/b> of anything new; the school <b class=\"vw\" data-w=\"hall\">hall<\/b> is the only place a <b class=\"vw\" data-w=\"concert\">concert<\/b> ever happens. Carlisle once joked that the Cullens had to <b class=\"vw\" data-w=\"construct\">construct<\/b> a whole human life out of nothing, and Edward&#x27;s struggle with what he is stays <b class=\"vw\" data-w=\"moral\">moral<\/b> rather than <b class=\"vw\" data-w=\"religious\">religious<\/b> — he believes he has no soul, yet refuses to hunt people.<\/p>"}, {"tier": "T2", "id": "thinking, intention & expression", "html": "<p>Edward could not <b class=\"vw\" data-w=\"convince\">convince<\/b> Bella to leave, no matter how often he <b class=\"vw\" data-w=\"urge\">urged<\/b> her to. From his <b class=\"vw\" data-w=\"perspective\">perspective<\/b> the <b class=\"vw\" data-w=\"objective\">objective<\/b> was simple — keep her alive — but Bella <b class=\"vw\" data-w=\"insist\">insisted<\/b> that she <b class=\"vw\" data-w=\"intend\">intended<\/b> to become like him, and she never hid that <b class=\"vw\" data-w=\"intention\">intention<\/b>. He refused to <b class=\"vw\" data-w=\"acknowledge\">acknowledge<\/b> that the <b class=\"vw\" data-w=\"concept\">concept<\/b> of losing her frightened him too. She could still <b class=\"vw\" data-w=\"recall\">recall<\/b> his exact words and would <b class=\"vw\" data-w=\"quote\">quote<\/b> them back whenever his <b class=\"vw\" data-w=\"expression\">expression<\/b> turned cold: &quot;I don&#x27;t have the strength to stay away from you.&quot;<\/p>"}, {"tier": "T2", "id": "actions, doing & carrying out", "html": "<p>Carlisle&#x27;s decision to <b class=\"vw\" data-w=\"adopt\">adopt<\/b> a &quot;vegetarian&quot; diet began as an <b class=\"vw\" data-w=\"experiment\">experiment<\/b> on himself: he wanted to <b class=\"vw\" data-w=\"demonstrate\">demonstrate<\/b> that a vampire could live among humans without killing. He <b class=\"vw\" data-w=\"conduct\">conducted<\/b> his whole life like a careful study, <b class=\"vw\" data-w=\"assess\">assessing<\/b> every risk, and his <b class=\"vw\" data-w=\"assessment\">assessment<\/b> of Bella was that the <b class=\"vw\" data-w=\"arrangement\">arrangement<\/b> could work if the family <b class=\"vw\" data-w=\"arrange\">arranged<\/b> a clear set of rules — never <b class=\"vw\" data-w=\"engage\">engage<\/b> with human blood, never <b class=\"vw\" data-w=\"expose\">expose<\/b> what they are.<\/p>"}, {"tier": "T2", "id": "change, progress & development", "html": "<p>As Bella&#x27;s relationship with Edward <b class=\"vw\" data-w=\"progress\">progressed<\/b>, new dangers <b class=\"vw\" data-w=\"arise\">arose<\/b> in <b class=\"vw\" data-w=\"proportion\">proportion<\/b> to her happiness. When James <b class=\"vw\" data-w=\"emerge\">emerged<\/b> as a tracker, the Cullens followed their usual <b class=\"vw\" data-w=\"procedure\">procedure<\/b>: split up, run, and hide her. Edward&#x27;s <b class=\"vw\" data-w=\"capacity\">capacity<\/b> to protect her had limits, and he knew the full <b class=\"vw\" data-w=\"extent\">extent<\/b> of the <b class=\"vw\" data-w=\"consequence\">consequence<\/b> if he failed. Bella <b class=\"vw\" data-w=\"decline\">declined<\/b> to stay safely behind, and that choice <b class=\"vw\" data-w=\"expand\">expanded<\/b> the risk — but the <b class=\"vw\" data-w=\"outcome\">outcome<\/b>, in the end, was that she survived.<\/p>"}, {"tier": "T2", "id": "comparison, condition & circumstance", "html": "<p>Bella had two <b class=\"vw\" data-w=\"alternative\">alternatives<\/b> — an <b class=\"vw\" data-w=\"ordinary\">ordinary<\/b> human life, or immortality with Edward — and she chose the <b class=\"vw\" data-w=\"latter\">latter<\/b> without hesitation.<\/p><p>In <b class=\"vw\" data-w=\"contrast\">contrast<\/b> to Jacob&#x27;s warmth, Edward&#x27;s <b class=\"vw\" data-w=\"presence\">presence<\/b> was cold on every <b class=\"vw\" data-w=\"occasion\">occasion<\/b> they met, <b class=\"vw\" data-w=\"whereas\">whereas<\/b> his <b class=\"vw\" data-w=\"absence\">absence<\/b> hurt far more. Under normal <b class=\"vw\" data-w=\"circumstance\">circumstances<\/b> no one would call a vampire a <b class=\"vw\" data-w=\"suitable\">suitable<\/b> boyfriend, but Forks was never a normal town.<\/p>"}, {"tier": "T2", "id": "conflict, crime & accusation", "html": "<p>When James <b class=\"vw\" data-w=\"threaten\">threatened<\/b> Bella, the family&#x27;s <b class=\"vw\" data-w=\"commitment\">commitment<\/b> to protecting her left no room for <b class=\"vw\" data-w=\"protest\">protest<\/b>. Edward <b class=\"vw\" data-w=\"accuse\">accused<\/b> himself of bringing <b class=\"vw\" data-w=\"violence\">violence<\/b> into her life; Bella made no <b class=\"vw\" data-w=\"complaint\">complaint<\/b> and never <b class=\"vw\" data-w=\"suspect\">suspected<\/b> him of anything but love. In the ballet studio James <b class=\"vw\" data-w=\"abuse\">abused<\/b> her trust, and her injuries later needed a cover story for the doctors — no <b class=\"vw\" data-w=\"trial\">trial<\/b>, no police. The <b class=\"vw\" data-w=\"bond\">bond<\/b> between the Cullens held, Alice and Jasper came to her <b class=\"vw\" data-w=\"aid\">aid<\/b>, and Edward&#x27;s <b class=\"vw\" data-w=\"relief\">relief<\/b> when she finally woke up was the first honest thing on his face in days.<\/p>"}, {"tier": "T2", "id": "physical actions & everyday verbs", "html": "<p>Bella <b class=\"vw\" data-w=\"spot\">spotted<\/b> the meadow first — a bright circle <b class=\"vw\" data-w=\"surround\">surrounded<\/b> by dark firs, where sunlight <b class=\"vw\" data-w=\"hang\">hung<\/b> on Edward&#x27;s skin like light on glass. Later, when the Cullens <b class=\"vw\" data-w=\"rush\">rushed<\/b> her out of Phoenix, Alice <b class=\"vw\" data-w=\"shut\">shut<\/b> the hotel blinds, and an old <b class=\"vw\" data-w=\"tape\">tape<\/b> of her mother&#x27;s voice became the <b class=\"vw\" data-w=\"instrument\">instrument<\/b> James used to lure her. Bella <b class=\"vw\" data-w=\"stick\">stuck<\/b> to her decision anyway; years later she would <b class=\"vw\" data-w=\"wed\">wed<\/b> Edward in that same forest.<\/p>"}, {"tier": "T2", "id": "descriptions & qualities", "html": "<p>The Cullen house stands near the <b class=\"vw\" data-w=\"coast\">coast<\/b> of the peninsula, at the end of a <b class=\"vw\" data-w=\"narrow\">narrow<\/b> dirt road, and inside it is nothing like a normal <b class=\"vw\" data-w=\"domestic\">domestic<\/b> home — no bedrooms, just an <b class=\"vw\" data-w=\"enormous\">enormous<\/b> wall of glass and a <b class=\"vw\" data-w=\"flat\">flat<\/b> white living room. Every <b class=\"vw\" data-w=\"resident\">resident<\/b> of Forks has a theory about them. James&#x27;s <b class=\"vw\" data-w=\"scheme\">scheme<\/b> to hunt Bella was a <b class=\"vw\" data-w=\"joint\">joint<\/b> effort with Victoria and Laurent, and the Cullens had made no <b class=\"vw\" data-w=\"provision\">provision<\/b> for a tracker that patient.<\/p>"}, {"tier": "T2", "id": "connectors, adverbs & modifiers", "html": "<p>Bella was <b class=\"vw\" data-w=\"apparently\">apparently<\/b> the only person in Forks whose mind Edward could not read; <b class=\"vw\" data-w=\"moreover\">moreover<\/b>, her blood was <b class=\"vw\" data-w=\"fairly\">fairly<\/b> irresistible to him. He told himself he <b class=\"vw\" data-w=\"ought\">ought<\/b> to stay away, that loving a human was not a <b class=\"vw\" data-w=\"proper\">proper<\/b> <b class=\"vw\" data-w=\"affair\">affair<\/b> for a vampire and could not <b class=\"vw\" data-w=\"necessarily\">necessarily<\/b> end well. But she was not <b class=\"vw\" data-w=\"merely\">merely<\/b> curious — she wanted to learn about his world <b class=\"vw\" data-w=\"properly\">properly<\/b> and <b class=\"vw\" data-w=\"acquire\">acquire<\/b> its secrets, and she waited <b class=\"vw\" data-w=\"till\">till<\/b> he admitted he wanted the same.<\/p>"}, {"tier": "T3", "id": "T3-01", "html": "<p>After the <b class=\"vw\" data-w=\"incident\">incident<\/b> in Phoenix, Bella woke up in hospital with a broken <b class=\"vw\" data-w=\"bone\">bone<\/b> in her leg. The <b class=\"vw\" data-w=\"injury\">injury<\/b> looked serious, but Carlisle <b class=\"vw\" data-w=\"emphasize\">emphasized<\/b> that it was only <b class=\"vw\" data-w=\"temporary\">temporary<\/b>. Charlie, who was no <b class=\"vw\" data-w=\"politician\">politician<\/b>, did not try to hide how <b class=\"vw\" data-w=\"emotional\">emotional<\/b> he felt; he simply sat by the bed and held her hand.<\/p><p>The story they told the doctors was simple: Bella had <b class=\"vw\" data-w=\"slip\">slipped<\/b> on the stairs of a hotel. Edward had <b class=\"vw\" data-w=\"accompany\">accompanied<\/b> her on the <b class=\"vw\" data-w=\"aircraft\">aircraft<\/b> home, and nobody asked why a <b class=\"vw\" data-w=\"regional\">regional<\/b> hospital report mentioned a boy who never left her side. Charlie made an <b class=\"vw\" data-w=\"appointment\">appointment<\/b> with a specialist anyway — the old <b class=\"vw\" data-w=\"habit\">habit<\/b> of a careful father.<\/p><p>Back in Forks, a cold <b class=\"vw\" data-w=\"draft\">draft<\/b> blew through the window each night until Edward <b class=\"vw\" data-w=\"knock\">knocked<\/b> softly on the glass. Bella began to imagine her <b class=\"vw\" data-w=\"existence\">existence<\/b> beside him. The <b class=\"vw\" data-w=\"prime\">prime<\/b> reason she wanted to change, she said, was not his <b class=\"vw\" data-w=\"vast\">vast<\/b> strength or his skin as hard as <b class=\"vw\" data-w=\"metal\">metal<\/b>; it was time. His silence seemed to <b class=\"vw\" data-w=\"imply\">imply<\/b> that he had thought about it too.<\/p><p>To <b class=\"vw\" data-w=\"illustrate\">illustrate<\/b> how long a vampire life could be, he showed her an old painting in Carlisle&#x27;s study: Carlisle standing beside the Volturi in Italy, centuries earlier, above a quiet <b class=\"vw\" data-w=\"lake\">lake<\/b> and hills. &quot;Even a <b class=\"vw\" data-w=\"liberal\">liberal<\/b> guess at his age wouldn&#x27;t <b class=\"vw\" data-w=\"qualify\">qualify<\/b> as close,&quot; Edward said. Later that week, a small <b class=\"vw\" data-w=\"exhibition\">exhibition<\/b> on local legends opened in Port Angeles, where a film <b class=\"vw\" data-w=\"producer\">producer<\/b> had organised a <b class=\"vw\" data-w=\"panel\">panel<\/b> discussion; nobody there guessed the truth. Bella laughed, but a <b class=\"vw\" data-w=\"seed\">seed<\/b> of fear had been planted. Charlie&#x27;s modest <b class=\"vw\" data-w=\"salary\">salary<\/b>, Emmett&#x27;s <b class=\"vw\" data-w=\"competitive\">competitive<\/b> jokes and her <b class=\"vw\" data-w=\"immediate\">immediate<\/b> plans for college suddenly felt very small.<\/p>"}, {"tier": "T3", "id": "T3-02", "html": "<p>Bella&#x27;s first <b class=\"vw\" data-w=\"assumption\">assumption<\/b> was that Edward simply disliked her. Every <b class=\"vw\" data-w=\"interaction\">interaction<\/b> in biology seemed to <b class=\"vw\" data-w=\"bother\">bother<\/b> him, and his whole body would <b class=\"vw\" data-w=\"freeze\">freeze<\/b> when she sat down. It took <b class=\"vw\" data-w=\"extreme\">extreme<\/b> <b class=\"vw\" data-w=\"discipline\">discipline<\/b>, she later learned, just to stay in the room; her scent pushed his <b class=\"vw\" data-w=\"concentration\">concentration<\/b> to the <b class=\"vw\" data-w=\"maximum\">maximum<\/b>.<\/p><p>The Cullens had built their <b class=\"vw\" data-w=\"reputation\">reputation<\/b> in Forks on being polite, distant and <b class=\"vw\" data-w=\"unusual\">unusual<\/b>. Their <b class=\"vw\" data-w=\"diet\">diet<\/b> of animal blood was the <b class=\"vw\" data-w=\"mechanism\">mechanism<\/b> that kept everyone safe, and family decisions were made by a kind of <b class=\"vw\" data-w=\"democracy\">democracy<\/b>. Edward knew that falling for a human would <b class=\"vw\" data-w=\"complicate\">complicate<\/b> everything, but he could not bear to <b class=\"vw\" data-w=\"disappoint\">disappoint<\/b> her either.<\/p><p>One <b class=\"vw\" data-w=\"gray\">gray<\/b> afternoon, Bella took the <b class=\"vw\" data-w=\"initiative\">initiative<\/b> and followed a narrow <b class=\"vw\" data-w=\"passage\">passage<\/b> through the forest. Edward stepped <b class=\"vw\" data-w=\"forth\">forth<\/b> from the trees, his eyes <b class=\"vw\" data-w=\"sharp\">sharp<\/b> with worry. &quot;You should be <b class=\"vw\" data-w=\"elsewhere\">elsewhere<\/b>,&quot; he said, &quot;somewhere safe.&quot; The <b class=\"vw\" data-w=\"implication\">implication<\/b> was clear: she did not <b class=\"vw\" data-w=\"deserve\">deserve<\/b> the danger he brought with him.<\/p><p>Careful <b class=\"vw\" data-w=\"observation\">observation<\/b> had already told her the truth. When Tyler&#x27;s van slid across the ice, Edward crossed the car park in one fluid <b class=\"vw\" data-w=\"motion\">motion<\/b> and <b class=\"vw\" data-w=\"effectively\">effectively<\/b> saved her life. Afterwards he tried to <b class=\"vw\" data-w=\"repair\">repair<\/b> the damage with a simple lie, a <b class=\"vw\" data-w=\"classic\">classic<\/b> cover story that began to <b class=\"vw\" data-w=\"collapse\">collapse<\/b> the moment she asked questions. Hours of quiet <b class=\"vw\" data-w=\"negotiation\">negotiation<\/b> later, he finally admitted what he was, and promised to <b class=\"vw\" data-w=\"defend\">defend<\/b> her from everything, even himself. Bella realised she was still holding the <b class=\"vw\" data-w=\"plastic\">plastic<\/b> wrapper from her lunch; she had forgotten to let go.<\/p>"}, {"tier": "T3", "id": "T3-03", "html": "<p>Bella left the <b class=\"vw\" data-w=\"southern\">southern<\/b> sun and <b class=\"vw\" data-w=\"urban\">urban<\/b> sprawl of Phoenix for the wet <b class=\"vw\" data-w=\"climate\">climate<\/b> of Forks, a town of <b class=\"vw\" data-w=\"approximately\">approximately<\/b> three thousand people. She was <b class=\"vw\" data-w=\"partly\">partly<\/b> relieved and partly terrified. Her first <b class=\"vw\" data-w=\"encounter\">encounter<\/b> with Edward did not help: his golden eyes made her plain <b class=\"vw\" data-w=\"brown\">brown<\/b> ones feel dull, and for a moment she forgot to <b class=\"vw\" data-w=\"breathe\">breathe<\/b>.<\/p><p>High school was hardly <b class=\"vw\" data-w=\"educational\">educational<\/b> for a boy who had graduated many times and travelled <b class=\"vw\" data-w=\"abroad\">abroad<\/b> for decades, but Edward stayed <b class=\"vw\" data-w=\"nearby\">nearby<\/b> anyway. He seemed <b class=\"vw\" data-w=\"capable\">capable<\/b> of anything, yet he believed he had no <b class=\"vw\" data-w=\"soul\">soul<\/b>. That was the <b class=\"vw\" data-w=\"fundamental\">fundamental<\/b> problem, he told her; around her, he could barely <b class=\"vw\" data-w=\"distinguish\">distinguish<\/b> love from hunger.<\/p><p>On the way to the meadow, he <b class=\"vw\" data-w=\"personally\">personally<\/b> carried her on his back, running so fast that she had to close her eyes; afterwards, she felt as if she had survived an <b class=\"vw\" data-w=\"emergency\">emergency<\/b>. Pressed against his cold <b class=\"vw\" data-w=\"shirt\">shirt<\/b>, she felt a strange calm settle in her <b class=\"vw\" data-w=\"breast\">breast<\/b>. Charlie later joked that Edward&#x27;s manners were almost <b class=\"vw\" data-w=\"presidential\">presidential<\/b>. &quot;He&#x27;s the <b class=\"vw\" data-w=\"exception\">exception<\/b>,&quot; Bella said. &quot;Don&#x27;t let it <b class=\"vw\" data-w=\"confuse\">confuse<\/b> you.&quot;<\/p><p>The Cullens&#x27; quiet <b class=\"vw\" data-w=\"accommodation\">accommodation<\/b> in the woods was paid for by careful investments in a large <b class=\"vw\" data-w=\"corporation\">corporation<\/b>, a detail no <b class=\"vw\" data-w=\"reporter\">reporter<\/b> had ever discovered. Rosalie, who could name the <b class=\"vw\" data-w=\"manufacturer\">manufacturer<\/b> of any engine by its sound, liked to <b class=\"vw\" data-w=\"highlight\">highlight<\/b> the family&#x27;s <b class=\"vw\" data-w=\"substantial\">substantial<\/b> wealth just to annoy Edward. To Bella, though, his trust was the most <b class=\"vw\" data-w=\"valuable\">valuable<\/b> thing he owned. Even the small <b class=\"vw\" data-w=\"chip\">chip<\/b> on her favourite mug, from the morning he first stayed, seemed to <b class=\"vw\" data-w=\"enhance\">enhance<\/b> the memory. She was <b class=\"vw\" data-w=\"proud\">proud<\/b> of him and refused to accept <b class=\"vw\" data-w=\"defeat\">defeat<\/b>; with him she could <b class=\"vw\" data-w=\"cope\">cope<\/b> with anything, and let her old life <b class=\"vw\" data-w=\"slide\">slide<\/b> away without a single <b class=\"vw\" data-w=\"excuse\">excuse<\/b>. Everything fitted <b class=\"vw\" data-w=\"perfectly\">perfectly<\/b>.<\/p>"}, {"tier": "T3", "id": "T3-04", "html": "<p>Bella had moved to Forks <b class=\"vw\" data-w=\"primarily\">primarily<\/b> so that her mother could travel with Phil. <b class=\"vw\" data-w=\"originally\">Originally<\/b>, she planned to stay for a year, keep her head down and <b class=\"vw\" data-w=\"integrate\">integrate<\/b> quietly. That plan lasted until Edward.<\/p><p>His <b class=\"vw\" data-w=\"beauty\">beauty<\/b> was the first thing everyone noticed, but Bella was more interested in the <b class=\"vw\" data-w=\"sequence\">sequence<\/b> of strange events around him: the <b class=\"vw\" data-w=\"sudden\">sudden<\/b> absences on sunny days, the <b class=\"vw\" data-w=\"consistent\">consistent<\/b> coldness of his skin, the way he could <b class=\"vw\" data-w=\"calculate\">calculate<\/b> the answer to a <b class=\"vw\" data-w=\"mathematics\">mathematics<\/b> problem before the teacher finished writing it. His room <b class=\"vw\" data-w=\"occupy\">occupied<\/b> the <b class=\"vw\" data-w=\"upper\">upper<\/b> floor of the Cullen house, a beautiful <b class=\"vw\" data-w=\"creation\">creation<\/b> of glass and music.<\/p><p>One evening he took her <b class=\"vw\" data-w=\"aside\">aside<\/b>. &quot;First, you should be afraid of me,&quot; he said. &quot;<b class=\"vw\" data-w=\"secondly\">Secondly<\/b>, running is pointless.&quot; Instead of fear, she felt <b class=\"vw\" data-w=\"comfort\">comfort<\/b>. The <b class=\"vw\" data-w=\"prospect\">prospect<\/b> of losing him frightened her more than any danger.<\/p><p>That danger arrived with James. His <b class=\"vw\" data-w=\"plot\">plot<\/b> was simple: separate Bella from the Cullens and hunt her alone. The cover story for her <b class=\"vw\" data-w=\"severe\">severe<\/b> injuries was a hotel fall and a short <b class=\"vw\" data-w=\"illness\">illness<\/b>; no <b class=\"vw\" data-w=\"journalist\">journalist<\/b> or <b class=\"vw\" data-w=\"advertisement\">advertisement<\/b> could have explained the truth. James bit her wrist, not her <b class=\"vw\" data-w=\"neck\">neck<\/b>, and Edward sucked the venom out just in time; with Carlisle&#x27;s help, that was <b class=\"vw\" data-w=\"sufficient\">sufficient<\/b> to <b class=\"vw\" data-w=\"preserve\">preserve<\/b> her life.<\/p><p>Rosalie&#x27;s <b class=\"vw\" data-w=\"criticism\">criticism<\/b> never stopped, and she had strict <b class=\"vw\" data-w=\"criteria\">criteria<\/b> for who belonged in the family. Bella did not care about <b class=\"vw\" data-w=\"convention\">convention<\/b>; she would <b class=\"vw\" data-w=\"bet\">bet<\/b> everything on Edward. Not even the strange <b class=\"vw\" data-w=\"gene\">gene<\/b> that turned Jacob&#x27;s family into <b class=\"vw\" data-w=\"massive\">massive<\/b> wolves could change her mind. After a century, Edward still managed to <b class=\"vw\" data-w=\"retain\">retain<\/b> his old-fashioned kindness, even as he pushed her gently on Charlie&#x27;s porch <b class=\"vw\" data-w=\"swing\">swing<\/b>.<\/p>"}, {"tier": "T3", "id": "T3-05", "html": "<p>Forks is a small <b class=\"vw\" data-w=\"rural\">rural<\/b> town with a <b class=\"vw\" data-w=\"thick\">thick<\/b> green <b class=\"vw\" data-w=\"landscape\">landscape<\/b>, rising <b class=\"vw\" data-w=\"unemployment\">unemployment<\/b> and very little <b class=\"vw\" data-w=\"drama\">drama<\/b> — at least, that was Bella&#x27;s first <b class=\"vw\" data-w=\"interpretation\">interpretation<\/b>. Charlie grew a small <b class=\"vw\" data-w=\"crop\">crop<\/b> of vegetables behind the house and spent his weekends fishing in comfortable <b class=\"vw\" data-w=\"silence\">silence<\/b>.<\/p><p>Bella called herself <b class=\"vw\" data-w=\"plain\">plain<\/b>, but Edward disagreed. When a winter <b class=\"vw\" data-w=\"storm\">storm<\/b> hit and she slipped on the ice, Carlisle&#x27;s careful <b class=\"vw\" data-w=\"examination\">examination<\/b> found only a <b class=\"vw\" data-w=\"minor\">minor<\/b> bruise. &quot;It wasn&#x27;t your <b class=\"vw\" data-w=\"fault\">fault<\/b>,&quot; Edward said, his voice <b class=\"vw\" data-w=\"calm\">calm<\/b>. Charlie approved of him because he seemed like a real <b class=\"vw\" data-w=\"gentleman\">gentleman<\/b>.<\/p><p>The Cullens were a <b class=\"vw\" data-w=\"minority\">minority<\/b> among vampires. They would <b class=\"vw\" data-w=\"hunt\">hunt<\/b> animals in the mountains, joking that blood was simply another source of <b class=\"vw\" data-w=\"protein\">protein<\/b>, and Carlisle helped <b class=\"vw\" data-w=\"distribute\">distribute<\/b> medical supplies at the hospital. Jasper seemed to <b class=\"vw\" data-w=\"derive\">derive<\/b> comfort from Bella&#x27;s steady moods, and Edward took <b class=\"vw\" data-w=\"intellectual\">intellectual<\/b> <b class=\"vw\" data-w=\"delight\">delight<\/b> in old books. Their way of life rested on one <b class=\"vw\" data-w=\"premise\">premise<\/b> — humans are not food — and vampire families could <b class=\"vw\" data-w=\"differ\">differ<\/b> wildly on that point.<\/p><p>Alice was always the first to <b class=\"vw\" data-w=\"volunteer\">volunteer<\/b> for a shopping trip, and her visions made escape plans remarkably <b class=\"vw\" data-w=\"efficient\">efficient<\/b>. When James appeared, timing was <b class=\"vw\" data-w=\"crucial\">crucial<\/b>, and the family moved <b class=\"vw\" data-w=\"rapidly\">rapidly<\/b>. Edward&#x27;s hands barely touched the <b class=\"vw\" data-w=\"wheel\">wheel<\/b> as they raced south. He swore he would never <b class=\"vw\" data-w=\"abandon\">abandon<\/b> her, though his control did <b class=\"vw\" data-w=\"exhibit\">exhibit<\/b> small cracks.<\/p><p>Loving him felt like a quiet <b class=\"vw\" data-w=\"revolution\">revolution<\/b>, a <b class=\"vw\" data-w=\"spell\">spell<\/b> she could not break. Bella liked to <b class=\"vw\" data-w=\"lean\">lean<\/b> against his shoulder, <b class=\"vw\" data-w=\"grateful\">grateful<\/b> and unafraid. Carlisle tried to <b class=\"vw\" data-w=\"educate\">educate<\/b> her about the <b class=\"vw\" data-w=\"origin\">origin<\/b> of their kind, while Edward liked to <b class=\"vw\" data-w=\"toy\">toy<\/b> with the idea of racing Emmett. Everything about her new life was suddenly <b class=\"vw\" data-w=\"dramatic\">dramatic<\/b>.<\/p>"}, {"tier": "T3", "id": "T3-06", "html": "<p>The Cullen house had a quiet east <b class=\"vw\" data-w=\"wing\">wing<\/b> where Edward kept his piano and a <b class=\"vw\" data-w=\"silver\">silver<\/b>-edged first <b class=\"vw\" data-w=\"edition\">edition<\/b> of nearly every book Bella loved. Esme grew roses in the dark <b class=\"vw\" data-w=\"soil\">soil<\/b> of the garden, and Emmett&#x27;s <b class=\"vw\" data-w=\"laughter\">laughter<\/b> often rang out from the <b class=\"vw\" data-w=\"roof\">roof<\/b>. It was the most <b class=\"vw\" data-w=\"unlikely\">unlikely<\/b> home Bella had ever seen.<\/p><p>She did not feel like Edward&#x27;s <b class=\"vw\" data-w=\"peer\">peer<\/b>. He was <b class=\"vw\" data-w=\"smart\">smart<\/b>, a hundred years older, and his <b class=\"vw\" data-w=\"honest\">honest<\/b> answers often <b class=\"vw\" data-w=\"upset\">upset<\/b> her. Still, a flicker of <b class=\"vw\" data-w=\"recognition\">recognition<\/b> crossed her face whenever he spoke of the past, and there was an <b class=\"vw\" data-w=\"electricity\">electricity<\/b> between them she could not explain.<\/p><p>The family had its own <b class=\"vw\" data-w=\"agenda\">agenda<\/b>. Carlisle placed great <b class=\"vw\" data-w=\"emphasis\">emphasis<\/b> on control and <b class=\"vw\" data-w=\"typically\">typically<\/b> offered his <b class=\"vw\" data-w=\"assistance\">assistance<\/b> at the hospital long after his shift ended; he joked that a century of medicine had earned him neither <b class=\"vw\" data-w=\"retirement\">retirement<\/b> nor a <b class=\"vw\" data-w=\"pension\">pension<\/b>. Alice, the family&#x27;s unofficial <b class=\"vw\" data-w=\"supplier\">supplier<\/b> of designer clothes, treated every new dress as an <b class=\"vw\" data-w=\"acquisition\">acquisition<\/b> worth celebrating; she could have run a <b class=\"vw\" data-w=\"retail\">retail<\/b> empire. Alice and Rosalie were paired with Jasper and Emmett <b class=\"vw\" data-w=\"respectively\">respectively<\/b>.<\/p><p>When James arrived, <b class=\"vw\" data-w=\"preparation\">preparation<\/b> began at once. An old <b class=\"vw\" data-w=\"dispute\">dispute<\/b> with the wolves meant Edward had to <b class=\"vw\" data-w=\"negotiate\">negotiate<\/b> carefully, and fear began to <b class=\"vw\" data-w=\"dominate\">dominate<\/b> every conversation. Every vampire family showed some <b class=\"vw\" data-w=\"variation\">variation<\/b> in how it treated humans, and the Cullens&#x27; calm <b class=\"vw\" data-w=\"representation\">representation<\/b> of themselves to the town was only one thin <b class=\"vw\" data-w=\"layer\">layer<\/b> of the truth. A single <b class=\"vw\" data-w=\"wire\">wire<\/b> fence marked the edge of their land.<\/p><p>Carlisle&#x27;s proudest <b class=\"vw\" data-w=\"achievement\">achievement<\/b> was that he had never once tasted human blood. For Bella, the real <b class=\"vw\" data-w=\"prize\">prize<\/b> was simpler. When Edward smiled, she saw every perfect <b class=\"vw\" data-w=\"tooth\">tooth<\/b> — <b class=\"vw\" data-w=\"proof\">proof<\/b> of what he was — and loved him <b class=\"vw\" data-w=\"deeply\">deeply<\/b> anyway. <b class=\"vw\" data-w=\"ultimately\">Ultimately<\/b>, she chose to <b class=\"vw\" data-w=\"undertake\">undertake<\/b> the risk. That weekend, Alice even dragged everyone to the wedding of a <b class=\"vw\" data-w=\"gay\">gay<\/b> couple she had met in Seattle, calling it the best <b class=\"vw\" data-w=\"entertainment\">entertainment<\/b> of the year.<\/p>"}, {"tier": "T3", "id": "T3-07", "html": "<p>After James&#x27;s <b class=\"vw\" data-w=\"arrival\">arrival<\/b> in Forks, the <b class=\"vw\" data-w=\"mood\">mood<\/b> in the Cullen house changed. Carlisle had built a careful <b class=\"vw\" data-w=\"framework\">framework<\/b> of rules for living among humans, and now he had to <b class=\"vw\" data-w=\"restrict\">restrict<\/b> where Bella could go. The forest became a danger <b class=\"vw\" data-w=\"zone\">zone<\/b>.<\/p><p>Local news <b class=\"vw\" data-w=\"coverage\">coverage<\/b> of the animal attacks was <b class=\"vw\" data-w=\"virtually\">virtually<\/b> useless. One <b class=\"vw\" data-w=\"publication\">publication<\/b> blamed bears; another quoted an <b class=\"vw\" data-w=\"elderly\">elderly<\/b> hunter. Even the <b class=\"vw\" data-w=\"governor\">governor<\/b>&#x27;s office issued a statement, and Charlie came home in his police <b class=\"vw\" data-w=\"uniform\">uniform<\/b>, too tired for his usual <b class=\"vw\" data-w=\"beer\">beer<\/b>. Bella felt <b class=\"vw\" data-w=\"nervous\">nervous<\/b>; every <b class=\"vw\" data-w=\"symptom\">symptom<\/b> of the attacks pointed to something <b class=\"vw\" data-w=\"unknown\">unknown<\/b>.<\/p><p>Alice could <b class=\"vw\" data-w=\"trace\">trace<\/b> James&#x27;s movements in her visions, but they were never <b class=\"vw\" data-w=\"solid\">solid<\/b> enough to <b class=\"vw\" data-w=\"assure\">assure<\/b> anyone. Her voice rose to a high <b class=\"vw\" data-w=\"pitch\">pitch<\/b> whenever a new picture appeared. Jasper, <b class=\"vw\" data-w=\"sensitive\">sensitive<\/b> to every change of feeling, kept the <b class=\"vw\" data-w=\"tension\">tension<\/b> low. Edward refused to give an <b class=\"vw\" data-w=\"inch\">inch<\/b>: Bella would not <b class=\"vw\" data-w=\"submit\">submit<\/b> to James&#x27;s game, and no plan was <b class=\"vw\" data-w=\"equivalent\">equivalent<\/b> to keeping her close.<\/p><p>Carlisle, the closest thing Forks had to a real <b class=\"vw\" data-w=\"specialist\">specialist<\/b>, built a <b class=\"vw\" data-w=\"profile\">profile<\/b> of the tracker. His <b class=\"vw\" data-w=\"input\">input<\/b> was simple: James would try to <b class=\"vw\" data-w=\"isolate\">isolate<\/b> her. With <b class=\"vw\" data-w=\"numerous\">numerous<\/b> escape routes ready, Alice and Jasper drove Bella south through the night toward Phoenix, past the rusty <b class=\"vw\" data-w=\"gate\">gate<\/b> of a closed timber <b class=\"vw\" data-w=\"enterprise\">enterprise<\/b>, a small <b class=\"vw\" data-w=\"port\">port<\/b> on the coast and a fallen power <b class=\"vw\" data-w=\"cable\">cable<\/b>.<\/p><p>Bella felt she would always <b class=\"vw\" data-w=\"owe\">owe<\/b> them. Edward moved with an <b class=\"vw\" data-w=\"ease\">ease<\/b> that made her forget the danger, but his manners were hardly <b class=\"vw\" data-w=\"contemporary\">contemporary<\/b>; they belonged to another <b class=\"vw\" data-w=\"era\">era<\/b>. When the whole <b class=\"vw\" data-w=\"episode\">episode<\/b> was over, a thin <b class=\"vw\" data-w=\"crack\">crack<\/b> of light broke through the clouds, and even a <b class=\"vw\" data-w=\"slight\">slight<\/b> smile felt like a victory.<\/p>"}, {"tier": "T3", "id": "T3-08", "html": "<p>It rained <b class=\"vw\" data-w=\"heavily\">heavily<\/b> the day Bella jumped from the cliff at La Push. A dark <b class=\"vw\" data-w=\"cloud\">cloud<\/b> hung over the sea, and by the time Jacob pulled her out, she was cold and <b class=\"vw\" data-w=\"wet\">wet<\/b>. To her, he was a <b class=\"vw\" data-w=\"hero\">hero<\/b>; to Charlie, who heard the story from a rescue <b class=\"vw\" data-w=\"crew\">crew<\/b>, it was a near <b class=\"vw\" data-w=\"disaster\">disaster<\/b>.<\/p><p>Her <b class=\"vw\" data-w=\"routine\">routine<\/b> had fallen apart months earlier, when Edward left. She felt like a <b class=\"vw\" data-w=\"prisoner\">prisoner<\/b> of her own memories and would <b class=\"vw\" data-w=\"stare\">stare<\/b> at the forest from the cab of her old <b class=\"vw\" data-w=\"truck\">truck<\/b>. Jacob, her strongest <b class=\"vw\" data-w=\"supporter\">supporter<\/b>, tried to <b class=\"vw\" data-w=\"persuade\">persuade<\/b> her to come back to life, and his warm, <b class=\"vw\" data-w=\"steady\">steady<\/b> friendship began to <b class=\"vw\" data-w=\"restore\">restore<\/b> something in her. Her <b class=\"vw\" data-w=\"welfare\">welfare<\/b> mattered more to him than anything; his own feelings were <b class=\"vw\" data-w=\"secondary\">secondary<\/b>.<\/p><p>Meanwhile, Victoria wanted to <b class=\"vw\" data-w=\"eliminate\">eliminate<\/b> Bella. She began to <b class=\"vw\" data-w=\"recruit\">recruit<\/b> newborn vampires in Seattle, a <b class=\"vw\" data-w=\"phenomenon\">phenomenon<\/b> the police could not explain. The pack kept a <b class=\"vw\" data-w=\"tight\">tight<\/b> watch on the border and did not <b class=\"vw\" data-w=\"exclude\">exclude<\/b> anyone willing to <b class=\"vw\" data-w=\"assist\">assist<\/b>.<\/p><p>When Edward returned, Bella could <b class=\"vw\" data-w=\"perceive\">perceive<\/b> how much he had suffered. &quot;There&#x27;s no simple <b class=\"vw\" data-w=\"formula\">formula<\/b> for us,&quot; he said. &quot;Nothing can <b class=\"vw\" data-w=\"alter\">alter<\/b> what I am — <b class=\"vw\" data-w=\"hence\">hence<\/b> the danger.&quot; He did not want to <b class=\"vw\" data-w=\"convert\">convert<\/b> her <b class=\"vw\" data-w=\"anymore\">anymore<\/b>, or so he claimed. His <b class=\"vw\" data-w=\"nose\">nose<\/b> wrinkled at the smell of wolf on her jacket, but he stayed <b class=\"vw\" data-w=\"beside\">beside<\/b> her.<\/p><p>They talked about learning to <b class=\"vw\" data-w=\"sail\">sail<\/b> along the coast one day, a <b class=\"vw\" data-w=\"grand\">grand<\/b> plan for an ordinary life. Bella promised to <b class=\"vw\" data-w=\"devote\">devote<\/b> herself to him, and every <b class=\"vw\" data-w=\"false\">false<\/b> excuse in a long <b class=\"vw\" data-w=\"string\">string<\/b> of lies to Charlie seemed worth it. Her heart would <b class=\"vw\" data-w=\"sink\">sink<\/b> whenever he left the room, then race at a crazy <b class=\"vw\" data-w=\"pace\">pace<\/b> when he came back; she noticed the gold ring around each dark <b class=\"vw\" data-w=\"pupil\">pupil<\/b>. Every <b class=\"vw\" data-w=\"meter\">meter<\/b> of forest between them felt too far, and his love would <b class=\"vw\" data-w=\"inspire\">inspire<\/b> her to be braver than she had ever been.<\/p>"}, {"tier": "T3", "id": "T3-09", "html": "<p>Forks sits on the <b class=\"vw\" data-w=\"western\">western<\/b> edge of Washington, where rain can <b class=\"vw\" data-w=\"pour\">pour<\/b> for days. <b class=\"vw\" data-w=\"initially\">Initially<\/b>, Bella found the town dull; her <b class=\"vw\" data-w=\"mom\">mom<\/b> called it the rainiest place in America. But her <b class=\"vw\" data-w=\"perception\">perception<\/b> changed quickly, because the Cullens continued to <b class=\"vw\" data-w=\"fascinate\">fascinate<\/b> her.<\/p><p>Edward <b class=\"vw\" data-w=\"rarely\">rarely<\/b> relaxed. He <b class=\"vw\" data-w=\"constantly\">constantly<\/b> felt <b class=\"vw\" data-w=\"guilty\">guilty<\/b> about the danger he brought, and a quiet fear seemed to <b class=\"vw\" data-w=\"underlie\">underlie<\/b> every decision he made. When he left Forks, he fell into a deep <b class=\"vw\" data-w=\"depression\">depression<\/b>, while Bella&#x27;s <b class=\"vw\" data-w=\"everyday\">everyday<\/b> life lost all its colour.<\/p><p>The wolves guarded their <b class=\"vw\" data-w=\"territory\">territory<\/b> carefully. A narrow <b class=\"vw\" data-w=\"stream\">stream<\/b> marked the <b class=\"vw\" data-w=\"boundary\">boundary<\/b>, and any <b class=\"vw\" data-w=\"expansion\">expansion<\/b> of the Cullens&#x27; land was out of the question. For the pack, the <b class=\"vw\" data-w=\"ratio\">ratio<\/b> of vampires to wolves was <b class=\"vw\" data-w=\"vital\">vital<\/b>, and Sam would <b class=\"vw\" data-w=\"evaluate\">evaluate<\/b> every new threat. <b class=\"vw\" data-w=\"naturally\">Naturally<\/b>, Jacob resented the treaty, but he understood the <b class=\"vw\" data-w=\"obligation\">obligation<\/b>.<\/p><p>At the airport, security was tight because of a recent <b class=\"vw\" data-w=\"terrorist\">terrorist<\/b> threat, and Bella struggled to <b class=\"vw\" data-w=\"justify\">justify<\/b> her sudden trip to Italy. &quot;This way, <b class=\"vw\" data-w=\"sir\">sir<\/b>,&quot; an officer told the man in front. The <b class=\"vw\" data-w=\"distinction\">distinction<\/b> between her <b class=\"vw\" data-w=\"external\">external<\/b> calm and her inner panic was obvious, and her fear was <b class=\"vw\" data-w=\"apparent\">apparent<\/b> to Alice. She wanted <b class=\"vw\" data-w=\"badly\">badly<\/b> to save Edward. &quot;<b class=\"vw\" data-w=\"whenever\">Whenever<\/b> you&#x27;re ready,&quot; Alice said.<\/p><p>In Volterra, Edward begged the Volturi to <b class=\"vw\" data-w=\"spare\">spare<\/b> Bella. Every <b class=\"vw\" data-w=\"muscle\">muscle<\/b> in his body was tense; even at his full <b class=\"vw\" data-w=\"height\">height<\/b>, he looked fragile beside Aro&#x27;s guards. Trust, Bella realised, was the only <b class=\"vw\" data-w=\"currency\">currency<\/b> that mattered, and no police <b class=\"vw\" data-w=\"database\">database<\/b> would ever record what happened that night. Back in Forks, Charlie stopped at the local <b class=\"vw\" data-w=\"pub\">pub<\/b> and let relief <b class=\"vw\" data-w=\"sweep\">sweep<\/b> over him, though his <b class=\"vw\" data-w=\"anger\">anger<\/b> at Bella lasted for weeks. She felt a deep <b class=\"vw\" data-w=\"satisfaction\">satisfaction<\/b>, and decided to <b class=\"vw\" data-w=\"incorporate\">incorporate<\/b> everything she had learned into the way she lived. Nothing could <b class=\"vw\" data-w=\"scare\">scare<\/b> her away now.<\/p>"}, {"tier": "T3", "id": "T3-10", "html": "<p>For her eighteenth birthday, Alice sent Bella an <b class=\"vw\" data-w=\"invitation\">invitation<\/b> to a party at the Cullen house. Esme baked a <b class=\"vw\" data-w=\"cake\">cake<\/b> that nobody but Bella would eat, and Edward played a new <b class=\"vw\" data-w=\"tune\">tune<\/b> on the piano. The house was bright and open, with pale <b class=\"vw\" data-w=\"furniture\">furniture<\/b>, a grand piano and a whole wall of glass — <b class=\"vw\" data-w=\"remarkable\">remarkable<\/b> evidence of the family&#x27;s quiet <b class=\"vw\" data-w=\"wealth\">wealth<\/b>.<\/p><p>Then Bella cut her finger. One drop of blood, and Jasper lunged. The <b class=\"vw\" data-w=\"strain\">strain<\/b> on Edward&#x27;s control was <b class=\"vw\" data-w=\"extraordinary\">extraordinary<\/b>; he pushed her aside, and she landed on broken glass. The <b class=\"vw\" data-w=\"wound\">wound<\/b> was small, but the moment changed everything. In a desperate <b class=\"vw\" data-w=\"bid\">bid<\/b> to keep her safe, Edward decided to <b class=\"vw\" data-w=\"withdraw\">withdraw<\/b> from her life.<\/p><p>The <b class=\"vw\" data-w=\"transition\">transition<\/b> was brutal. Bella abandoned her English <b class=\"vw\" data-w=\"essay\">essay<\/b>, ignored her photo <b class=\"vw\" data-w=\"album\">album<\/b> and wanted to <b class=\"vw\" data-w=\"scream\">scream<\/b>. She <b class=\"vw\" data-w=\"gradually\">gradually<\/b> stopped seeing her friends, and Charlie began to worry about some kind of <b class=\"vw\" data-w=\"disorder\">disorder<\/b>. Even Alice, the family&#x27;s <b class=\"vw\" data-w=\"designer\">designer<\/b> of perfect plans, had gone.<\/p><p>In Seattle, the papers blamed gangs for a wave of murders. A local <b class=\"vw\" data-w=\"singer\">singer<\/b> vanished from her <b class=\"vw\" data-w=\"apartment\">apartment<\/b>, and witnesses saw pale strangers on an old train <b class=\"vw\" data-w=\"platform\">platform<\/b>. The city&#x27;s <b class=\"vw\" data-w=\"pollution\">pollution<\/b> hid the newborns&#x27; scent, and no police <b class=\"vw\" data-w=\"innovation\">innovation<\/b> could catch them. Back in Forks, Victoria set a <b class=\"vw\" data-w=\"trap\">trap<\/b>, and Jacob&#x27;s pack ran along every forest <b class=\"vw\" data-w=\"trail\">trail<\/b> and through the wet <b class=\"vw\" data-w=\"grass\">grass<\/b>, ready to fight. Charlie said that dogs of that <b class=\"vw\" data-w=\"breed\">breed<\/b> were usually gentle, not knowing that the &quot;giant wolves&quot; were Jacob&#x27;s friends.<\/p><p>A <b class=\"vw\" data-w=\"loose\">loose<\/b> floorboard creaked whenever Bella came home late; she had asked for an <b class=\"vw\" data-w=\"extension\">extension<\/b> to her curfew, but Charlie&#x27;s one <b class=\"vw\" data-w=\"restriction\">restriction<\/b> was clear. Edward later called his leaving a <b class=\"vw\" data-w=\"symbol\">symbol<\/b> of fear, not love. He could <b class=\"vw\" data-w=\"transform\">transform<\/b> a car&#x27;s engine or bend <b class=\"vw\" data-w=\"steel\">steel<\/b>, but he could not undo that mistake. &quot;Nothing could <b class=\"vw\" data-w=\"frighten\">frighten<\/b> me more than losing you,&quot; he said. Trust became the <b class=\"vw\" data-w=\"foundation\">foundation<\/b> they rebuilt together. Carlisle, a <b class=\"vw\" data-w=\"brilliant\">brilliant<\/b> doctor who studied the family like an <b class=\"vw\" data-w=\"analyst\">analyst<\/b>, called it a slow <b class=\"vw\" data-w=\"demonstration\">demonstration<\/b> of healing — and not even the <b class=\"vw\" data-w=\"evil\">evil<\/b> in Victoria could stop it. Before they left, Alice quietly filled the car&#x27;s <b class=\"vw\" data-w=\"tank\">tank<\/b>.<\/p>"}, {"tier": "T3", "id": "T3-11", "html": "<p>On Bella&#x27;s first icy morning in Forks, Tyler&#x27;s <b class=\"vw\" data-w=\"van\">van<\/b> skidded around the <b class=\"vw\" data-w=\"curve\">curve<\/b> of the school car park and almost hit her. Edward stopped it with his bare hand. From then on, he switched into protective <b class=\"vw\" data-w=\"mode\">mode<\/b>, and Bella began to <b class=\"vw\" data-w=\"interpret\">interpret<\/b> every <b class=\"vw\" data-w=\"shadow\">shadow<\/b> in the trees as a sign of him.<\/p><p>She started to <b class=\"vw\" data-w=\"consult\">consult<\/b> old books about local legends. A narrow <b class=\"vw\" data-w=\"strip\">strip<\/b> of forest separated the Cullens&#x27; land from the reservation, and Billy Black kept a <b class=\"vw\" data-w=\"log\">log<\/b> of every fishing trip he took. In one story, a <b class=\"vw\" data-w=\"giant\">giant<\/b> &quot;cold one&quot; was worshipped almost like a <b class=\"vw\" data-w=\"god\">god<\/b>. Bella&#x27;s fear of blood seemed to <b class=\"vw\" data-w=\"stem\">stem<\/b> from a childhood accident, and <b class=\"vw\" data-w=\"nowadays\">nowadays<\/b> even a scraped <b class=\"vw\" data-w=\"knee\">knee<\/b> made her feel <b class=\"vw\" data-w=\"awful\">awful<\/b>.<\/p><p>Edward had to <b class=\"vw\" data-w=\"overcome\">overcome<\/b> every instinct just to sit beside her. The <b class=\"vw\" data-w=\"depth\">depth<\/b> of his devotion frightened her more than his strength. &quot;I don&#x27;t want to <b class=\"vw\" data-w=\"harm\">harm<\/b> you,&quot; he said, his <b class=\"vw\" data-w=\"inner\">inner<\/b> conflict plain on his face. She insisted that he did not <b class=\"vw\" data-w=\"pose\">pose<\/b> a threat, but she knew she would have to <b class=\"vw\" data-w=\"adjust\">adjust<\/b> to his world; Forks was beginning to feel like a different <b class=\"vw\" data-w=\"planet\">planet<\/b>.<\/p><p>Carlisle, Edward&#x27;s closest <b class=\"vw\" data-w=\"adviser\">adviser<\/b>, had <b class=\"vw\" data-w=\"extensive\">extensive<\/b> medical knowledge, yet no medicine could <b class=\"vw\" data-w=\"reverse\">reverse<\/b> venom once it spread, and no <b class=\"vw\" data-w=\"substance\">substance<\/b> on earth explained Edward&#x27;s cold skin. Alice found a <b class=\"vw\" data-w=\"creative\">creative<\/b> way to cheer Bella up: a small town <b class=\"vw\" data-w=\"festival\">festival<\/b> on the edge of an old <b class=\"vw\" data-w=\"agricultural\">agricultural<\/b> valley. There were <b class=\"vw\" data-w=\"vegetable\">vegetable<\/b> pies, candy floss made of spun <b class=\"vw\" data-w=\"sugar\">sugar<\/b>, a stall that sold no <b class=\"vw\" data-w=\"alcohol\">alcohol<\/b> at all, and a corner where Edward quoted an old <b class=\"vw\" data-w=\"poem\">poem<\/b> until Bella&#x27;s cheeks turned <b class=\"vw\" data-w=\"pink\">pink<\/b>. Jacob, who saw himself as Edward&#x27;s <b class=\"vw\" data-w=\"competitor\">competitor<\/b>, looked annoyingly <b class=\"vw\" data-w=\"confident\">confident<\/b>.<\/p><p>At the <b class=\"vw\" data-w=\"entrance\">entrance<\/b> to the Cullen house, Bella hesitated. A <b class=\"vw\" data-w=\"web\">web<\/b> of lies now surrounded her and Charlie. Edward gave up a <b class=\"vw\" data-w=\"portion\">portion<\/b> of his own safety every time he let her close, but she refused to give up her <b class=\"vw\" data-w=\"independence\">independence<\/b>. He still avoided every <b class=\"vw\" data-w=\"mirror\">mirror<\/b> out of old habit.<\/p>"}, {"tier": "T3", "id": "T3-12", "html": "<p>Bella&#x27;s life now ran on two <b class=\"vw\" data-w=\"parallel\">parallel<\/b> tracks: an ordinary schoolgirl by day, Edward&#x27;s secret by night. She had an <b class=\"vw\" data-w=\"exam\">exam<\/b> on Friday but could barely focus. Edward <b class=\"vw\" data-w=\"regularly\">regularly<\/b> climbed through her window, and nothing seemed to <b class=\"vw\" data-w=\"disturb\">disturb<\/b> his calm except Jacob. Jealousy was close to a <b class=\"vw\" data-w=\"vice\">vice<\/b> for him.<\/p><p>Dating a vampire was, by any normal measure, a <b class=\"vw\" data-w=\"radical\">radical<\/b> choice. Charlie thought she was <b class=\"vw\" data-w=\"crazy\">crazy<\/b> and could <b class=\"vw\" data-w=\"cite\">cite<\/b> a dozen reasons to worry. Perhaps she was <b class=\"vw\" data-w=\"blind\">blind<\/b> to the danger, but what she felt was <b class=\"vw\" data-w=\"pure\">pure<\/b>, and more <b class=\"vw\" data-w=\"mature\">mature<\/b> than people believed. She had no wish to <b class=\"vw\" data-w=\"impress\">impress<\/b> anyone.<\/p><p>Jacob&#x27;s family lived closer to <b class=\"vw\" data-w=\"poverty\">poverty<\/b> than hers, though he never complained. He became an unlikely <b class=\"vw\" data-w=\"ally\">ally<\/b> to the Cullens, and <b class=\"vw\" data-w=\"membership\">membership<\/b> in the pack made him stronger every week. Jasper warned that a <b class=\"vw\" data-w=\"newly\">newly<\/b> made vampire was the most dangerous kind; even a small <b class=\"vw\" data-w=\"quantity\">quantity<\/b> of blood could break its control. Edward kept an <b class=\"vw\" data-w=\"iron\">iron<\/b> grip on his own, and Emmett could <b class=\"vw\" data-w=\"bend\">bend<\/b> a car door with one hand.<\/p><p>Edward could read minds; <b class=\"vw\" data-w=\"similarly\">similarly<\/b>, Alice could see the future. Her timely <b class=\"vw\" data-w=\"intervention\">intervention<\/b>, a vision of the ballet studio, brought Edward there just in time, and each <b class=\"vw\" data-w=\"subsequent\">subsequent<\/b> visit to the Cullen house felt less like danger and more like home. Learning the truth had added a frightening new <b class=\"vw\" data-w=\"dimension\">dimension<\/b> to her life. Jasper could <b class=\"vw\" data-w=\"broadcast\">broadcast<\/b> calm into a room, but he could never <b class=\"vw\" data-w=\"sustain\">sustain<\/b> it while Emmett was being <b class=\"vw\" data-w=\"loud\">loud<\/b>; Edward kept begging him to <b class=\"vw\" data-w=\"behave\">behave<\/b>.<\/p><p>When Edward stepped out of the trees, a <b class=\"vw\" data-w=\"flood\">flood<\/b> of relief hit Bella, and for a moment she <b class=\"vw\" data-w=\"briefly\">briefly<\/b> forgot the <b class=\"vw\" data-w=\"bloody\">bloody<\/b> scene in the ballet studio. He gave her his <b class=\"vw\" data-w=\"jacket\">jacket<\/b>, its cold <b class=\"vw\" data-w=\"smooth\">smooth<\/b> leather oddly comforting. No <b class=\"vw\" data-w=\"infection\">infection<\/b> could ever touch him, and he fought with frightening <b class=\"vw\" data-w=\"efficiency\">efficiency<\/b>. Bella refused to become just another <b class=\"vw\" data-w=\"statistic\">statistic<\/b>. Her jeans were <b class=\"vw\" data-w=\"dirty\">dirty<\/b> from an afternoon in Jacob&#x27;s garage, the <b class=\"vw\" data-w=\"alarm\">alarm<\/b> on her phone was ringing, and she would not <b class=\"vw\" data-w=\"resort\">resort<\/b> to lies today. Esme had baked <b class=\"vw\" data-w=\"bread\">bread<\/b> that no one would eat. Among the Cullens, <b class=\"vw\" data-w=\"gender\">gender<\/b> made no difference: they were all equally dangerous.<\/p>"}, {"tier": "T3", "id": "T3-13", "html": "<p>Bella&#x27;s <b class=\"vw\" data-w=\"discovery\">discovery<\/b> of what Edward really was changed her whole life. She tried to <b class=\"vw\" data-w=\"translate\">translate<\/b> her feelings into words in her journal, clicking her <b class=\"vw\" data-w=\"pen\">pen<\/b> and trying to <b class=\"vw\" data-w=\"edit\">edit<\/b> out the strangest details. Her letters to Renée were only a vague <b class=\"vw\" data-w=\"summary\">summary<\/b> of the truth.<\/p><p>Charlie never openly <b class=\"vw\" data-w=\"criticize\">criticized<\/b> Edward, but his <b class=\"vw\" data-w=\"approval\">approval<\/b> came slowly. He <b class=\"vw\" data-w=\"occasionally\">occasionally<\/b> asked direct questions, and the <b class=\"vw\" data-w=\"frequency\">frequency<\/b> of Edward&#x27;s visits only increased his <b class=\"vw\" data-w=\"resistance\">resistance<\/b>. Edward saw himself as a <b class=\"vw\" data-w=\"burden\">burden<\/b>. He swore he would never <b class=\"vw\" data-w=\"desert\">desert<\/b> Bella and would <b class=\"vw\" data-w=\"apologize\">apologize<\/b> for frightening her, though nothing <b class=\"vw\" data-w=\"entitle\">entitled<\/b> him to make her decisions for her.<\/p><p>Carlisle&#x27;s <b class=\"vw\" data-w=\"philosophy\">philosophy<\/b> was simple: never take a human life. As a <b class=\"vw\" data-w=\"shareholder\">shareholder<\/b> in several companies, he earned enough to support the whole family and made a monthly <b class=\"vw\" data-w=\"deposit\">deposit<\/b> to a children&#x27;s fund. When a local company agreed to <b class=\"vw\" data-w=\"sponsor\">sponsor<\/b> the school baseball team, Carlisle became an <b class=\"vw\" data-w=\"advocate\">advocate<\/b> for a new clinic at the hospital, the one <b class=\"vw\" data-w=\"establishment\">establishment<\/b> in Forks where he had to hide the most.<\/p><p>Alice&#x27;s visions were not always <b class=\"vw\" data-w=\"accurate\">accurate<\/b>, but she could see a <b class=\"vw\" data-w=\"formation\">formation<\/b> of newborns gathering in Seattle. Bella bit her <b class=\"vw\" data-w=\"lip\">lip<\/b> and twisted the top <b class=\"vw\" data-w=\"button\">button<\/b> of her jacket. Her <b class=\"vw\" data-w=\"boot\">boot<\/b> sank into the mud as she followed Edward through the <b class=\"vw\" data-w=\"rough\">rough<\/b> forest. Earlier that year, Jacob had been happy to <b class=\"vw\" data-w=\"lend\">lend<\/b> her his tools while they rebuilt two old motorbikes, which Bella had bought from a neighbour instead of a <b class=\"vw\" data-w=\"dealer\">dealer<\/b>.<\/p><p>Bella came to <b class=\"vw\" data-w=\"attribute\">attribute<\/b> every strange event in Forks to the Cullens. Her <b class=\"vw\" data-w=\"involvement\">involvement<\/b> with them pulled her away from a <b class=\"vw\" data-w=\"conventional\">conventional<\/b> life, and her constant <b class=\"vw\" data-w=\"exposure\">exposure<\/b> to danger worried everyone. She had once dreamed of studying <b class=\"vw\" data-w=\"overseas\">overseas<\/b>. Esme set a <b class=\"vw\" data-w=\"bowl\">bowl<\/b> of fruit on the table that no one touched; Bella searched <b class=\"vw\" data-w=\"digital\">digital<\/b> archives about the legends and ran a hot <b class=\"vw\" data-w=\"bath\">bath<\/b> after every frightening day. In the wolf pack, finding a <b class=\"vw\" data-w=\"mate\">mate<\/b> seemed to happen without warning. It was not a <b class=\"vw\" data-w=\"pleasant\">pleasant<\/b> year, but each night Edward would <b class=\"vw\" data-w=\"tap\">tap<\/b> on her window, and whenever he reached to <b class=\"vw\" data-w=\"grab\">grab<\/b> her hand, she felt safe.<\/p>"}, {"tier": "T3", "id": "T3-14", "html": "<p>After James&#x27;s attack, Bella&#x27;s <b class=\"vw\" data-w=\"recovery\">recovery<\/b> was slow. A thin plastic <b class=\"vw\" data-w=\"tube\">tube<\/b> ran from her arm, and Carlisle — a <b class=\"vw\" data-w=\"consultant\">consultant<\/b> who had chosen to <b class=\"vw\" data-w=\"specialize\">specialize<\/b> in emergency <b class=\"vw\" data-w=\"surgery\">surgery<\/b> — checked on her every hour. She could not recall the <b class=\"vw\" data-w=\"exact\">exact<\/b> moment she had fallen in love with Edward; she only knew it had already happened.<\/p><p>Her head would <b class=\"vw\" data-w=\"spin\">spin<\/b> whenever he appeared beside her. Alice refused to <b class=\"vw\" data-w=\"specify\">specify<\/b> what she had seen, but tension began to <b class=\"vw\" data-w=\"mount\">mount<\/b>. She could <b class=\"vw\" data-w=\"anticipate\">anticipate<\/b> most of James&#x27;s moves and describe <b class=\"vw\" data-w=\"precisely\">precisely<\/b> what would happen, if not when. Bella grew <b class=\"vw\" data-w=\"dependent\">dependent<\/b> on Edward, and a quiet <b class=\"vw\" data-w=\"anxiety\">anxiety<\/b> followed her everywhere. She struggled to <b class=\"vw\" data-w=\"characterize\">characterize<\/b> her feelings as anything close to normal, and a cold <b class=\"vw\" data-w=\"shower\">shower<\/b> did nothing to calm her nerves.<\/p><p>Jacob became Edward&#x27;s <b class=\"vw\" data-w=\"rival\">rival<\/b>, but Edward took no <b class=\"vw\" data-w=\"offense\">offense<\/b> at his insults. Bella&#x27;s senses were too slow to <b class=\"vw\" data-w=\"detect\">detect<\/b> a vampire, and sometimes she felt less like a <b class=\"vw\" data-w=\"teenager\">teenager<\/b> than the only adult in a house full of ancient beings. She could only <b class=\"vw\" data-w=\"admire\">admire<\/b> the way Esme held the family together. There was nothing <b class=\"vw\" data-w=\"moderate\">moderate<\/b> about Edward&#x27;s devotion; he would <b class=\"vw\" data-w=\"wrap\">wrap<\/b> his jacket around her shoulders, and every kiss seemed to <b class=\"vw\" data-w=\"seal\">seal<\/b> a promise.<\/p><p>Edward was a gifted <b class=\"vw\" data-w=\"musician\">musician<\/b>, and Carlisle spoke like a <b class=\"vw\" data-w=\"historian\">historian<\/b> who had lived through centuries. Esme ran a small <b class=\"vw\" data-w=\"charity\">charity<\/b> for the local shelter, and Rosalie longed for an <b class=\"vw\" data-w=\"infant\">infant<\/b> of her own. Emmett seemed to <b class=\"vw\" data-w=\"tower\">tower<\/b> over everyone; he would <b class=\"vw\" data-w=\"dig\">dig<\/b> up old tree stumps and <b class=\"vw\" data-w=\"drag\">drag<\/b> them out of the garden for fun. The urge to protect Bella was almost <b class=\"vw\" data-w=\"universal\">universal<\/b> among the Cullens.<\/p><p>Alice studied every <b class=\"vw\" data-w=\"angle\">angle<\/b> of attack. A single drop of blood could <b class=\"vw\" data-w=\"constitute\">constitute<\/b> a serious danger, and no warning ever felt <b class=\"vw\" data-w=\"adequate\">adequate<\/b>. No <b class=\"vw\" data-w=\"virus\">virus<\/b> could touch a vampire, and nothing about dating one was <b class=\"vw\" data-w=\"illegal\">illegal<\/b>, though it certainly wasn&#x27;t natural. Meanwhile Charlie fried <b class=\"vw\" data-w=\"chicken\">chicken<\/b> for dinner, Billy kept a pack of <b class=\"vw\" data-w=\"cigarette\">cigarettes<\/b> he never smoked, and a bored police <b class=\"vw\" data-w=\"operator\">operator<\/b> took calls about &quot;big dogs&quot; in the woods. Bella did not yet grasp the <b class=\"vw\" data-w=\"significance\">significance<\/b> of the treaty line.<\/p>"}, {"tier": "T3", "id": "T3-15", "html": "<p>Forks High School was not a place of great <b class=\"vw\" data-w=\"ethnic\">ethnic<\/b> diversity, and Bella, newly arrived from Phoenix, felt like an outsider. Her <b class=\"vw\" data-w=\"cousin\">cousin<\/b> in Arizona sent a message warning her that it would rain every day. The weather <b class=\"vw\" data-w=\"forecast\">forecast<\/b> agreed: storms from the <b class=\"vw\" data-w=\"eastern\">eastern<\/b> mountains, with almost no sun at all.<\/p><p>The Cullens seemed to <b class=\"vw\" data-w=\"resist\">resist<\/b> every attempt at friendship. Rosalie and Jasper moved through the halls like <b class=\"vw\" data-w=\"twin\">twin<\/b> shadows, while Edward stared at Bella as if she had done something <b class=\"vw\" data-w=\"stupid\">stupid<\/b>. She soon learned that his sense of smell was <b class=\"vw\" data-w=\"keen\">keen<\/b>, and that his reaction to her was not dislike but hunger. Alice&#x27;s <b class=\"vw\" data-w=\"visual\">visual<\/b> gift made her the family&#x27;s early-warning system, and Carlisle kept a <b class=\"vw\" data-w=\"clinical\">clinical<\/b> calm in every emergency.<\/p><p>Bella had to <b class=\"vw\" data-w=\"adapt\">adapt<\/b> quickly. The old <b class=\"vw\" data-w=\"custom\">custom<\/b> of the Quileute was to tell stories by the fire, and on the <b class=\"vw\" data-w=\"sand\">sand<\/b> at La Push, Jacob pulled his baseball <b class=\"vw\" data-w=\"cap\">cap<\/b> low as he explained the legends. His easy <b class=\"vw\" data-w=\"charm\">charm<\/b> made the story sound like a joke, but Bella did not <b class=\"vw\" data-w=\"dismiss\">dismiss<\/b> it. She researched the subject in a <b class=\"vw\" data-w=\"comprehensive\">comprehensive<\/b> old book. Each <b class=\"vw\" data-w=\"segment\">segment<\/b> of the legend seemed to <b class=\"vw\" data-w=\"correspond\">correspond<\/b> with something she had seen.<\/p><p>Edward&#x27;s <b class=\"vw\" data-w=\"rescue\">rescue<\/b> of her in the car park left her life in a beautiful <b class=\"vw\" data-w=\"mess\">mess<\/b>. She never knew how to <b class=\"vw\" data-w=\"react\">react<\/b> to him, and Charlie&#x27;s stern <b class=\"vw\" data-w=\"lecture\">lecture<\/b> about curfews changed nothing. Their relationship felt like a dangerous <b class=\"vw\" data-w=\"venture\">venture<\/b>, and every new secret seemed to <b class=\"vw\" data-w=\"compound\">compound<\/b> the risk. Edward&#x27;s <b class=\"vw\" data-w=\"preference\">preference<\/b> for shade made sense once she saw sunlight on his skin. Bella needed no <b class=\"vw\" data-w=\"incentive\">incentive<\/b> to keep his secret. When he joked that she was out of his <b class=\"vw\" data-w=\"league\">league<\/b>, she laughed.<\/p><p>A silent <b class=\"vw\" data-w=\"dialog\">dialog<\/b> passed between Edward and Jasper; Alice&#x27;s warning was <b class=\"vw\" data-w=\"prompt\">prompt<\/b> but left only a narrow <b class=\"vw\" data-w=\"margin\">margin<\/b> of safety. Something dangerous waited <b class=\"vw\" data-w=\"beneath\">beneath<\/b> the town&#x27;s quiet surface. James treated Edward like an exciting <b class=\"vw\" data-w=\"opponent\">opponent<\/b>, and Bella never understood his <b class=\"vw\" data-w=\"capability\">capability<\/b> for violence until he arrived. Her heart beat at a <b class=\"vw\" data-w=\"rapid\">rapid<\/b> pace. Edward tried to <b class=\"vw\" data-w=\"cancel\">cancel<\/b> their plans, sure that he would <b class=\"vw\" data-w=\"regret\">regret<\/b> it; his certainty felt <b class=\"vw\" data-w=\"absolute\">absolute<\/b>. Later, sitting in the <b class=\"vw\" data-w=\"cream\">cream<\/b>-coloured living room, he would <b class=\"vw\" data-w=\"stroke\">stroke<\/b> her hair until she fell asleep.<\/p>"}, {"tier": "T4", "id": "T4-01", "html": "<p>Bella&#x27;s parents&#x27; <b class=\"vw\" data-w=\"divorce\">divorce<\/b> was the reason she ended up in Forks. The constant rain was enough to <b class=\"vw\" data-w=\"depress\">depress<\/b> anyone, and the old <b class=\"vw\" data-w=\"motor\">motor<\/b> of her truck rattled loudly enough to announce her from a mile away; Charlie joked that any <b class=\"vw\" data-w=\"buyer\">buyer<\/b> would need more patience than sense. On the coldest nights he burned <b class=\"vw\" data-w=\"coal\">coal<\/b> in the old stove.<\/p><p>Edward had a <b class=\"vw\" data-w=\"tendency\">tendency<\/b> to disappear whenever he decided she would be better off without him. He wished he could <b class=\"vw\" data-w=\"rid\">rid<\/b> her life of danger and called himself a <b class=\"vw\" data-w=\"slave\">slave<\/b> to his thirst. Carlisle offered quiet <b class=\"vw\" data-w=\"counsel\">counsel<\/b>: &quot;You can&#x27;t <b class=\"vw\" data-w=\"bury\">bury<\/b> the truth forever.&quot; Bella&#x27;s <b class=\"vw\" data-w=\"awareness\">awareness<\/b> of the supernatural grew sharper every week, and she began keeping a <b class=\"vw\" data-w=\"journal\">journal<\/b>, though she never wrote down the parts that mattered.<\/p><p>The Cullens looked like any other <b class=\"vw\" data-w=\"wealthy\">wealthy<\/b> family. The <b class=\"vw\" data-w=\"architecture\">architecture<\/b> of their house was all glass and clean lines, an <b class=\"vw\" data-w=\"impressive\">impressive<\/b> sight in a <b class=\"vw\" data-w=\"valley\">valley<\/b> so hidden that few people could find it. Charlie found it barely <b class=\"vw\" data-w=\"acceptable\">acceptable<\/b> that Edward climbed through windows, and Bella would never <b class=\"vw\" data-w=\"dare\">dare<\/b> ask his <b class=\"vw\" data-w=\"permission\">permission<\/b>. She gripped the porch <b class=\"vw\" data-w=\"rail\">rail<\/b> and watched for headlights.<\/p><p>James threatened to <b class=\"vw\" data-w=\"ruin\">ruin<\/b> everything. His attack was not a <b class=\"vw\" data-w=\"random\">random<\/b> act of violence, and Bella&#x27;s <b class=\"vw\" data-w=\"survival\">survival<\/b> felt like a miracle. No <b class=\"vw\" data-w=\"visible\">visible<\/b> injury remained, and no medical <b class=\"vw\" data-w=\"measurement\">measurement<\/b> could explain how fast she healed. Rosalie&#x27;s temper would <b class=\"vw\" data-w=\"burst\">burst<\/b> without warning, and the treaty line was a <b class=\"vw\" data-w=\"barrier\">barrier<\/b> neither side would cross. Bella and Edward&#x27;s <b class=\"vw\" data-w=\"mutual\">mutual<\/b> fascination had drawn them together long before either admitted it.<\/p><p>Charlie thought she must be <b class=\"vw\" data-w=\"mad\">mad<\/b> to trust Edward so completely. Edward could <b class=\"vw\" data-w=\"counter\">counter<\/b> her arguments before she finished them and seemed to <b class=\"vw\" data-w=\"possess\">possess<\/b> endless patience; <b class=\"vw\" data-w=\"frequent\">frequent<\/b> trips to the hospital became almost normal. As the police chief&#x27;s daughter, Bella had never thought of safety as a <b class=\"vw\" data-w=\"privilege\">privilege<\/b>. The air felt <b class=\"vw\" data-w=\"electric\">electric<\/b> when his cold hand brushed hers, and her view of the world had <b class=\"vw\" data-w=\"greatly\">greatly<\/b> changed. She watched the slow <b class=\"vw\" data-w=\"evolution\">evolution<\/b> of her fear into acceptance, though nothing about his <b class=\"vw\" data-w=\"violent\">violent<\/b> world showed in his calm face. The old book of legends offered no <b class=\"vw\" data-w=\"illustration\">illustration<\/b> of what she would find, and Alice <b class=\"vw\" data-w=\"successfully\">successfully<\/b> hid her darkest visions. At La Push, Bella let herself <b class=\"vw\" data-w=\"float\">float<\/b> on her back in the cold sea, and for once she was not afraid.<\/p>"}, {"tier": "T4", "id": "T4-02", "html": "<p>Charlie&#x27;s <b class=\"vw\" data-w=\"promotion\">promotion<\/b> to police chief had not changed his simple life. He still joked about the <b class=\"vw\" data-w=\"mortgage\">mortgage<\/b> on the little house, added too much <b class=\"vw\" data-w=\"salt\">salt<\/b> to everything he cooked and preferred fishing to <b class=\"vw\" data-w=\"golf\">golf<\/b>. The house seemed to collect <b class=\"vw\" data-w=\"dust\">dust<\/b> faster than Bella could clean it. Charlie rarely gave <b class=\"vw\" data-w=\"praise\">praise<\/b> out loud, but she could see it in his eyes.<\/p><p>The wedding <b class=\"vw\" data-w=\"announcement\">announcement<\/b> spread through Forks faster than Bella could brace herself for it. Alice insisted every event deserved a <b class=\"vw\" data-w=\"celebration\">celebration<\/b> and planned the day down to the <b class=\"vw\" data-w=\"format\">format<\/b> of the seating chart. Bella&#x27;s mother sent her an old <b class=\"vw\" data-w=\"skirt\">skirt<\/b> that did not suit the weather; Alice, who had once travelled through a cold northern <b class=\"vw\" data-w=\"province\">province<\/b> of Canada, quietly replaced it. Rosalie talked about an <b class=\"vw\" data-w=\"opera\">opera<\/b> she had seen decades ago.<\/p><p>Edward&#x27;s <b class=\"vw\" data-w=\"passion\">passion<\/b> for Bella frightened him more than any enemy. His <b class=\"vw\" data-w=\"classical\">classical<\/b> piano filled the house, and a single <b class=\"vw\" data-w=\"glance\">glance<\/b> from him made her heart <b class=\"vw\" data-w=\"pump\">pump<\/b> twice as hard. He let rules <b class=\"vw\" data-w=\"govern\">govern<\/b> his every move, because her scent was a <b class=\"vw\" data-w=\"weakness\">weakness<\/b> he fought every day. Bella chose to <b class=\"vw\" data-w=\"embrace\">embrace<\/b> the danger. She pressed a hand to her <b class=\"vw\" data-w=\"chest\">chest<\/b> to slow her heart as he let his fingers <b class=\"vw\" data-w=\"brush\">brush<\/b> hers, and her clumsiness never failed to <b class=\"vw\" data-w=\"embarrass\">embarrass<\/b> her.<\/p><p>Carlisle&#x27;s <b class=\"vw\" data-w=\"laboratory\">laboratory<\/b> held equipment no ordinary doctor would need. He wondered whether a <b class=\"vw\" data-w=\"genetic\">genetic<\/b> quirk explained Bella&#x27;s resistance to Edward&#x27;s gift, and his <b class=\"vw\" data-w=\"evaluation\">evaluation<\/b> of her injuries was calmer than any human doctor&#x27;s. Paul&#x27;s <b class=\"vw\" data-w=\"aggressive\">aggressive<\/b> temper made him the last wolf Bella wanted near her. Emmett called himself the arm-wrestling <b class=\"vw\" data-w=\"champion\">champion<\/b> of the family, and the unspoken <b class=\"vw\" data-w=\"contest\">contest<\/b> between Jacob and Edward exhausted her.<\/p><p>Bella watched Jacob <b class=\"vw\" data-w=\"march\">march<\/b> across the yard and shove the door open <b class=\"vw\" data-w=\"roughly\">roughly<\/b>. &quot;I&#x27;m not doing this for <b class=\"vw\" data-w=\"compensation\">compensation<\/b>,&quot; he said. &quot;I&#x27;m doing it because I care.&quot; Their <b class=\"vw\" data-w=\"compromise\">compromise<\/b> satisfied no one. The fear of losing Bella could <b class=\"vw\" data-w=\"motivate\">motivate<\/b> Edward to break every rule, and Alice chose to <b class=\"vw\" data-w=\"dedicate\">dedicate<\/b> herself to keeping her safe, determined to <b class=\"vw\" data-w=\"accomplish\">accomplish<\/b> what no vision showed clearly. Bella wondered whether becoming a vampire would <b class=\"vw\" data-w=\"fulfill\">fulfill<\/b> her. The Cullens kept a <b class=\"vw\" data-w=\"silent\">silent<\/b> <b class=\"vw\" data-w=\"gallery\">gallery<\/b> of paintings collected over a century; Bella&#x27;s own <b class=\"vw\" data-w=\"literary\">literary<\/b> taste ran to worn paperbacks, and she sometimes imagined a <b class=\"vw\" data-w=\"publisher\">publisher<\/b> printing a story just like hers.<\/p>"}, {"tier": "T4", "id": "T4-03", "html": "<p>The Cullen house sat in a <b class=\"vw\" data-w=\"remote\">remote<\/b> clearing that no map seemed to show. Hospital <b class=\"vw\" data-w=\"personnel\">personnel<\/b> never asked why Dr Cullen looked barely older than his patients; he treated medicine less as a <b class=\"vw\" data-w=\"profession\">profession<\/b> than as a lifelong duty. The family <b class=\"vw\" data-w=\"fortune\">fortune<\/b> had been built over a century.<\/p><p>Bella&#x27;s <b class=\"vw\" data-w=\"friendship\">friendship<\/b> with Jacob survived more than either of them expected, even though he saw everything as werewolf <b class=\"vw\" data-w=\"versus\">versus<\/b> vampire. Edward could <b class=\"vw\" data-w=\"literally\">literally<\/b> hear every thought in a room except hers, while Jasper&#x27;s <b class=\"vw\" data-w=\"insight\">insight<\/b> into emotion told him more than words ever could. Edward&#x27;s smallest <b class=\
