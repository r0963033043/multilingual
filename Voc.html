d how <b class=\"vw\" data-w=\"nationalism\">nationalism<\/b> helped cause the First World War. The line between <b class=\"vw\" data-w=\"myth\">myth<\/b> and reality blurred.<\/p><p>Bella tried to <b class=\"vw\" data-w=\"absorb\">absorb<\/b> everything Edward told her. Carlisle had once lived among <b class=\"vw\" data-w=\"peasant\">peasant<\/b> villagers in Europe. Alice kept a <b class=\"vw\" data-w=\"sketch\">sketch<\/b> of the wedding dress hidden, and Edward searched for some <b class=\"vw\" data-w=\"justification\">justification<\/b> to leave and found none. A single human <b class=\"vw\" data-w=\"lifetime\">lifetime<\/b> felt short. Bella&#x27;s choice never felt as <b class=\"vw\" data-w=\"binary\">binary<\/b> as people thought, but she wanted a <b class=\"vw\" data-w=\"definite\">definite<\/b> answer. The <b class=\"vw\" data-w=\"contour\">contour<\/b> of the mountains stayed familiar, and the <b class=\"vw\" data-w=\"rhythm\">rhythm<\/b> of Edward&#x27;s piano was the sound she missed most. The <b class=\"vw\" data-w=\"ultimate\">ultimate<\/b> choice was always hers. No <b class=\"vw\" data-w=\"dictionary\">dictionary<\/b> could have prepared her for the words of a new world.<\/p><p>Alice found a single <b class=\"vw\" data-w=\"strand\">strand<\/b> of Bella&#x27;s hair. Nothing could <b class=\"vw\" data-w=\"unify\">unify<\/b> the wolves and the Cullens faster than a shared enemy. Alice&#x27;s visions arrived <b class=\"vw\" data-w=\"randomly\">randomly<\/b>. Edward argued like a <b class=\"vw\" data-w=\"philosopher\">philosopher<\/b> about souls, and Bella could barely <b class=\"vw\" data-w=\"pronounce\">pronounce<\/b> her vows. Emmett kept a <b class=\"vw\" data-w=\"workshop\">workshop<\/b> in the garage; Charlie preferred <b class=\"vw\" data-w=\"manual\">manual<\/b> work to talking about feelings, and bought <b class=\"vw\" data-w=\"wheat\">wheat<\/b> bread on the way home. Charlie&#x27;s only real <b class=\"vw\" data-w=\"objection\">objection<\/b> to Edward was one he couldn&#x27;t put into words. Bella felt her whole future had to <b class=\"vw\" data-w=\"rewrite\">rewrite<\/b> itself overnight.<\/p>"}, {"tier": "AWL", "id": "AWL-F13", "html": "<p>Carlisle had watched entire waves of <b class=\"vw\" data-w=\"civilization\">civilization<\/b> rise and fall. His faint <b class=\"vw\" data-w=\"accent\">accent<\/b> hinted at a life lived long before Forks existed, and he joked that after three centuries he had become an amateur <b class=\"vw\" data-w=\"theorist\">theorist<\/b> on vampire biology. He remained the most <b class=\"vw\" data-w=\"influential\">influential<\/b> voice in every family decision.<\/p><p>No doctor could <b class=\"vw\" data-w=\"diagnose\">diagnose<\/b> what was happening to Bella during her pregnancy. Carlisle tried to <b class=\"vw\" data-w=\"clarify\">clarify<\/b> what the transformation would involve, but no <b class=\"vw\" data-w=\"replication\">replication<\/b> of the venom&#x27;s effects had ever been recorded. No <b class=\"vw\" data-w=\"bacterial\">bacterial<\/b> infection could touch a vampire. He advised Charlie to eat less <b class=\"vw\" data-w=\"sodium\">sodium<\/b>, and nobody could <b class=\"vw\" data-w=\"accurately\">accurately<\/b> predict how Bella&#x27;s body would react. Her change began to <b class=\"vw\" data-w=\"accelerate\">accelerate<\/b> faster than he expected, and the newborn army&#x27;s numbers grew at an <b class=\"vw\" data-w=\"exponential\">exponential<\/b> rate. The <b class=\"vw\" data-w=\"progression\">progression<\/b> of her illness alarmed him.<\/p><p>Bella&#x27;s high school <b class=\"vw\" data-w=\"curriculum\">curriculum<\/b> felt ordinary next to what she learned at home. She struggled to give Charlie a <b class=\"vw\" data-w=\"coherent\">coherent<\/b> explanation for her exhaustion. The school decided to <b class=\"vw\" data-w=\"standardize\">standardize<\/b> its exams. Bella was never <b class=\"vw\" data-w=\"socially\">socially<\/b> comfortable, and she never worried about a <b class=\"vw\" data-w=\"scholarship\">scholarship<\/b>. The strange <b class=\"vw\" data-w=\"displacement\">displacement<\/b> she felt after moving faded when she met Edward. Her moods swung in a constant <b class=\"vw\" data-w=\"oscillation\">oscillation<\/b> between fear and determination.<\/p><p>Edward&#x27;s <b class=\"vw\" data-w=\"admission\">admission<\/b> that he watched her sleep thrilled and frightened her. Charlie was <b class=\"vw\" data-w=\"positively\">positively<\/b> sure Edward was hiding something. Bella joked that her clumsiness was less a <b class=\"vw\" data-w=\"deficiency\">deficiency<\/b> than a permanent condition, and wondered whether her fear was even <b class=\"vw\" data-w=\"legitimate\">legitimate<\/b>. Alice was a true <b class=\"vw\" data-w=\"sophisticate\">sophisticate<\/b>. Edward <b class=\"vw\" data-w=\"formally\">formally<\/b> asked Charlie&#x27;s permission, and <b class=\"vw\" data-w=\"interestingly\">interestingly<\/b>, Bella&#x27;s blood called to Edward far more strongly than to anyone else — she was his &quot;singer&quot;. Edward and Jasper seemed to communicate on a <b class=\"vw\" data-w=\"wavelength\">wavelength<\/b> no one else could follow.<\/p><p>Forks was <b class=\"vw\" data-w=\"predominantly\">predominantly<\/b> grey and wet. The power <b class=\"vw\" data-w=\"grid\">grid<\/b> flickered during winter storms, and the river <b class=\"vw\" data-w=\"basin\">basin<\/b> near the Cullen house often flooded. Emmett once wrapped an engine <b class=\"vw\" data-w=\"cylinder\">cylinder<\/b> around a tree to make Rosalie laugh. Edward&#x27;s skin in sunlight looked like scattered <b class=\"vw\" data-w=\"crystal\">crystal<\/b>. Jasper could <b class=\"vw\" data-w=\"manipulate\">manipulate<\/b> the mood of a room, and the uneasy <b class=\"vw\" data-w=\"alliance\">alliance<\/b> between wolves and vampires held because of Bella. Her <b class=\"vw\" data-w=\"impulse\">impulse<\/b> to protect Charlie outweighed her fear. The wedding felt <b class=\"vw\" data-w=\"meaningful\">meaningful<\/b>. Bella had stepped into a <b class=\"vw\" data-w=\"realm\">realm<\/b> most humans never suspected; <b class=\"vw\" data-w=\"importantly\">importantly<\/b>, the <b class=\"vw\" data-w=\"essence\">essence<\/b> of who she was never changed.<\/p>"}, {"tier": "AWL", "id": "AWL-F14", "html": "<p>Carlisle&#x27;s study held a <b class=\"vw\" data-w=\"stack\">stack<\/b> of journals older than any human alive, and his office was full of <b class=\"vw\" data-w=\"artifact\">artifact<\/b> after artifact. He joked that at his age he should count as a <b class=\"vw\" data-w=\"fossil\">fossil<\/b>. He gave Bella a gentle <b class=\"vw\" data-w=\"primer\">primer<\/b> on vampire history, and his medical <b class=\"vw\" data-w=\"terminology\">terminology<\/b> slipped into ordinary conversations. He once helped a student with a <b class=\"vw\" data-w=\"dissertation\">dissertation<\/b> on the history of Forks.<\/p><p>At his small <b class=\"vw\" data-w=\"clinic\">clinic<\/b>, he worked with <b class=\"vw\" data-w=\"surgical\">surgical<\/b> calm. He explained that some people are <b class=\"vw\" data-w=\"carrier\">carriers<\/b> of a disease without showing symptoms, and that water is made of <b class=\"vw\" data-w=\"hydrogen\">hydrogen<\/b> and oxygen. Bella&#x27;s <b class=\"vw\" data-w=\"metabolism\">metabolism<\/b> changed completely after the transformation, and her body proved surprisingly <b class=\"vw\" data-w=\"resistant\">resistant<\/b> to its worst effects. Newborns were especially <b class=\"vw\" data-w=\"susceptible\">susceptible<\/b> to their own thirst. Edward once tried to explain venom using <b class=\"vw\" data-w=\"quantum\">quantum<\/b> theory and lost her completely.<\/p><p>Jasper had to <b class=\"vw\" data-w=\"allocate\">allocate<\/b> every fighter carefully and <b class=\"vw\" data-w=\"execute\">execute<\/b> the plan without hesitation. The <b class=\"vw\" data-w=\"coordination\">coordination<\/b> between wolves and vampires was better than anyone expected. The <b class=\"vw\" data-w=\"bulk\">bulk<\/b> of the newborn army moved together, blind with thirst. Thick <b class=\"vw\" data-w=\"vegetation\">vegetation<\/b> surrounded the clearing. Alice tried to <b class=\"vw\" data-w=\"conserve\">conserve<\/b> her energy for visions that mattered. The Volturi treated any broken law as deserving <b class=\"vw\" data-w=\"punishment\">punishment<\/b>, and Aro&#x27;s calm <b class=\"vw\" data-w=\"rhetoric\">rhetoric<\/b> made his threats worse.<\/p><p>Vampire covens <b class=\"vw\" data-w=\"traditionally\">traditionally<\/b> avoided humans, and <b class=\"vw\" data-w=\"broadly\">broadly<\/b> speaking, vampires avoided sunlight for secrecy, not safety. Carlisle&#x27;s <b class=\"vw\" data-w=\"revolutionary\">revolutionary<\/b> approach to living among humans changed everything. He tried to <b class=\"vw\" data-w=\"reconstruct\">reconstruct<\/b> how the treaty began, and his <b class=\"vw\" data-w=\"intensive\">intensive<\/b> research filled every spare hour. Bella found herself in a love <b class=\"vw\" data-w=\"triangle\">triangle<\/b> with Edward and Jacob, but the <b class=\"vw\" data-w=\"dilemma\">dilemma<\/b> was never what people thought. Sacrifice became the quiet <b class=\"vw\" data-w=\"motif\">motif<\/b> beneath her choices, and no one could question her <b class=\"vw\" data-w=\"motive\">motive<\/b>. Edward&#x27;s protectiveness was rarely <b class=\"vw\" data-w=\"subtle\">subtle<\/b>.<\/p><p>The first year of their relationship was <b class=\"vw\" data-w=\"turbulent\">turbulent<\/b>. Bella struggled to <b class=\"vw\" data-w=\"grasp\">grasp<\/b> what becoming a vampire meant. A single <b class=\"vw\" data-w=\"ray\">ray<\/b> of sunlight kept Edward indoors. Her thoughts would <b class=\"vw\" data-w=\"drift\">drift<\/b> toward the future, and her old life began to <b class=\"vw\" data-w=\"merge\">merge<\/b> with the new one. Renesmee&#x27;s room felt like a <b class=\"vw\" data-w=\"nest\">nest<\/b> before she was born. Alice&#x27;s visions felt almost three-<b class=\"vw\" data-w=\"dimensional\">dimensional<\/b>, and the river&#x27;s <b class=\"vw\" data-w=\"sediment\">sediment<\/b> stirred whenever Jacob crossed near the line.<\/p>"}, {"tier": "AWL", "id": "AWL-F15", "html": "<p>Esme had once dreamed of being an <b class=\"vw\" data-w=\"architect\">architect<\/b>. Edward was a gifted musician, and he once recited a <b class=\"vw\" data-w=\"quotation\">quotation<\/b> from an old poem to make Bella smile. Their family felt like a <b class=\"vw\" data-w=\"composite\">composite<\/b> of loyalty, secrecy and love. <b class=\"vw\" data-w=\"historically\">Historically<\/b>, vampires and werewolves had never trusted each other, and the vampire world was <b class=\"vw\" data-w=\"politically\">politically<\/b> divided long before Bella arrived.<\/p><p>Charlie&#x27;s doctor warned him that his diet could lead to <b class=\"vw\" data-w=\"coronary\">coronary<\/b> heart disease. Edward had to <b class=\"vw\" data-w=\"inject\">inject<\/b> venom straight into Bella&#x27;s heart to save her. Carlisle held a quiet <b class=\"vw\" data-w=\"consultation\">consultation<\/b> with the other doctors about her recovery, and his medical <b class=\"vw\" data-w=\"expertise\">expertise<\/b> made him invaluable. Even the <b class=\"vw\" data-w=\"elementary\">elementary<\/b> rules of vampire life took Bella months to learn. Her biology <b class=\"vw\" data-w=\"textbook\">textbook<\/b> felt useless.<\/p><p>Jacob feared a complete <b class=\"vw\" data-w=\"breakdown\">breakdown<\/b> of the treaty. The Volturi&#x27;s arrival felt like a slow <b class=\"vw\" data-w=\"invasion\">invasion<\/b>, and Bella&#x27;s choice <b class=\"vw\" data-w=\"inevitably\">inevitably<\/b> led toward danger. Aro saw himself as the rightful <b class=\"vw\" data-w=\"ruler\">ruler<\/b> of every vampire, and Carlisle had to <b class=\"vw\" data-w=\"intervene\">intervene<\/b> before Jacob and Edward fought. Edward&#x27;s <b class=\"vw\" data-w=\"momentum\">momentum<\/b> carried him across the clearing in a blink. The pack would <b class=\"vw\" data-w=\"rotate\">rotate<\/b> their patrols every night. Every rumour about the Cullens seemed to <b class=\"vw\" data-w=\"multiply\">multiply<\/b> after Bella arrived. Their two worlds felt as <b class=\"vw\" data-w=\"polar\">polar<\/b> as sunlight and shadow.<\/p><p>Charlie once joked that no <b class=\"vw\" data-w=\"economist\">economist<\/b> could explain the Cullens&#x27; wealth. Rosalie mocked the idea that <b class=\"vw\" data-w=\"capitalism\">capitalism<\/b> could explain it, and no <b class=\"vw\" data-w=\"capitalist\">capitalist<\/b> scheme ever did. Secrecy was their most valuable <b class=\"vw\" data-w=\"commodity\">commodity<\/b>. Alice arrived with a <b class=\"vw\" data-w=\"bundle\">bundle<\/b> of new clothes. Jacob refused to feel <b class=\"vw\" data-w=\"inferior\">inferior<\/b>. Alice <b class=\"vw\" data-w=\"actively\">actively<\/b> searched the future for danger, and Jasper&#x27;s <b class=\"vw\" data-w=\"flexibility\">flexibility<\/b> in tense moments kept the newborns calm. Carlisle&#x27;s <b class=\"vw\" data-w=\"morality\">morality<\/b> shaped every rule, but Edward was rarely <b class=\"vw\" data-w=\"communicative\">communicative<\/b> about his fears.<\/p><p>Forks was famous for its endless <b class=\"vw\" data-w=\"rainfall\">rainfall<\/b>. Bella was <b class=\"vw\" data-w=\"physically\">physically<\/b> drawn to Edward in a way she could not explain, and she tried to stay <b class=\"vw\" data-w=\"realistic\">realistic<\/b> about the danger. Her transformation felt like a brutal <b class=\"vw\" data-w=\"initiation\">initiation<\/b>. Edward watched the <b class=\"vw\" data-w=\"horizon\">horizon<\/b> as if danger might appear, and the cabin&#x27;s <b class=\"vw\" data-w=\"elevation\">elevation<\/b> gave them a view over the valley. The old <b class=\"vw\" data-w=\"cord\">cord<\/b> of the porch light swayed outside Charlie&#x27;s house. Once she trusted Edward fully, Bella spoke <b class=\"vw\" data-w=\"freely\">freely<\/b>. He tried to <b class=\"vw\" data-w=\"compensate\">compensate<\/b> for his absence with a promise he meant to keep. Bella glanced <b class=\"vw\" data-w=\"backward\">backward<\/b> over her shoulder, sure someone was following her.<\/p>"}, {"tier": "AWL", "id": "AWL-F16", "html": "<p>In physics, Bella learned about <b class=\"vw\" data-w=\"gravity\">gravity<\/b>, and Edward teased that even a <b class=\"vw\" data-w=\"proton\">proton<\/b> moved slower than his reflexes. No law of <b class=\"vw\" data-w=\"physics\">physics<\/b> explained how gracefully the Cullens moved. At the <b class=\"vw\" data-w=\"atomic\">atomic<\/b> level, she imagined, Edward&#x27;s body must be strangely still. The old lab held jars of <b class=\"vw\" data-w=\"phosphate\">phosphate<\/b> no one used anymore. Bella once considered studying <b class=\"vw\" data-w=\"anthropology\">anthropology<\/b> because of Jacob&#x27;s legends.<\/p><p>Carlisle wondered whether <b class=\"vw\" data-w=\"genetics\">genetics<\/b> alone could explain Renesmee&#x27;s growth. Jacob&#x27;s <b class=\"vw\" data-w=\"ancestor\">ancestors<\/b> were the first Quileute wolves. Vampires had no <b class=\"vw\" data-w=\"respiratory\">respiratory<\/b> need, though they still breathed out of habit. No <b class=\"vw\" data-w=\"antibiotic\">antibiotic<\/b> could cure what was killing Bella from inside. With Carlisle away hunting, Edward and Rosalie fought to <b class=\"vw\" data-w=\"stabilize\">stabilize<\/b> her after the birth; for weeks before, Carlisle had searched for any <b class=\"vw\" data-w=\"viable\">viable<\/b> way to save both mother and child. Emmett joked that losing a <b class=\"vw\" data-w=\"limb\">limb<\/b> barely counted as an injury. Venom began to <b class=\"vw\" data-w=\"circulate\">circulate<\/b> the instant Edward bit.<\/p><p>The Volturi favoured the <b class=\"vw\" data-w=\"elimination\">elimination<\/b> of any threat and considered any leak of secrets a <b class=\"vw\" data-w=\"gross\">gross<\/b> violation. <b class=\"vw\" data-w=\"corruption\">Corruption<\/b> behind Carlisle&#x27;s quiet authority was unthinkable. Alice&#x27;s visions were often <b class=\"vw\" data-w=\"obscure\">obscure<\/b>, and Jacob&#x27;s warnings seemed to <b class=\"vw\" data-w=\"contradict\">contradict<\/b> what Bella wanted to believe. Charlie tried not to <b class=\"vw\" data-w=\"interfere\">interfere<\/b>. The attack left a quiet <b class=\"vw\" data-w=\"trauma\">trauma<\/b> that lasted long after her body healed. Edward carried her <b class=\"vw\" data-w=\"upward\">upward<\/b> through the trees. In history class they discussed how <b class=\"vw\" data-w=\"slavery\">slavery<\/b> was abolished, and an old chapter on <b class=\"vw\" data-w=\"communist\">communist<\/b> history meant nothing next to her real life. Alice once suggested fleeing to another <b class=\"vw\" data-w=\"continent\">continent<\/b>.<\/p><p>Bella refused to believe the <b class=\"vw\" data-w=\"stereotype\">stereotype<\/b> that all vampires were killers. Edward&#x27;s mind-reading <b class=\"vw\" data-w=\"faculty\">faculty<\/b> made secrets impossible, and he clung to <b class=\"vw\" data-w=\"rationality\">rationality<\/b> even when jealousy pulled at him. Bella didn&#x27;t <b class=\"vw\" data-w=\"presume\">presume<\/b> to understand vampire law. Jacob raced to <b class=\"vw\" data-w=\"retrieve\">retrieve<\/b> her before the newborns arrived. Esme&#x27;s <b class=\"vw\" data-w=\"artistic\">artistic<\/b> touch made every house feel alive, and the paintings seemed to <b class=\"vw\" data-w=\"portray\">portray<\/b> centuries Bella could barely imagine.<\/p><p>What once felt <b class=\"vw\" data-w=\"trivial\">trivial<\/b> now mattered. Jacob never softened his <b class=\"vw\" data-w=\"stance\">stance<\/b> against the Cullens. A <b class=\"vw\" data-w=\"profound\">profound<\/b> calm settled over her when Edward held her hand. They built a fragile system <b class=\"vw\" data-w=\"whereby\">whereby<\/b> humans and vampires could live side by side. Jacob stood at the opposite <b class=\"vw\" data-w=\"pole\">pole<\/b> from Edward. Her safety was a <b class=\"vw\" data-w=\"puzzle\">puzzle<\/b> Edward could never solve, and she searched for any <b class=\"vw\" data-w=\"exit\">exit<\/b> from her tangled loyalties. Her new eyes noticed <b class=\"vw\" data-w=\"optical\">optical<\/b> details, like rainbows in every raindrop.<\/p>"}, {"tier": "AWL", "id": "AWL-F17", "html": "<p>Carlisle had studied <b class=\"vw\" data-w=\"epidemiology\">epidemiology<\/b>, the science of how diseases spread, and he reminded the nurses that <b class=\"vw\" data-w=\"hepatitis\">hepatitis<\/b> can pass through contaminated blood. An <b class=\"vw\" data-w=\"epidemic\">epidemic<\/b> of fear spread through Forks after the attacks began. He once wished a heart <b class=\"vw\" data-w=\"transplant\">transplant<\/b> could have saved Bella in the ordinary way; instead, he explained gently that a failing <b class=\"vw\" data-w=\"kidney\">kidney<\/b> was the least of her problems. The venom&#x27;s fire was worse than any <b class=\"vw\" data-w=\"fever\">fever<\/b>, and human <b class=\"vw\" data-w=\"fatigue\">fatigue<\/b> was something she would never feel again.<\/p><p>The health class covered <b class=\"vw\" data-w=\"sexuality\">sexuality<\/b>, nutrition and mental health, though no <b class=\"vw\" data-w=\"psychologist\">psychologist<\/b> could have explained what Bella felt that year. Even Charlie could sense the <b class=\"vw\" data-w=\"chemistry\">chemistry<\/b> between her and Edward. Carlisle lived by one <b class=\"vw\" data-w=\"axiom\">axiom<\/b>: control matters more than hunger. He once experimented with a <b class=\"vw\" data-w=\"synthetic\">synthetic<\/b> substitute for blood, without success. Jasper, who had trained newborn armies in the South, could still remember each recruit <b class=\"vw\" data-w=\"individually\">individually<\/b>. No infection could touch them, but Alice&#x27;s laughter was <b class=\"vw\" data-w=\"infectious\">infectious<\/b>.<\/p><p>The old <b class=\"vw\" data-w=\"treaty\">treaty<\/b> between the Quileute and the Cullens had never been truly tested. It was a fragile <b class=\"vw\" data-w=\"bargain\">bargain<\/b>, and the pack feared that any <b class=\"vw\" data-w=\"fracture\">fracture<\/b> could mean war. Jacob joked that to the Cullens, wolves were just a <b class=\"vw\" data-w=\"pest\">pest<\/b>. Edward warned Bella early that she was walking beside a natural <b class=\"vw\" data-w=\"predator\">predator<\/b>. Jacob was a natural <b class=\"vw\" data-w=\"mechanic\">mechanic<\/b>, and his body needed no <b class=\"vw\" data-w=\"rehabilitation\">rehabilitation<\/b> after wounds that would kill a man. Emmett could lift a <b class=\"vw\" data-w=\"ton\">ton<\/b> of rock as easily as she lifted a book.<\/p><p>The Cullens rarely bought ordinary <b class=\"vw\" data-w=\"goods\">goods<\/b>. Edward promised he would return <b class=\"vw\" data-w=\"shortly\">shortly<\/b>. Their romance felt like an <b class=\"vw\" data-w=\"inversion\">inversion<\/b> of every fairy tale, and every human worry seemed <b class=\"vw\" data-w=\"irrelevant\">irrelevant<\/b>. Her fear seemed to <b class=\"vw\" data-w=\"dissolve\">dissolve<\/b> when he held her. The danger was real; <b class=\"vw\" data-w=\"nonetheless\">nonetheless<\/b>, she refused to run. Bella kept a <b class=\"vw\" data-w=\"diary\">diary<\/b> of that year. Her ordinary life had always been something of an <b class=\"vw\" data-w=\"illusion\">illusion<\/b>. A single <b class=\"vw\" data-w=\"bat\">bat<\/b> flew overhead as she walked through the dark forest, and Alice always knew the <b class=\"vw\" data-w=\"optimum\">optimum<\/b> moment to step in.<\/p><p>Loving a vampire was the greatest <b class=\"vw\" data-w=\"paradox\">paradox<\/b> of her life. The Cullens had learned to <b class=\"vw\" data-w=\"migrate\">migrate<\/b> quietly every few years. Forever sounded like <b class=\"vw\" data-w=\"infinity\">infinity<\/b>, terrifying and beautiful. Jacob accused Edward of loving only her <b class=\"vw\" data-w=\"shallow\">shallow<\/b> human beauty, though he knew it wasn&#x27;t true; Bella believed Edward was <b class=\"vw\" data-w=\"fundamentally\">fundamentally<\/b> good. Forks felt like its own small <b class=\"vw\" data-w=\"bubble\">bubble<\/b>. The old farmland near La Push still relied on simple <b class=\"vw\" data-w=\"irrigation\">irrigation<\/b> ditches, and their journey to Italy was a long <b class=\"vw\" data-w=\"trans\">trans<\/b>-Atlantic flight.<\/p>"}, {"tier": "AWL", "id": "AWL-F18", "html": "<p>Fire spread through Bella&#x27;s veins, a <b class=\"vw\" data-w=\"sensation\">sensation<\/b> unlike anything she had known; every <b class=\"vw\" data-w=\"capillary\">capillary<\/b> burned. There was no <b class=\"vw\" data-w=\"cure\">cure<\/b> for what she wanted, and she stopped looking for one. Renée once mentioned a neighbour&#x27;s <b class=\"vw\" data-w=\"chemotherapy\">chemotherapy<\/b>, unaware how far from ordinary medicine Bella&#x27;s world had become. Carlisle mentioned <b class=\"vw\" data-w=\"potassium\">potassium<\/b> levels out of habit, and wondered whether Renesmee was <b class=\"vw\" data-w=\"genetically\">genetically<\/b> something new. No <b class=\"vw\" data-w=\"bacteria\">bacteria<\/b> or virus could touch a changed body, and Bella joked that no <b class=\"vw\" data-w=\"vitamin\">vitamin<\/b> could replace the energy she felt near Edward.<\/p><p>Newborns were dangerously <b class=\"vw\" data-w=\"reactive\">reactive<\/b>, and their thirst seemed almost <b class=\"vw\" data-w=\"cyclic\">cyclic<\/b>. Jasper&#x27;s control felt <b class=\"vw\" data-w=\"elastic\">elastic<\/b> at best; the pack&#x27;s loyalty had a strange <b class=\"vw\" data-w=\"elasticity\">elasticity<\/b>, bending but never breaking. The pack took <b class=\"vw\" data-w=\"enforcement\">enforcement<\/b> of the borders seriously. Bella never wanted to be seen as <b class=\"vw\" data-w=\"prey\">prey<\/b>. Alice&#x27;s visions offered the only real <b class=\"vw\" data-w=\"clue\">clue<\/b> to the Volturi&#x27;s plans. <b class=\"vw\" data-w=\"friction\">Friction<\/b> between Jacob and Edward simmered under every polite word. Aro liked to <b class=\"vw\" data-w=\"dictate\">dictate<\/b> the fate of others, and issued a quiet <b class=\"vw\" data-w=\"directive\">directive<\/b> that no one in Forks should learn the truth.<\/p><p>Bella was in the same age <b class=\"vw\" data-w=\"bracket\">bracket<\/b> as most students at Forks High. Her human life now felt like a small <b class=\"vw\" data-w=\"parenthesis\">parenthesis<\/b> inside a larger story. Edward&#x27;s <b class=\"vw\" data-w=\"noble\">noble<\/b> refusal to change her only made her more determined. Carlisle&#x27;s <b class=\"vw\" data-w=\"wisdom\">wisdom<\/b> kept the family from fatal mistakes, and he worked to build a <b class=\"vw\" data-w=\"sustainable\">sustainable<\/b> life among humans. Charlie approached the engagement with stubborn <b class=\"vw\" data-w=\"realism\">realism<\/b>. Their early plan felt <b class=\"vw\" data-w=\"crude\">crude<\/b>, but there was no time to improve it. Edward <b class=\"vw\" data-w=\"deliberately\">deliberately<\/b> kept his distance when his control felt thin, and Bella found herself <b class=\"vw\" data-w=\"incline\">inclined<\/b> to trust him anyway.<\/p><p>The Cullens had a <b class=\"vw\" data-w=\"surplus\">surplus<\/b> of everything except time. Jasper managed the family&#x27;s <b class=\"vw\" data-w=\"portfolio\">portfolio<\/b> like a battle, and Alice joked that vampire secrecy had survived even <b class=\"vw\" data-w=\"globalization\">globalization<\/b>. Bella&#x27;s new senses made her bedroom feel <b class=\"vw\" data-w=\"alien\">alien<\/b>. The Cullens held no <b class=\"vw\" data-w=\"monopoly\">monopoly<\/b> on danger once the Volturi came, and adjusting to their <b class=\"vw\" data-w=\"lifestyle\">lifestyle<\/b> took time. Becoming a vampire seemed to <b class=\"vw\" data-w=\"invert\">invert<\/b> everything she believed. A single <b class=\"vw\" data-w=\"thread\">thread<\/b> of hope kept her going.<\/p><p>Edward&#x27;s feelings often seemed <b class=\"vw\" data-w=\"contradictory\">contradictory<\/b>. Emily&#x27;s kitchen smelled of <b class=\"vw\" data-w=\"clay\">clay<\/b> from her pottery, and even the brightest <b class=\"vw\" data-w=\"dye\">dye<\/b> looked dull to Bella&#x27;s new eyes. The rusted <b class=\"vw\" data-w=\"machinery\">machinery<\/b> of the old mill sat silent, and Bella had little <b class=\"vw\" data-w=\"leisure\">leisure<\/b> left once the wedding plans began.<\/p>"}, {"tier": "AWL", "id": "AWL-F19", "html": "<p>Jacob belonged to a <b class=\"vw\" data-w=\"tribe\">tribe<\/b> bound by legends far older than Forks. The <b class=\"vw\" data-w=\"damp\">damp<\/b> forest air clung to Bella&#x27;s skin whenever she visited La Push. Bella once tried to <b class=\"vw\" data-w=\"transcribe\">transcribe<\/b> her strange dreams. Even <b class=\"vw\" data-w=\"dilute\">diluted<\/b>, the scent of her blood tested Edward&#x27;s control. Glands in a vampire&#x27;s mouth <b class=\"vw\" data-w=\"secrete\">secrete<\/b> venom the moment the teeth break the skin. She bruised her <b class=\"vw\" data-w=\"hip\">hip<\/b> on the icy school steps.<\/p><p>Jasper had grown up in Texas, not far from an old <b class=\"vw\" data-w=\"plantation\">plantation<\/b>. He spoke about the double <b class=\"vw\" data-w=\"helix\">helix<\/b>, Mr Banner showed the class that sugar is <b class=\"vw\" data-w=\"soluble\">soluble<\/b> in water, and plants take in carbon <b class=\"vw\" data-w=\"dioxide\">dioxide<\/b> and release oxygen. Nothing about venom seemed to <b class=\"vw\" data-w=\"degrade\">degrade<\/b> over the years. Edward&#x27;s skin seemed to <b class=\"vw\" data-w=\"emit\">emit<\/b> a faint light in the sun. Carlisle mentioned, almost absently, that ordinary tests like <b class=\"vw\" data-w=\"urine\">urine<\/b> analysis meant nothing for Bella now. Newborn strength brought <b class=\"vw\" data-w=\"bodily\">bodily<\/b> changes she had not expected, and damp <b class=\"vw\" data-w=\"fungus\">fungus<\/b> grew along the fallen logs.<\/p><p>The Cullens were <b class=\"vw\" data-w=\"economically\">economically<\/b> secure, though the source of their wealth stayed unspoken. Alice watched every decision <b class=\"vw\" data-w=\"critically\">critically<\/b>. Jacob had to work past his own <b class=\"vw\" data-w=\"prejudice\">prejudice<\/b> before he could see Edward clearly. From that night <b class=\"vw\" data-w=\"onwards\">onwards<\/b>, Bella&#x27;s life was never ordinary. Jacob briefly considered himself part of an <b class=\"vw\" data-w=\"anti\">anti<\/b>-vampire group. Emmett loved to <b class=\"vw\" data-w=\"interrupt\">interrupt<\/b> tense moments with jokes. The Volturi&#x27;s rule depended on quiet <b class=\"vw\" data-w=\"domination\">domination<\/b>. Bella once imagined herself as an ordinary <b class=\"vw\" data-w=\"undergraduate\">undergraduate<\/b>, and Charlie joked that being <b class=\"vw\" data-w=\"unemployed\">unemployed<\/b> sounded easier than raising a teenager with secrets.<\/p><p>Edward&#x27;s protectiveness felt <b class=\"vw\" data-w=\"innate\">innate<\/b>. The wolves joked about hunting deer instead of anything as ordinary as a <b class=\"vw\" data-w=\"goat\">goat<\/b>. Bella&#x27;s calm acceptance of danger seemed to <b class=\"vw\" data-w=\"confound\">confound<\/b> everyone, and Carlisle remained perfectly <b class=\"vw\" data-w=\"competent\">competent<\/b> in surgery. Alice memorised the <b class=\"vw\" data-w=\"layout\">layout<\/b> of the Volturi&#x27;s chambers, and chose a silk <b class=\"vw\" data-w=\"fabric\">fabric<\/b> for Bella&#x27;s wedding dress. Carlisle kept a locked <b class=\"vw\" data-w=\"container\">container<\/b> of medical supplies. Bella drew on a hidden <b class=\"vw\" data-w=\"reservoir\">reservoir<\/b> of courage; her old life became a <b class=\"vw\" data-w=\"footnote\">footnote<\/b> to the new one. Emmett found his <b class=\"vw\" data-w=\"niche\">niche<\/b> in playful strength.<\/p><p>Alice&#x27;s warnings were often <b class=\"vw\" data-w=\"vague\">vague<\/b>. Edward would <b class=\"vw\" data-w=\"affirm\">affirm<\/b> again and again that he would never leave her. <b class=\"vw\" data-w=\"afterward\">Afterward<\/b>, Bella could barely remember the fight. Edward once played an old <b class=\"vw\" data-w=\"jazz\">jazz<\/b> record to make her smile. Carlisle&#x27;s stories stretched back into <b class=\"vw\" data-w=\"antiquity\">antiquity<\/b>. Every instinct said Edward should feel <b class=\"vw\" data-w=\"toxic\">toxic<\/b> to her, yet she never believed it.<\/p>"}, {"tier": "AWL", "id": "AWL-F20", "html": "<p>Forks recorded more <b class=\"vw\" data-w=\"precipitation\">precipitation<\/b> than almost anywhere else. The town had escaped the <b class=\"vw\" data-w=\"industrialization\">industrialization<\/b> that changed other places, and Carlisle&#x27;s home <b class=\"vw\" data-w=\"lab\">lab<\/b> held equipment no hospital would recognise. Bella once sat through an entire biology <b class=\"vw\" data-w=\"seminar\">seminar<\/b> without hearing a word. Mr Banner was away, so a <b class=\"vw\" data-w=\"sub\">sub<\/b> took the class and explained that table salt is sodium <b class=\"vw\" data-w=\"chloride\">chloride<\/b>.<\/p><p>Even at her weakest, Bella never let fear <b class=\"vw\" data-w=\"tempt\">tempt<\/b> her into giving up. Writing became an <b class=\"vw\" data-w=\"outlet\">outlet<\/b> for what she couldn&#x27;t say, and she kept her private thoughts too fragile to let anyone <b class=\"vw\" data-w=\"invade\">invade<\/b> them. No <b class=\"vw\" data-w=\"interviewer\">interviewer<\/b> would have believed her story. An <b class=\"vw\" data-w=\"apple\">apple<\/b> sat untouched on her desk. Alice acted as the family&#x27;s <b class=\"vw\" data-w=\"planner\">planner<\/b>. <b class=\"vw\" data-w=\"supposedly\">Supposedly<\/b>, no human had ever fallen in love with a vampire and survived. Bella&#x27;s <b class=\"vw\" data-w=\"gut\">gut<\/b> told her long before her mind admitted it that Edward wasn&#x27;t human, and hope seemed to <b class=\"vw\" data-w=\"swell\">swell<\/b> in her chest when she saw him.<\/p><p>Aro carried himself like an <b class=\"vw\" data-w=\"emperor\">emperor<\/b>. Carlisle joked that the Volturi ran less like a <b class=\"vw\" data-w=\"republic\">republic<\/b> than a monarchy, and Aro enjoyed finding ways to <b class=\"vw\" data-w=\"punish\">punish<\/b> disobedience. The clearing became an unlikely <b class=\"vw\" data-w=\"forum\">forum<\/b> where vampires argued their case. Even the smallest cut, once Bella began to <b class=\"vw\" data-w=\"bleed\">bleed<\/b>, changed the mood of a room. Something moved <b class=\"vw\" data-w=\"overhead\">overhead<\/b> in the trees. Emmett claimed he could out-calculate any <b class=\"vw\" data-w=\"processor\">processor<\/b>. The pack agreed to <b class=\"vw\" data-w=\"comply\">comply<\/b> with the treaty, and Jasper kept the finances so neat that no <b class=\"vw\" data-w=\"audit\">audit<\/b> could find a flaw.<\/p><p>Every Quileute <b class=\"vw\" data-w=\"legend\">legend<\/b> turned out to hold more truth than fiction. Alice found a small <b class=\"vw\" data-w=\"slot\">slot<\/b> of time when the danger faded. Constant fear seemed to <b class=\"vw\" data-w=\"drain\">drain<\/b> Bella&#x27;s strength, and her <b class=\"vw\" data-w=\"abdominal\">abdominal<\/b> pain during the pregnancy alarmed Carlisle. The Cullens avoided <b class=\"vw\" data-w=\"media\">media<\/b> attention. The mountain&#x27;s <b class=\"vw\" data-w=\"altitude\">altitude<\/b> left her breathless, and Jasper could <b class=\"vw\" data-w=\"gauge\">gauge<\/b> the mood of a room in seconds. Edward finally gave her the <b class=\"vw\" data-w=\"transparency\">transparency<\/b> she had begged for.<\/p><p>Bella&#x27;s mind went <b class=\"vw\" data-w=\"blank\">blank<\/b> when she saw him. Charlie thought of himself as a <b class=\"vw\" data-w=\"sensible\">sensible<\/b> man. Bella tried to <b class=\"vw\" data-w=\"weave\">weave<\/b> a plan through the tangled loyalties around her. Their final <b class=\"vw\" data-w=\"destination\">destination<\/b> was a clearing neither family wanted to reach, and one wrong word could <b class=\"vw\" data-w=\"precipitate\">precipitate<\/b> a battle. The change was more <b class=\"vw\" data-w=\"painful\">painful<\/b> than she had imagined. Bella never doubted the <b class=\"vw\" data-w=\"goodness\">goodness<\/b> at the centre of Edward. Esme&#x27;s kitchen smelled of <b class=\"vw\" data-w=\"yeast\">yeast<\/b>, though no one there could eat.<\/p>"}, {"tier": "AWL", "id": "AWL-F21", "html": "<p>In biology, Mr Banner introduced a visiting <b class=\"vw\" data-w=\"biologist\">biologist<\/b> who talked about the <b class=\"vw\" data-w=\"biodiversity\">biodiversity<\/b> of the forests around Forks. She showed slides of a <b class=\"vw\" data-w=\"snake\">snake<\/b> in dry grass, a dark <b class=\"vw\" data-w=\"fin\">fin<\/b> cutting through the water off La Push, and a river forming a wide <b class=\"vw\" data-w=\"delta\">delta<\/b> where it met the sea. She warned that <b class=\"vw\" data-w=\"pesticide\">pesticide<\/b> use was harming insects. Water, she added, is a <b class=\"vw\" data-w=\"solvent\">solvent<\/b> because it dissolves so many substances.<\/p><p>Bella listened to an <b class=\"vw\" data-w=\"audio\">audio<\/b> recording of Edward playing her lullaby. Losing him would <b class=\"vw\" data-w=\"subtract\">subtract<\/b> everything meaningful from her world; her life without him felt like herself <b class=\"vw\" data-w=\"minus\">minus<\/b> every certainty. Metal feels cold because of heat <b class=\"vw\" data-w=\"conduction\">conduction<\/b>, Mr Banner said, and Edward&#x27;s skin felt as cool and smooth as <b class=\"vw\" data-w=\"marble\">marble<\/b>. Not a single <b class=\"vw\" data-w=\"gram\">gram<\/b> of fear stopped her from choosing him. <b class=\"vw\" data-w=\"technically\">Technically<\/b>, she was still human the night she made her decision.<\/p><p>Every <b class=\"vw\" data-w=\"facet\">facet<\/b> of the Cullen family hid another layer. Alice liked to <b class=\"vw\" data-w=\"splice\">splice<\/b> fragments of vision together, and she acted as the family&#x27;s <b class=\"vw\" data-w=\"messenger\">messenger<\/b>. Alice also became Bella&#x27;s <b class=\"vw\" data-w=\"tutor\">tutor<\/b> in vampire manners. It felt <b class=\"vw\" data-w=\"incumbent\">incumbent<\/b> upon Carlisle to explain the danger before the newborns came; he remained the most gifted <b class=\"vw\" data-w=\"surgeon\">surgeon<\/b> the hospital had ever known. Emmett thought being a vampire was <b class=\"vw\" data-w=\"super\">super<\/b> fun. Jacob used <b class=\"vw\" data-w=\"aluminum\">aluminum<\/b> sheets to fix his garage roof, and Charlie warned that drivers are <b class=\"vw\" data-w=\"liable\">liable<\/b> for any damage they cause.<\/p><p>A <b class=\"vw\" data-w=\"chunk\">chunk<\/b> of Bella&#x27;s old life fell away when she chose immortality. No human explanation could give her story <b class=\"vw\" data-w=\"credibility\">credibility<\/b>. The word &quot;family&quot; carried a new <b class=\"vw\" data-w=\"connotation\">connotation<\/b>, and loyalty was the common <b class=\"vw\" data-w=\"denominator\">denominator<\/b> they all shared. Newborn strength gave her <b class=\"vw\" data-w=\"tremendous\">tremendous<\/b> power, and her <b class=\"vw\" data-w=\"flesh\">flesh<\/b> burned with venom. Sometimes she felt like a <b class=\"vw\" data-w=\"ghost\">ghost<\/b> of her old self, and fear settled deep in her <b class=\"vw\" data-w=\"marrow\">marrow<\/b> the night the newborns appeared. Every <b class=\"vw\" data-w=\"instinct\">instinct<\/b> told her to run.<\/p><p>The pack patrolled the <b class=\"vw\" data-w=\"fringe\">fringe<\/b> of their land. Forks never seemed likely to <b class=\"vw\" data-w=\"industrialize\">industrialize<\/b>. A single <b class=\"vw\" data-w=\"stripe\">stripe<\/b> of moonlight fell across the floor the night Edward first stayed until dawn. Being the <b class=\"vw\" data-w=\"junior\">junior<\/b> member of the coven never stopped Bella from having opinions. Edward could cross a <b class=\"vw\" data-w=\"kilometer\">kilometer<\/b> of forest faster than she could blink. An old stone <b class=\"vw\" data-w=\"slab\">slab<\/b> stood behind the Cullen house. Jacob stopped trying to <b class=\"vw\" data-w=\"hedge\">hedge<\/b> his feelings, and ocean <b class=\"vw\" data-w=\"spray\">spray<\/b> misted over the cliffs.<\/p>"}, {"tier": "AWL", "id": "AWL-F22", "html": "<p>In chemistry, Mr Banner explained that lemon juice is <b class=\"vw\" data-w=\"acidic\">acidic<\/b>, that in a salt solution the salt is the <b class=\"vw\" data-w=\"solute\">solute<\/b>, and that iron left out in the rain will <b class=\"vw\" data-w=\"oxidize\">oxidize<\/b> and turn to rust. Old thermometers full of <b class=\"vw\" data-w=\"mercury\">mercury<\/b> sat in Charlie&#x27;s garage. The biology class&#x27;s <b class=\"vw\" data-w=\"dissection\">dissection<\/b> lesson felt small next to Bella&#x27;s real life. A visiting college <b class=\"vw\" data-w=\"lecturer\">lecturer<\/b> at Forks High would never know how strange her life had become, and she barely passed a single <b class=\"vw\" data-w=\"quiz\">quiz<\/b> that term. Her English teacher told her to add a <b class=\"vw\" data-w=\"comma\">comma<\/b> before &quot;but&quot;.<\/p><p>Edward once suggested a <b class=\"vw\" data-w=\"cinema\">cinema<\/b> date, just for the ordinary novelty of it. Emmett pulled the <b class=\"vw\" data-w=\"plug\">plug<\/b> out of the wall before the old television could overheat. The <b class=\"vw\" data-w=\"naked\">naked<\/b> truth about the Cullens was harder to accept than any myth. Rosalie&#x27;s early <b class=\"vw\" data-w=\"indifference\">indifference<\/b> toward Bella slowly softened. No amount of time could <b class=\"vw\" data-w=\"erase\">erase<\/b> the night everything changed. A light <b class=\"vw\" data-w=\"powder\">powder<\/b> of snow covered the ground the morning she made her choice. Even a <b class=\"vw\" data-w=\"micro\">micro<\/b> expression on Edward&#x27;s face told her more than words.<\/p><p>Alice replayed the same short <b class=\"vw\" data-w=\"clip\">clip<\/b> of a vision. The Volturi could <b class=\"vw\" data-w=\"censor\">censor<\/b> knowledge of vampires with frightening efficiency, and no human <b class=\"vw\" data-w=\"portrayal\">portrayal<\/b> of a vampire matched what Bella saw. <b class=\"vw\" data-w=\"statistics\">Statistics<\/b> showed that very few crimes were reported in Forks. Edward traced the line of her <b class=\"vw\" data-w=\"thumb\">thumb<\/b>. Even in dark weeks, she felt an <b class=\"vw\" data-w=\"uplift\">uplift<\/b> when he smiled, and her stomach seemed to <b class=\"vw\" data-w=\"flip\">flip<\/b> at his voice. Her choices finally felt <b class=\"vw\" data-w=\"congruent\">congruent<\/b> with who she wanted to be.<\/p><p>A small <b class=\"vw\" data-w=\"parcel\">parcel<\/b> arrived the week before the wedding. Bella wanted to <b class=\"vw\" data-w=\"skip\">skip<\/b> past the fear. An old missing-persons <b class=\"vw\" data-w=\"poster\">poster<\/b> hung near the edge of town. No <b class=\"vw\" data-w=\"sword\">sword<\/b> could have protected her the way Edward did, and his <b class=\"vw\" data-w=\"photographic\">photographic<\/b> memory recalled every second since they met. Rosalie bought an antique mirror at an <b class=\"vw\" data-w=\"auction\">auction<\/b> in Seattle, and an old <b class=\"vw\" data-w=\"barrel\">barrel<\/b> sat rusting near the mill. Carlisle was Edward&#x27;s <b class=\"vw\" data-w=\"mentor\">mentor<\/b> in restraint.<\/p><p>Everything fitted <b class=\"vw\" data-w=\"nicely\">nicely<\/b>, at least in Bella&#x27;s mind. A <b class=\"vw\" data-w=\"lump\">lump<\/b> rose in her throat when she imagined leaving. That night in the clearing became a <b class=\"vw\" data-w=\"watershed\">watershed<\/b> for both families. Not even a <b class=\"vw\" data-w=\"liter\">liter<\/b> of animal blood could satisfy a newborn. The reception grew <b class=\"vw\" data-w=\"noisy\">noisy<\/b> and joyful. The Volturi&#x27;s <b class=\"vw\" data-w=\"headquarters\">headquarters<\/b> felt colder and older than anywhere she had been, run less like a <b class=\"vw\" data-w=\"multinational\">multinational<\/b> business than an ancient empire. Bella found Edward&#x27;s control <b class=\"vw\" data-w=\"phenomenal\">phenomenal<\/b>, and her life had become thoroughly <b class=\"vw\" data-w=\"bizarre\">bizarre<\/b>.<\/p>"}, {"tier": "AWL", "id": "AWL-F23", "html": "<p>Bella&#x27;s last ordinary <b class=\"vw\" data-w=\"semester\">semester<\/b> ended the same week her world changed. She barely remembered a single item on her <b class=\"vw\" data-w=\"syllabus\">syllabus<\/b>, and her imagined college <b class=\"vw\" data-w=\"campus\">campus<\/b> felt farther away than ever, along with any hope of <b class=\"vw\" data-w=\"postgraduate\">postgraduate<\/b> study. In maths, she learned that five <b class=\"vw\" data-w=\"factorial\">factorial<\/b> equals 120. Emmett used a metal bar as a <b class=\"vw\" data-w=\"lever\">lever<\/b> to lift a heavy rock, and Bella joked that his temper was as unstable as an overheated <b class=\"vw\" data-w=\"reactor\">reactor<\/b>.<\/p><p>Carlisle&#x27;s true <b class=\"vw\" data-w=\"specialty\">specialty<\/b> seemed to be patience. He checked a small <b class=\"vw\" data-w=\"mole\">mole<\/b> on Charlie&#x27;s arm and said it was nothing to worry about. Bella found it strange to <b class=\"vw\" data-w=\"socialize\">socialize<\/b> with humans again, and still felt like a <b class=\"vw\" data-w=\"novice\">novice<\/b> among the Cullens. Her understanding of the world had changed <b class=\"vw\" data-w=\"enormously\">enormously<\/b> in a single year. Alice&#x27;s <b class=\"vw\" data-w=\"clever\">clever<\/b> planning saved the family more than once, and she promised they would visit Italy <b class=\"vw\" data-w=\"sometime\">sometime<\/b>.<\/p><p>Jacob once tied a <b class=\"vw\" data-w=\"rope\">rope<\/b> swing above the water for Bella, and filled a <b class=\"vw\" data-w=\"bucket\">bucket<\/b> to cool the engine he was fixing. Bella wished she could <b class=\"vw\" data-w=\"swap\">swap<\/b> her fear for Alice&#x27;s certainty. Esme kept an old <b class=\"vw\" data-w=\"recipe\">recipe<\/b> book no one used. Bella hated flying, though eventually an <b class=\"vw\" data-w=\"airplane\">airplane<\/b> felt safer than staying still. Edward&#x27;s <b class=\"vw\" data-w=\"deflection\">deflection<\/b> of every hard question made her more curious, and she hated having to <b class=\"vw\" data-w=\"deceive\">deceive<\/b> Charlie. Alice kept her closet impossibly <b class=\"vw\" data-w=\"neat\">neat<\/b>. No ordinary <b class=\"vw\" data-w=\"descriptor\">descriptor<\/b> could capture what Edward was, and something dangerous moved <b class=\"vw\" data-w=\"underneath\">underneath<\/b> every calm conversation.<\/p><p>The old farmland near the reservation smelled faintly of <b class=\"vw\" data-w=\"herbicide\">herbicide<\/b>. Immortality came with the <b class=\"vw\" data-w=\"bonus\">bonus<\/b> of never fearing age. Alice&#x27;s visions made it feel as if they could <b class=\"vw\" data-w=\"cheat\">cheat<\/b> fate. Edward moved like a guided <b class=\"vw\" data-w=\"missile\">missile<\/b> when Bella was in danger, and Alice&#x27;s visions worked better than any <b class=\"vw\" data-w=\"radar\">radar<\/b>. Not even a <b class=\"vw\" data-w=\"bullet\">bullet<\/b> could stop what was hunting in the trees. Bella would <b class=\"vw\" data-w=\"rub\">rub<\/b> her temples when secrecy weighed on her, and tried to <b class=\"vw\" data-w=\"memorize\">memorize<\/b> every detail of that year. Carlisle once studied <b class=\"vw\" data-w=\"scripture\">scripture<\/b>, searching for meaning in his new existence.<\/p><p><b class=\"vw\" data-w=\"whoever\">Whoever<\/b> tried to hurt Bella would have to go through Edward first, and Alice promised to warn them <b class=\"vw\" data-w=\"whichever\">whichever<\/b> way the danger came. Jacob&#x27;s words carried a <b class=\"vw\" data-w=\"punch\">punch<\/b>. Esme&#x27;s <b class=\"vw\" data-w=\"artwork\">artwork<\/b> filled the hallways. Jacob eventually asked Bella&#x27;s <b class=\"vw\" data-w=\"pardon\">pardon<\/b>. Not a <b class=\"vw\" data-w=\"millimeter\">millimeter<\/b> of Edward&#x27;s control slipped, and everything about her new life felt <b class=\"vw\" data-w=\"incredible\">incredible<\/b>.<\/p>"}, {"tier": "AWL", "id": "AWL-F24", "html": "<p>Bella often felt <b class=\"vw\" data-w=\"halfway\">halfway<\/b> between the human world and Edward&#x27;s. Alice never missed a <b class=\"vw\" data-w=\"deadline\">deadline<\/b> when planning an escape, and her bedroom door shut with a <b class=\"vw\" data-w=\"bang\">bang<\/b> the night after Edward left Forks. Charlie&#x27;s house felt <b class=\"vw\" data-w=\"semi\">semi<\/b>-empty when Bella wandered into the woods. A single <b class=\"vw\" data-w=\"slash\">slash<\/b> of claws ended the fight. It seemed <b class=\"vw\" data-w=\"ridiculous\">ridiculous<\/b> that someone so beautiful could be so dangerous, and the Cullens lived a <b class=\"vw\" data-w=\"multi\">multi<\/b>-layered life.<\/p><p>Bella struggled with her <b class=\"vw\" data-w=\"homework\">homework<\/b> whenever Edward was near. Of her own <b class=\"vw\" data-w=\"volition\">volition<\/b>, she chose to stay in Forks. Keeping her secret from Charlie was <b class=\"vw\" data-w=\"tricky\">tricky<\/b>. The whole town seemed to <b class=\"vw\" data-w=\"cheer\">cheer<\/b> when spring came, and Emmett offered to <b class=\"vw\" data-w=\"shuttle\">shuttle<\/b> everyone to the baseball game in his huge Jeep. Alice sprayed hairspray from an <b class=\"vw\" data-w=\"aerosol\">aerosol<\/b> can to keep Bella&#x27;s curls in place. Edward moved with an <b class=\"vw\" data-w=\"athletic\">athletic<\/b> grace, and Jasper compared their plans to a game of <b class=\"vw\" data-w=\"chess\">chess<\/b>. Bella missed Edward <b class=\"vw\" data-w=\"terribly\">terribly<\/b> while he was gone.<\/p><p>Jacob&#x27;s growl was almost <b class=\"vw\" data-w=\"unintelligible\">unintelligible<\/b> when he first changed. Carlisle&#x27;s oldest painting dated from <b class=\"vw\" data-w=\"circa\">circa<\/b> 1650. Bella would <b class=\"vw\" data-w=\"scroll\">scroll<\/b> through old messages, searching for clues. No <b class=\"vw\" data-w=\"sponsorship\">sponsorship<\/b> or scholarship could have prepared her for this world. Her old phone charger had a broken <b class=\"vw\" data-w=\"connector\">connector<\/b>. Nothing about the Cullens felt <b class=\"vw\" data-w=\"nasty\">nasty<\/b> to her, and Edward moved <b class=\"vw\" data-w=\"incredibly\">incredibly<\/b> fast. The younger vampires seemed almost <b class=\"vw\" data-w=\"neo\">neo<\/b>-modern beside Carlisle&#x27;s old-world manners. As the newest <b class=\"vw\" data-w=\"entrant\">entrant<\/b> into the family, Bella had much to learn.<\/p><p>A <b class=\"vw\" data-w=\"hawk\">hawk<\/b> circled overhead as she and Jacob walked along the cliffs. Bella barely glanced at the teacher&#x27;s <b class=\"vw\" data-w=\"handout\">handout<\/b>. Alice&#x27;s phone was the newest <b class=\"vw\" data-w=\"tech\">tech<\/b>. Edward&#x27;s car keys sat on the <b class=\"vw\" data-w=\"rack\">rack<\/b> by the door. The audience burst into <b class=\"vw\" data-w=\"applause\">applause<\/b> when the school band finished. Mike acted as an unwilling <b class=\"vw\" data-w=\"d
