<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>English Learning</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/theme.js"></script>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: var(--text-faint);
        margin-bottom: 3rem;
        font-size: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.5rem;
        max-width: 720px;
        width: 100%;
      }

      .card {
        display: block;
        padding: 2rem;
        text-decoration: none;
        color: inherit;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--accent-tint), transparent);
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: var(--card-border-hover);
        background: var(--card-bg-hover);
      }

      .card:hover::before { opacity: 1; }

      .card-icon { font-size: 2rem; margin-bottom: 1rem; }

      .card-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-strong);
      }

      .card-desc {
        font-size: 0.9rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .card-arrow {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        color: var(--text-faint);
        transition: transform 0.2s ease, color 0.2s ease;
      }

      .card:hover .card-arrow {
        transform: translate(4px, -4px);
        color: var(--accent-purple);
      }
    </style>
  </head>
  <body>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">☾</button>
    <h1 class="gradient-text">English Learning</h1>
    <p class="subtitle">Select a notebook to open</p>
    <div class="grid" id="grid"></div>

    <script>
      const projects = [
        { href: "Voc.html", icon: "\u{1F4D6}", title: "Vocabulary", desc: "Word list with meanings and example sentences" },
        { href: "Writing%20Notes.html", icon: "✍", title: "Writing Notes", desc: "Notes and patterns for better English writing" },
        { href: "Phrasing%20notes/Phrasing%20Notes.dc.html", icon: "\u{1F4AC}", title: "Phrasing Notes", desc: "Natural phrasing and expressions, EN / 中文" }
      ];

      document.getElementById("grid").innerHTML = projects.map(p => `
        <a class="card" href="${p.href}">
          <div class="card-arrow">↗</div>
          <div class="card-icon">${p.icon}</div>
          <div class="card-title">${p.title}</div>
          <div class="card-desc">${p.desc}</div>
        </a>
      `).join("");
    </script>
  </body>
</html>
